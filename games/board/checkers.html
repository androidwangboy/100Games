<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>跳棋 - Checkers</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;
const BOARD_SIZE = 8;
const CELL = 52;
const BOARD_X = (W - CELL * BOARD_SIZE) / 2;
const BOARD_Y = (H - CELL * BOARD_SIZE) / 2;

let gameState = 'title'; // title, playing, gameover
let board = [];
let selectedPiece = null;
let validMoves = [];
let currentTurn = 'player'; // player or ai
let score = 0;
let aiScore = 0;
let message = '';
let mustContinueJump = null;
let animating = false;
let animPiece = null;
let animFrom = null;
let animTo = null;
let animProgress = 0;
let winner = '';

function initBoard() {
  board = [];
  for (let r = 0; r < 8; r++) {
    board[r] = [];
    for (let c = 0; c < 8; c++) {
      board[r][c] = null;
      if ((r + c) % 2 === 1) {
        if (r < 3) board[r][c] = { color: 'ai', king: false };
        else if (r > 4) board[r][c] = { color: 'player', king: false };
      }
    }
  }
  selectedPiece = null;
  validMoves = [];
  currentTurn = 'player';
  score = 0;
  aiScore = 0;
  mustContinueJump = null;
  message = '你的回合 - 点击棋子';
  winner = '';
}

function getJumps(r, c, brd) {
  const piece = brd[r][c];
  if (!piece) return [];
  const jumps = [];
  const dirs = piece.king ? [[-1,-1],[-1,1],[1,-1],[1,1]] :
    (piece.color === 'player' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);
  for (const [dr, dc] of dirs) {
    const mr = r + dr, mc = c + dc;
    const lr = r + dr*2, lc = c + dc*2;
    if (lr >= 0 && lr < 8 && lc >= 0 && lc < 8 && !brd[lr][lc] &&
        brd[mr][mc] && brd[mr][mc].color !== piece.color) {
      jumps.push({ from: [r,c], to: [lr,lc], captured: [mr,mc] });
    }
  }
  return jumps;
}

function getSimpleMoves(r, c, brd) {
  const piece = brd[r][c];
  if (!piece) return [];
  const moves = [];
  const dirs = piece.king ? [[-1,-1],[-1,1],[1,-1],[1,1]] :
    (piece.color === 'player' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);
  for (const [dr, dc] of dirs) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !brd[nr][nc]) {
      moves.push({ from: [r,c], to: [nr,nc], captured: null });
    }
  }
  return moves;
}

function getAllMoves(color, brd) {
  let allJumps = [];
  let allSimple = [];
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (brd[r][c] && brd[r][c].color === color) {
        allJumps.push(...getJumps(r, c, brd));
        allSimple.push(...getSimpleMoves(r, c, brd));
      }
    }
  }
  return allJumps.length > 0 ? allJumps : allSimple;
}

function applyMove(move, brd) {
  const nb = brd.map(row => row.map(cell => cell ? {...cell} : null));
  const piece = nb[move.from[0]][move.from[1]];
  nb[move.from[0]][move.from[1]] = null;
  nb[move.to[0]][move.to[1]] = piece;
  if (move.captured) {
    nb[move.captured[0]][move.captured[1]] = null;
  }
  if (piece.color === 'player' && move.to[0] === 0) piece.king = true;
  if (piece.color === 'ai' && move.to[0] === 7) piece.king = true;
  return nb;
}

function evaluate(brd) {
  let val = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (brd[r][c]) {
        const p = brd[r][c];
        let v = p.king ? 5 : 3;
        if (p.color === 'ai') {
          v += r * 0.1;
          val += v;
        } else {
          v += (7 - r) * 0.1;
          val -= v;
        }
      }
    }
  }
  return val;
}

function minimax(brd, depth, alpha, beta, isMax) {
  const color = isMax ? 'ai' : 'player';
  const moves = getAllMoves(color, brd);
  if (depth === 0 || moves.length === 0) {
    if (moves.length === 0) return isMax ? -1000 : 1000;
    return evaluate(brd);
  }
  if (isMax) {
    let best = -Infinity;
    for (const move of moves) {
      const nb = applyMove(move, brd);
      let val;
      if (move.captured) {
        const moreJumps = getJumps(move.to[0], move.to[1], nb);
        if (moreJumps.length > 0) {
          val = minimax(nb, depth, alpha, beta, true);
        } else {
          val = minimax(nb, depth - 1, alpha, beta, false);
        }
      } else {
        val = minimax(nb, depth - 1, alpha, beta, false);
      }
      best = Math.max(best, val);
      alpha = Math.max(alpha, val);
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const move of moves) {
      const nb = applyMove(move, brd);
      let val;
      if (move.captured) {
        const moreJumps = getJumps(move.to[0], move.to[1], nb);
        if (moreJumps.length > 0) {
          val = minimax(nb, depth, alpha, beta, false);
        } else {
          val = minimax(nb, depth - 1, alpha, beta, true);
        }
      } else {
        val = minimax(nb, depth - 1, alpha, beta, true);
      }
      best = Math.min(best, val);
      beta = Math.min(beta, val);
      if (beta <= alpha) break;
    }
    return best;
  }
}

function aiMove() {
  const moves = getAllMoves('ai', board);
  if (moves.length === 0) {
    winner = 'player';
    gameState = 'gameover';
    message = '你赢了！AI无棋可走';
    return;
  }
  let bestMove = moves[0];
  let bestVal = -Infinity;
  for (const move of moves) {
    const nb = applyMove(move, board);
    let val;
    if (move.captured) {
      const moreJumps = getJumps(move.to[0], move.to[1], nb);
      if (moreJumps.length > 0) {
        val = minimax(nb, 3, -Infinity, Infinity, true) + 2;
      } else {
        val = minimax(nb, 3, -Infinity, Infinity, false);
      }
    } else {
      val = minimax(nb, 3, -Infinity, Infinity, false);
    }
    if (val > bestVal) {
      bestVal = val;
      bestMove = move;
    }
  }
  executeAiMove(bestMove);
}

function executeAiMove(move) {
  animating = true;
  animPiece = {...board[move.from[0]][move.from[1]]};
  animFrom = move.from;
  animTo = move.to;
  animProgress = 0;
  const captured = move.captured;
  setTimeout(() => {
    board = applyMove(move, board);
    if (captured) aiScore++;
    animating = false;
    if (captured) {
      const moreJumps = getJumps(move.to[0], move.to[1], board);
      if (moreJumps.length > 0) {
        setTimeout(() => {
          const best = moreJumps.reduce((a, b) => {
            const va = minimax(applyMove(a, board), 2, -Infinity, Infinity, false);
            const vb = minimax(applyMove(b, board), 2, -Infinity, Infinity, false);
            return va > vb ? a : b;
          });
          executeAiMove(best);
        }, 300);
        return;
      }
    }
    currentTurn = 'player';
    message = '你的回合';
    checkGameOver();
  }, 300);
}

function checkGameOver() {
  let playerPieces = 0, aiPieces = 0;
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      if (board[r][c]) {
        if (board[r][c].color === 'player') playerPieces++;
        else aiPieces++;
      }
    }
  if (aiPieces === 0) { winner = 'player'; gameState = 'gameover'; message = '你赢了！'; }
  else if (playerPieces === 0) { winner = 'ai'; gameState = 'gameover'; message = 'AI赢了！'; }
  else if (getAllMoves('player', board).length === 0 && currentTurn === 'player') {
    winner = 'ai'; gameState = 'gameover'; message = 'AI赢了！你无棋可走';
  }
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  if (gameState === 'title') {
    if (mx > W/2-80 && mx < W/2+80 && my > 300 && my < 350) {
      gameState = 'playing';
      initBoard();
    }
    return;
  }
  if (gameState === 'gameover') {
    if (mx > W/2-80 && mx < W/2+80 && my > 320 && my < 370) {
      gameState = 'playing';
      initBoard();
    }
    return;
  }
  if (gameState !== 'playing' || currentTurn !== 'player' || animating) return;

  const c = Math.floor((mx - BOARD_X) / CELL);
  const r = Math.floor((my - BOARD_Y) / CELL);
  if (r < 0 || r >= 8 || c < 0 || c >= 8) return;

  if (mustContinueJump) {
    const move = validMoves.find(m => m.to[0] === r && m.to[1] === c);
    if (move) {
      board = applyMove(move, board);
      score++;
      const moreJumps = getJumps(r, c, board);
      if (moreJumps.length > 0) {
        mustContinueJump = [r, c];
        selectedPiece = [r, c];
        validMoves = moreJumps;
        message = '继续跳吃！';
      } else {
        mustContinueJump = null;
        selectedPiece = null;
        validMoves = [];
        currentTurn = 'ai';
        message = 'AI思考中...';
        checkGameOver();
        if (gameState === 'playing') setTimeout(aiMove, 500);
      }
    }
    return;
  }

  if (selectedPiece) {
    const move = validMoves.find(m => m.to[0] === r && m.to[1] === c);
    if (move) {
      board = applyMove(move, board);
      if (move.captured) score++;
      if (move.captured) {
        const moreJumps = getJumps(r, c, board);
        if (moreJumps.length > 0) {
          mustContinueJump = [r, c];
          selectedPiece = [r, c];
          validMoves = moreJumps;
          message = '继续跳吃！';
          return;
        }
      }
      selectedPiece = null;
      validMoves = [];
      currentTurn = 'ai';
      message = 'AI思考中...';
      checkGameOver();
      if (gameState === 'playing') setTimeout(aiMove, 500);
      return;
    }
  }

  if (board[r][c] && board[r][c].color === 'player') {
    const allMoves = getAllMoves('player', board);
    const hasJumps = allMoves.some(m => m.captured);
    const pieceMoves = allMoves.filter(m => m.from[0] === r && m.from[1] === c);
    if (hasJumps && !pieceMoves.some(m => m.captured)) {
      message = '必须跳吃！';
      return;
    }
    if (pieceMoves.length > 0) {
      selectedPiece = [r, c];
      validMoves = pieceMoves;
      message = '选择目标位置';
    }
  } else {
    selectedPiece = null;
    validMoves = [];
  }
});

function drawTitle() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('跳 棋', W/2, 150);
  ctx.fillStyle = '#ccc';
  ctx.font = '18px sans-serif';
  ctx.fillText('Checkers - 人机对战', W/2, 200);
  ctx.fillText('规则：强制跳吃，可连续跳吃，到达底线升王', W/2, 240);
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(W/2-80, 300, 160, 50);
  ctx.fillStyle = '#fff';
  ctx.font = '22px sans-serif';
  ctx.fillText('开始游戏', W/2, 332);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = winner === 'player' ? '#4ecdc4' : '#e94560';
  ctx.font = 'bold 42px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(message, W/2, 180);
  ctx.fillStyle = '#ccc';
  ctx.font = '20px sans-serif';
  ctx.fillText(`你吃子: ${score}  AI吃子: ${aiScore}`, W/2, 240);
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(W/2-80, 320, 160, 50);
  ctx.fillStyle = '#fff';
  ctx.font = '22px sans-serif';
  ctx.fillText('再来一局', W/2, 352);
}

function drawBoard() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const x = BOARD_X + c * CELL;
      const y = BOARD_Y + r * CELL;
      ctx.fillStyle = (r + c) % 2 === 0 ? '#2d2d44' : '#16213e';
      ctx.fillRect(x, y, CELL, CELL);
    }
  }
  // Highlight valid moves
  for (const m of validMoves) {
    const x = BOARD_X + m.to[1] * CELL;
    const y = BOARD_Y + m.to[0] * CELL;
    ctx.fillStyle = m.captured ? 'rgba(233,69,96,0.4)' : 'rgba(78,205,196,0.4)';
    ctx.fillRect(x, y, CELL, CELL);
  }
  // Selected highlight
  if (selectedPiece) {
    const x = BOARD_X + selectedPiece[1] * CELL;
    const y = BOARD_Y + selectedPiece[0] * CELL;
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 3;
    ctx.strokeRect(x+2, y+2, CELL-4, CELL-4);
  }
  // Draw pieces
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (board[r][c]) {
        drawPiece(r, c, board[r][c]);
      }
    }
  }
  // HUD
  ctx.fillStyle = '#ccc';
  ctx.font = '16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`你吃子: ${score}`, 10, 25);
  ctx.fillText(`AI吃子: ${aiScore}`, 10, 50);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd700';
  ctx.font = '16px sans-serif';
  ctx.fillText(message, W/2, H - 12);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#888';
  ctx.fillText('ESC 退出', W - 10, 25);
}

function drawPiece(r, c, piece) {
  const x = BOARD_X + c * CELL + CELL/2;
  const y = BOARD_Y + r * CELL + CELL/2;
  const radius = CELL * 0.38;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  if (piece.color === 'player') {
    ctx.fillStyle = '#e94560';
    ctx.fill();
    ctx.strokeStyle = '#ff6b6b';
  } else {
    ctx.fillStyle = '#4a90d9';
    ctx.fill();
    ctx.strokeStyle = '#74b9ff';
  }
  ctx.lineWidth = 2;
  ctx.stroke();
  if (piece.king) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', x, y);
    ctx.textBaseline = 'alphabetic';
  }
}

function gameLoop() {
  if (gameState === 'title') drawTitle();
  else if (gameState === 'playing') drawBoard();
  else if (gameState === 'gameover') { drawBoard(); drawGameOver(); }
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
