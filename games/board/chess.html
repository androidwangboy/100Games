<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>国际象棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; color: #ddd; }
#wrap { display: flex; gap: 16px; align-items: flex-start; }
canvas { border: 2px solid #333; background: #2b2b2b; cursor: pointer; }
#panel { width: 240px; background: #1c1c1c; border: 2px solid #333; padding: 12px; height: 480px; display: flex; flex-direction: column; }
h1 { font-size: 18px; color: #f0c060; margin-bottom: 8px; text-align: center; }
#status { font-size: 14px; padding: 8px; background: #262626; border-radius: 4px; margin-bottom: 8px; min-height: 40px; line-height: 1.4; }
.captured { font-size: 22px; min-height: 30px; line-height: 1; letter-spacing: 1px; }
.caplabel { font-size: 11px; color: #888; margin-top: 4px; }
#history { flex: 1; overflow-y: auto; background: #161616; border: 1px solid #333; padding: 6px; font-size: 12px; margin-top: 8px; font-family: Consolas, monospace; }
#history div { padding: 2px 4px; }
#history div:nth-child(odd) { background: #202020; }
.btns { display: flex; gap: 6px; margin-top: 8px; }
button { flex: 1; padding: 8px; background: #3a3a3a; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; font-size: 13px; }
button:hover { background: #4a4a4a; }
button:disabled { opacity: 0.4; cursor: default; }
#promo { position: absolute; display: none; background: #222; border: 2px solid #f0c060; padding: 8px; border-radius: 6px; z-index: 10; }
#promo span { font-size: 40px; cursor: pointer; padding: 4px 8px; }
#promo span:hover { background: #444; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="480"></canvas>
  <div id="panel">
    <h1>国际象棋</h1>
    <div id="status">白方走棋（你）</div>
    <div class="caplabel">你吃掉的棋子</div>
    <div class="captured" id="capByWhite"></div>
    <div class="caplabel">AI吃掉的棋子</div>
    <div class="captured" id="capByBlack"></div>
    <div id="history"></div>
    <div class="btns">
      <button id="btnNew">新对局</button>
      <button id="btnUndo">悔棋</button>
    </div>
  </div>
</div>
<div id="promo"></div>
<script>
// ===================== 国际象棋 完整实现 =====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SQ = 60;
const WHITE = 'w', BLACK = 'b';
const GLYPH = {
  'wK':'♔','wQ':'♕','wR':'♖','wB':'♗','wN':'♘','wP':'♙',
  'bK':'♚','bQ':'♛','bR':'♜','bB':'♝','bN':'♞','bP':'♟'
};
const PIECE_NAME = { K:'王', Q:'后', R:'车', B:'象', N:'马', P:'兵' };

// 棋子基础价值
const VAL = { P:100, N:320, B:330, R:500, Q:900, K:20000 };

// 位置评估表 (从白方视角, a8在索引0)
const PST = {
  P: [
     0,  0,  0,  0,  0,  0,  0,  0,
    50, 50, 50, 50, 50, 50, 50, 50,
    10, 10, 20, 30, 30, 20, 10, 10,
     5,  5, 10, 25, 25, 10,  5,  5,
     0,  0,  0, 20, 20,  0,  0,  0,
     5, -5,-10,  0,  0,-10, -5,  5,
     5, 10, 10,-20,-20, 10, 10,  5,
     0,  0,  0,  0,  0,  0,  0,  0],
  N: [
   -50,-40,-30,-30,-30,-30,-40,-50,
   -40,-20,  0,  0,  0,  0,-20,-40,
   -30,  0, 10, 15, 15, 10,  0,-30,
   -30,  5, 15, 20, 20, 15,  5,-30,
   -30,  0, 15, 20, 20, 15,  0,-30,
   -30,  5, 10, 15, 15, 10,  5,-30,
   -40,-20,  0,  5,  5,  0,-20,-40,
   -50,-40,-30,-30,-30,-30,-40,-50],
  B: [
   -20,-10,-10,-10,-10,-10,-10,-20,
   -10,  0,  0,  0,  0,  0,  0,-10,
   -10,  0,  5, 10, 10,  5,  0,-10,
   -10,  5,  5, 10, 10,  5,  5,-10,
   -10,  0, 10, 10, 10, 10,  0,-10,
   -10, 10, 10, 10, 10, 10, 10,-10,
   -10,  5,  0,  0,  0,  0,  5,-10,
   -20,-10,-10,-10,-10,-10,-10,-20],
  R: [
     0,  0,  0,  0,  0,  0,  0,  0,
     5, 10, 10, 10, 10, 10, 10,  5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
    -5,  0,  0,  0,  0,  0,  0, -5,
     0,  0,  0,  5,  5,  0,  0,  0],
  Q: [
   -20,-10,-10, -5, -5,-10,-10,-20,
   -10,  0,  0,  0,  0,  0,  0,-10,
   -10,  0,  5,  5,  5,  5,  0,-10,
    -5,  0,  5,  5,  5,  5,  0, -5,
     0,  0,  5,  5,  5,  5,  0, -5,
   -10,  5,  5,  5,  5,  5,  0,-10,
   -10,  0,  5,  0,  0,  0,  0,-10,
   -20,-10,-10, -5, -5,-10,-10,-20],
  K: [
   -30,-40,-40,-50,-50,-40,-40,-30,
   -30,-40,-40,-50,-50,-40,-40,-30,
   -30,-40,-40,-50,-50,-40,-40,-30,
   -30,-40,-40,-50,-50,-40,-40,-30,
   -20,-30,-30,-40,-40,-30,-30,-20,
   -10,-20,-20,-20,-20,-20,-20,-10,
    20, 20,  0,  0,  0,  0, 20, 20,
    20, 30, 10,  0,  0, 10, 30, 20]
};

// 棋盘状态: board[row][col], row 0 = 第8横线(黑方底线), row 7 = 第1横线(白方底线)
let board, turn, castling, enPassant, halfmove, fullmove;
let history = [];        // 走子历史 (用于悔棋与显示)
let stateStack = [];     // 完整状态栈
let selected = null;     // 当前选中 {r,c}
let legalForSelected = [];
let lastMove = null;     // {from:{r,c}, to:{r,c}}
let capturedByWhite = []; // 白方吃掉的(黑棋)
let capturedByBlack = []; // 黑方吃掉的(白棋)
let gameOver = false;
let aiThinking = false;
let pendingPromotion = null;
let score = 0;

function initialBoard() {
  const back = ['R','N','B','Q','K','B','N','R'];
  const b = Array.from({length:8}, () => Array(8).fill(null));
  for (let c = 0; c < 8; c++) {
    b[0][c] = { color: BLACK, type: back[c] };
    b[1][c] = { color: BLACK, type: 'P' };
    b[6][c] = { color: WHITE, type: 'P' };
    b[7][c] = { color: WHITE, type: back[c] };
  }
  return b;
}

function newGame() {
  board = initialBoard();
  turn = WHITE;
  castling = { wK: true, wQ: true, bK: true, bQ: true };
  enPassant = null;
  halfmove = 0;
  fullmove = 1;
  history = [];
  stateStack = [];
  selected = null;
  legalForSelected = [];
  lastMove = null;
  capturedByWhite = [];
  capturedByBlack = [];
  gameOver = false;
  aiThinking = false;
  pendingPromotion = null;
  score = 0;
  document.getElementById('history').innerHTML = '';
  updateStatus();
  draw();
}

function cloneState() {
  return {
    board: board.map(row => row.map(p => p ? {color:p.color, type:p.type} : null)),
    turn, castling: {...castling},
    enPassant: enPassant ? {...enPassant} : null,
    halfmove, fullmove,
    capturedByWhite: [...capturedByWhite],
    capturedByBlack: [...capturedByBlack],
    lastMove: lastMove ? {from:{...lastMove.from}, to:{...lastMove.to}} : null
  };
}

function restoreState(s) {
  board = s.board.map(row => row.map(p => p ? {color:p.color, type:p.type} : null));
  turn = s.turn;
  castling = {...s.castling};
  enPassant = s.enPassant ? {...s.enPassant} : null;
  halfmove = s.halfmove;
  fullmove = s.fullmove;
  capturedByWhite = [...s.capturedByWhite];
  capturedByBlack = [...s.capturedByBlack];
  lastMove = s.lastMove ? {from:{...s.lastMove.from}, to:{...s.lastMove.to}} : null;
}

const inBounds = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const opp = color => color === WHITE ? BLACK : WHITE;

// 生成伪合法走法 (不考虑被将军)
function pseudoMoves(bd, color, ep, cast) {
  const moves = [];
  const dir = color === WHITE ? -1 : 1;
  const startRow = color === WHITE ? 6 : 1;
  const promoRow = color === WHITE ? 0 : 7;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = bd[r][c];
      if (!p || p.color !== color) continue;
      if (p.type === 'P') {
        // 前进
        if (inBounds(r+dir, c) && !bd[r+dir][c]) {
          if (r+dir === promoRow) {
            ['Q','R','B','N'].forEach(pt => moves.push({from:{r,c}, to:{r:r+dir,c}, piece:'P', promo:pt}));
          } else {
            moves.push({from:{r,c}, to:{r:r+dir,c}, piece:'P'});
          }
          // 前进两格
          if (r === startRow && !bd[r+2*dir][c]) {
            moves.push({from:{r,c}, to:{r:r+2*dir,c}, piece:'P', double:true});
          }
        }
        // 吃子
        for (const dc of [-1, 1]) {
          const nr = r+dir, nc = c+dc;
          if (!inBounds(nr, nc)) continue;
          const t = bd[nr][nc];
          if (t && t.color !== color) {
            if (nr === promoRow) {
              ['Q','R','B','N'].forEach(pt => moves.push({from:{r,c}, to:{r:nr,c:nc}, piece:'P', capture:true, promo:pt}));
            } else {
              moves.push({from:{r,c}, to:{r:nr,c:nc}, piece:'P', capture:true});
            }
          } else if (ep && ep.r === nr && ep.c === nc) {
            moves.push({from:{r,c}, to:{r:nr,c:nc}, piece:'P', capture:true, enpassant:true});
          }
        }
      } else if (p.type === 'N') {
        const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (const [dr,dc] of jumps) {
          const nr=r+dr, nc=c+dc;
          if (!inBounds(nr,nc)) continue;
          const t = bd[nr][nc];
          if (!t || t.color !== color) moves.push({from:{r,c}, to:{r:nr,c:nc}, piece:'N', capture:!!t});
        }
      } else if (p.type === 'K') {
        for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
          if (!dr && !dc) continue;
          const nr=r+dr, nc=c+dc;
          if (!inBounds(nr,nc)) continue;
          const t = bd[nr][nc];
          if (!t || t.color !== color) moves.push({from:{r,c}, to:{r:nr,c:nc}, piece:'K', capture:!!t});
        }
        // 王车易位
        const row = color === WHITE ? 7 : 0;
        if (r === row && c === 4) {
          const kSide = color === WHITE ? cast.wK : cast.bK;
          const qSide = color === WHITE ? cast.wQ : cast.bQ;
          if (kSide && !bd[row][5] && !bd[row][6] && bd[row][7] && bd[row][7].type === 'R' && bd[row][7].color === color) {
            if (!isAttacked(bd, row, 4, opp(color)) && !isAttacked(bd, row, 5, opp(color)) && !isAttacked(bd, row, 6, opp(color))) {
              moves.push({from:{r,c}, to:{r:row,c:6}, piece:'K', castle:'K'});
            }
          }
          if (qSide && !bd[row][3] && !bd[row][2] && !bd[row][1] && bd[row][0] && bd[row][0].type === 'R' && bd[row][0].color === color) {
            if (!isAttacked(bd, row, 4, opp(color)) && !isAttacked(bd, row, 3, opp(color)) && !isAttacked(bd, row, 2, opp(color))) {
              moves.push({from:{r,c}, to:{r:row,c:2}, piece:'K', castle:'Q'});
            }
          }
        }
      } else {
        // 滑行子: B R Q
        let dirs = [];
        if (p.type === 'B' || p.type === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
        if (p.type === 'R' || p.type === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
        for (const [dr,dc] of dirs) {
          let nr=r+dr, nc=c+dc;
          while (inBounds(nr,nc)) {
            const t = bd[nr][nc];
            if (!t) { moves.push({from:{r,c}, to:{r:nr,c:nc}, piece:p.type}); }
            else {
              if (t.color !== color) moves.push({from:{r,c}, to:{r:nr,c:nc}, piece:p.type, capture:true});
              break;
            }
            nr+=dr; nc+=dc;
          }
        }
      }
    }
  }
  return moves;
}

// 判断 (r,c) 是否被 byColor 攻击
function isAttacked(bd, r, c, byColor) {
  // 兵攻击
  const pdir = byColor === WHITE ? 1 : -1; // 白兵从下方攻击 (即从 r+1 攻击 r)
  for (const dc of [-1, 1]) {
    const nr = r + pdir, nc = c + dc;
    if (inBounds(nr,nc)) {
      const p = bd[nr][nc];
      if (p && p.color === byColor && p.type === 'P') return true;
    }
  }
  // 马
  const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
  for (const [dr,dc] of jumps) {
    const nr=r+dr, nc=c+dc;
    if (inBounds(nr,nc)) {
      const p = bd[nr][nc];
      if (p && p.color === byColor && p.type === 'N') return true;
    }
  }
  // 王 (相邻)
  for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
    if (!dr && !dc) continue;
    const nr=r+dr, nc=c+dc;
    if (inBounds(nr,nc)) {
      const p = bd[nr][nc];
      if (p && p.color === byColor && p.type === 'K') return true;
    }
  }
  // 滑行子
  const diag = [[-1,-1],[-1,1],[1,-1],[1,1]];
  const orth = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr,dc] of diag) {
    let nr=r+dr, nc=c+dc;
    while (inBounds(nr,nc)) {
      const p = bd[nr][nc];
      if (p) {
        if (p.color === byColor && (p.type === 'B' || p.type === 'Q')) return true;
        break;
      }
      nr+=dr; nc+=dc;
    }
  }
  for (const [dr,dc] of orth) {
    let nr=r+dr, nc=c+dc;
    while (inBounds(nr,nc)) {
      const p = bd[nr][nc];
      if (p) {
        if (p.color === byColor && (p.type === 'R' || p.type === 'Q')) return true;
        break;
      }
      nr+=dr; nc+=dc;
    }
  }
  return false;
}

function findKing(bd, color) {
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
    const p = bd[r][c];
    if (p && p.color === color && p.type === 'K') return {r,c};
  }
  return null;
}

function inCheck(bd, color) {
  const k = findKing(bd, color);
  if (!k) return false;
  return isAttacked(bd, k.r, k.c, opp(color));
}

// 在临时棋盘上执行走法, 返回新棋盘 (用于合法性检测)
function applyOnBoard(bd, m) {
  const nb = bd.map(row => row.slice());
  const piece = nb[m.from.r][m.from.c];
  nb[m.to.r][m.to.c] = piece;
  nb[m.from.r][m.from.c] = null;
  if (m.enpassant) {
    nb[m.from.r][m.to.c] = null;
  }
  if (m.promo) {
    nb[m.to.r][m.to.c] = { color: piece.color, type: m.promo };
  }
  if (m.castle === 'K') {
    const row = m.from.r;
    nb[row][5] = nb[row][7]; nb[row][7] = null;
  } else if (m.castle === 'Q') {
    const row = m.from.r;
    nb[row][3] = nb[row][0]; nb[row][0] = null;
  }
  return nb;
}

// 生成合法走法
function legalMoves(bd, color, ep, cast) {
  const pseudo = pseudoMoves(bd, color, ep, cast);
  const legal = [];
  for (const m of pseudo) {
    const nb = applyOnBoard(bd, m);
    if (!inCheck(nb, color)) legal.push(m);
  }
  return legal;
}

// 实际执行走法 (修改全局状态)
function makeMove(m) {
  stateStack.push(cloneState());
  const piece = board[m.from.r][m.from.c];
  const captured = board[m.to.r][m.to.c];
  let capturedPiece = captured;
  let capSq = m.to;

  // 记录吃子
  if (m.enpassant) {
    capturedPiece = board[m.from.r][m.to.c];
    capSq = { r: m.from.r, c: m.to.c };
  }
  if (capturedPiece) {
    if (piece.color === WHITE) capturedByWhite.push(capturedPiece.type);
    else capturedByBlack.push(capturedPiece.type);
  }

  // 移动
  board[m.to.r][m.to.c] = piece;
  board[m.from.r][m.from.c] = null;
  if (m.enpassant) board[m.from.r][m.to.c] = null;
  if (m.promo) board[m.to.r][m.to.c] = { color: piece.color, type: m.promo };

  // 易位 rook 移动
  if (m.castle === 'K') {
    const row = m.from.r;
    board[row][5] = board[row][7]; board[row][7] = null;
  } else if (m.castle === 'Q') {
    const row = m.from.r;
    board[row][3] = board[row][0]; board[row][0] = null;
  }

  // 更新易位权
  if (piece.type === 'K') {
    if (piece.color === WHITE) { castling.wK = false; castling.wQ = false; }
    else { castling.bK = false; castling.bQ = false; }
  }
  if (piece.type === 'R') {
    if (m.from.r === 7 && m.from.c === 0) castling.wQ = false;
    if (m.from.r === 7 && m.from.c === 7) castling.wK = false;
    if (m.from.r === 0 && m.from.c === 0) castling.bQ = false;
    if (m.from.r === 0 && m.from.c === 7) castling.bK = false;
  }
  // 车被吃
  if (m.to.r === 7 && m.to.c === 0) castling.wQ = false;
  if (m.to.r === 7 && m.to.c === 7) castling.wK = false;
  if (m.to.r === 0 && m.to.c === 0) castling.bQ = false;
  if (m.to.r === 0 && m.to.c === 7) castling.bK = false;

  // 更新 en passant
  if (m.double) {
    enPassant = { r: (m.from.r + m.to.r) / 2, c: m.from.c };
  } else {
    enPassant = null;
  }

  // 半回合计数
  if (piece.type === 'P' || capturedPiece) halfmove = 0;
  else halfmove++;

  lastMove = { from: {r:m.from.r, c:m.from.c}, to: {r:m.to.r, c:m.to.c} };

  // 记录历史 (代数记谱)
  const notation = toNotation(m, piece, capturedPiece);
  if (turn === BLACK) fullmove++;
  history.push({ color: turn, notation, move: m });

  turn = opp(turn);
  updateHistoryPanel(notation);
}

function toNotation(m, piece, captured) {
  if (m.castle === 'K') return 'O-O';
  if (m.castle === 'Q') return 'O-O-O';
  const files = 'abcdefgh';
  const fromSq = files[m.from.c] + (8 - m.from.r);
  const toSq = files[m.to.c] + (8 - m.to.r);
  let s = '';
  if (piece.type === 'P') {
    if (captured || m.enpassant) s = files[m.from.c] + 'x';
    s += toSq;
    if (m.promo) s += '=' + m.promo;
  } else {
    s = piece.type;
    if (captured) s += 'x';
    s += toSq;
  }
  return s;
}

function updateHistoryPanel(notation) {
  const div = document.getElementById('history');
  if (history.length % 2 === 1) {
    const num = Math.ceil(history.length / 2);
    const row = document.createElement('div');
    row.textContent = num + '. ' + notation;
    row.dataset.idx = num;
    div.appendChild(row);
  } else {
    const rows = div.querySelectorAll('div');
    const last = rows[rows.length - 1];
    if (last) last.textContent += '  ' + notation;
  }
  div.scrollTop = div.scrollHeight;
}

// ===================== AI: minimax + alpha-beta =====================
function evaluate(bd) {
  let score = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = bd[r][c];
      if (!p) continue;
      const idx = p.color === WHITE ? r * 8 + c : (7 - r) * 8 + c;
      const v = VAL[p.type] + PST[p.type][idx];
      score += p.color === WHITE ? v : -v;
    }
  }
  return score; // 正 = 白方优势
}

function orderMoves(moves) {
  // 吃子优先 (MVV-LVA 简化)
  return moves.sort((a, b) => (b.capture ? 1 : 0) - (a.capture ? 1 : 0));
}

function minimax(bd, depth, alpha, beta, maximizing, color, ep, cast) {
  const moves = legalMoves(bd, color, ep, cast);
  if (moves.length === 0) {
    if (inCheck(bd, color)) {
      // 被将死: 给走子方极差分数
      return maximizing ? -100000 - depth : 100000 + depth;
    }
    return 0; // 逼和
  }
  if (depth === 0) return evaluate(bd);

  orderMoves(moves);
  if (maximizing) {
    let best = -Infinity;
    for (const m of moves) {
      const nb = applyOnBoard(bd, m);
      let nep = m.double ? { r: (m.from.r + m.to.r) / 2, c: m.from.c } : null;
      const ncast = updateCastlingForSearch(cast, m, bd);
      const val = minimax(nb, depth - 1, alpha, beta, false, opp(color), nep, ncast);
      if (val > best) best = val;
      if (best > alpha) alpha = best;
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const m of moves) {
      const nb = applyOnBoard(bd, m);
      let nep = m.double ? { r: (m.from.r + m.to.r) / 2, c: m.from.c } : null;
      const ncast = updateCastlingForSearch(cast, m, bd);
      const val = minimax(nb, depth - 1, alpha, beta, true, opp(color), nep, ncast);
      if (val < best) best = val;
      if (best < beta) beta = best;
      if (beta <= alpha) break;
    }
    return best;
  }
}

function updateCastlingForSearch(cast, m, bd) {
  const nc = {...cast};
  const piece = bd[m.from.r][m.from.c];
  if (!piece) return nc;
  if (piece.type === 'K') {
    if (piece.color === WHITE) { nc.wK = false; nc.wQ = false; }
    else { nc.bK = false; nc.bQ = false; }
  }
  if (piece.type === 'R') {
    if (m.from.r === 7 && m.from.c === 0) nc.wQ = false;
    if (m.from.r === 7 && m.from.c === 7) nc.wK = false;
    if (m.from.r === 0 && m.from.c === 0) nc.bQ = false;
    if (m.from.r === 0 && m.from.c === 7) nc.bK = false;
  }
  return nc;
}

function aiMove() {
  aiThinking = true;
  updateStatus();
  setTimeout(() => {
    const moves = legalMoves(board, BLACK, enPassant, castling);
    if (moves.length === 0) { aiThinking = false; checkGameEnd(); draw(); return; }
    let best = null, bestVal = Infinity;
    const candidates = [];
    for (const m of moves) {
      const nb = applyOnBoard(board, m);
      let nep = m.double ? { r: (m.from.r + m.to.r) / 2, c: m.from.c } : null;
      const ncast = updateCastlingForSearch(castling, m, board);
      const val = minimax(nb, 2, -Infinity, Infinity, true, WHITE, nep, ncast);
      // 加少量随机以避免单调
      const jitter = (Math.random() - 0.5) * 8;
      const total = val + jitter;
      candidates.push({ m, val: total });
      if (total < bestVal) { bestVal = total; best = m; }
    }
    if (best) {
      makeMove(best);
      selected = null;
      legalForSelected = [];
      checkGameEnd();
    }
    aiThinking = false;
    updateStatus();
    draw();
  }, 60);
}

// ===================== 游戏结束检测 =====================
function checkGameEnd() {
  const moves = legalMoves(board, turn, enPassant, castling);
  if (moves.length === 0) {
    gameOver = true;
    if (inCheck(board, turn)) {
      const winner = opp(turn);
      score = capturedByWhite.length * 10 + 100;
      if (winner === WHITE) {
        setStatus('将死！ 你赢了！ 🎉');
      } else {
        setStatus('将死！ AI 获胜');
      }
    } else {
      setStatus('逼和（无子可动）— 平局');
    }
    return true;
  }
  if (halfmove >= 100) {
    gameOver = true;
    setStatus('50回合规则 — 平局');
    return true;
  }
  // 子力不足
  if (insufficientMaterial()) {
    gameOver = true;
    setStatus('子力不足 — 平局');
    return true;
  }
  return false;
}

function insufficientMaterial() {
  const pieces = [];
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
    const p = board[r][c];
    if (p && p.type !== 'K') pieces.push(p.type);
  }
  if (pieces.length === 0) return true;
  if (pieces.length === 1 && (pieces[0] === 'B' || pieces[0] === 'N')) return true;
  return false;
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function updateStatus() {
  if (gameOver) return;
  if (aiThinking) { setStatus('AI 思考中…'); return; }
  const chk = inCheck(board, turn);
  if (turn === WHITE) {
    setStatus(chk ? '你被将军！必须应将' : '白方走棋（你）');
  } else {
    setStatus(chk ? 'AI 被将军' : '黑方走棋（AI）');
  }
  // 更新吃子显示
  document.getElementById('capByWhite').textContent =
    capturedByWhite.map(t => GLYPH['b'+t]).join('');
  document.getElementById('capByBlack').textContent =
    capturedByBlack.map(t => GLYPH['w'+t]).join('');
}

// ===================== 渲染 =====================
function draw() {
  ctx.clearRect(0, 0, 480, 480);
  // 棋盘
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const light = (r + c) % 2 === 0;
      ctx.fillStyle = light ? '#e8d5a8' : '#9c7a4d';
      ctx.fillRect(c * SQ, r * SQ, SQ, SQ);
    }
  }
  // 上一步高亮
  if (lastMove) {
    ctx.fillStyle = 'rgba(240, 200, 80, 0.4)';
    ctx.fillRect(lastMove.from.c * SQ, lastMove.from.r * SQ, SQ, SQ);
    ctx.fillRect(lastMove.to.c * SQ, lastMove.to.r * SQ, SQ, SQ);
  }
  // 选中高亮
  if (selected) {
    ctx.fillStyle = 'rgba(80, 180, 255, 0.5)';
    ctx.fillRect(selected.c * SQ, selected.r * SQ, SQ, SQ);
  }
  // 合法走法标记
  for (const m of legalForSelected) {
    const x = m.to.c * SQ + SQ / 2;
    const y = m.to.r * SQ + SQ / 2;
    if (m.capture || board[m.to.r][m.to.c]) {
      ctx.strokeStyle = 'rgba(220, 60, 60, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, SQ / 2 - 5, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(60, 60, 60, 0.4)';
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // 将军: 王红色高亮
  const chk = inCheck(board, turn);
  if (chk && !gameOver) {
    const k = findKing(board, turn);
    if (k) {
      ctx.fillStyle = 'rgba(220, 40, 40, 0.55)';
      ctx.fillRect(k.c * SQ, k.r * SQ, SQ, SQ);
    }
  }
  // 棋子
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '46px "Segoe UI Symbol", "Arial Unicode MS", serif';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (!p) continue;
      const x = c * SQ + SQ / 2;
      const y = r * SQ + SQ / 2 + 2;
      // 阴影
      ctx.fillStyle = p.color === WHITE ? 'rgba(0,0,0,0.35)' : 'rgba(255,255,255,0.15)';
      ctx.fillText(GLYPH[p.color + p.type], x + 1.5, y + 2);
      ctx.fillStyle = p.color === WHITE ? '#fdfdfd' : '#1a1a1a';
      ctx.fillText(GLYPH[p.color + p.type], x, y);
    }
  }
  // 坐标
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'left';
  for (let r = 0; r < 8; r++) {
    ctx.fillText(8 - r, 2, r * SQ + 10);
  }
  ctx.textAlign = 'right';
  for (let c = 0; c < 8; c++) {
    ctx.fillText('abcdefgh'[c], c * SQ + SQ - 3, 478);
  }
}

// ===================== 交互 =====================
canvas.addEventListener('click', e => {
  if (gameOver || aiThinking || turn !== WHITE) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const c = Math.floor(x / SQ);
  const r = Math.floor(y / SQ);
  if (!inBounds(r, c)) return;

  // 如果点击的是合法目标 -> 走子
  if (selected) {
    const target = legalForSelected.filter(m => m.to.r === r && m.to.c === c);
    if (target.length > 0) {
      // 升变选择
      if (target[0].promo) {
        showPromotion(r, c, target);
        return;
      }
      makeMove(target[0]);
      selected = null;
      legalForSelected = [];
      draw();
      if (!checkGameEnd()) {
        updateStatus();
        aiMove();
      } else {
        updateStatus();
        draw();
      }
      return;
    }
  }

  // 选择己方棋子
  const p = board[r][c];
  if (p && p.color === WHITE) {
    selected = { r, c };
    const all = legalMoves(board, WHITE, enPassant, castling);
    legalForSelected = all.filter(m => m.from.r === r && m.from.c === c);
  } else {
    selected = null;
    legalForSelected = [];
  }
  draw();
});

function showPromotion(r, c, targets) {
  const promo = document.getElementById('promo');
  promo.innerHTML = '';
  ['Q','R','B','N'].forEach(pt => {
    const span = document.createElement('span');
    span.textContent = GLYPH['w' + pt];
    span.onclick = () => {
      const m = targets.find(t => t.promo === pt);
      promo.style.display = 'none';
      makeMove(m);
      selected = null;
      legalForSelected = [];
      draw();
      if (!checkGameEnd()) {
        updateStatus();
        aiMove();
      } else {
        updateStatus();
        draw();
      }
    };
    promo.appendChild(span);
  });
  const rect = canvas.getBoundingClientRect();
  promo.style.left = (rect.left + c * SQ) + 'px';
  promo.style.top = (rect.top + r * SQ - 20) + 'px';
  promo.style.display = 'block';
}

document.getElementById('btnNew').addEventListener('click', newGame);
document.getElementById('btnUndo').addEventListener('click', () => {
  if (aiThinking || stateStack.length < 2) {
    if (stateStack.length === 1) {
      // 只回退一步
    } else return;
  }
  // 回退 AI 的一步 + 玩家的一步
  let steps = stateStack.length >= 2 ? 2 : 1;
  for (let i = 0; i < steps && stateStack.length > 0; i++) {
    restoreState(stateStack.pop());
    history.pop();
  }
  // 重建历史面板
  rebuildHistoryPanel();
  gameOver = false;
  selected = null;
  legalForSelected = [];
  updateStatus();
  draw();
});

function rebuildHistoryPanel() {
  const div = document.getElementById('history');
  div.innerHTML = '';
  for (let i = 0; i < history.length; i += 2) {
    const num = i / 2 + 1;
    const row = document.createElement('div');
    let txt = num + '. ' + history[i].notation;
    if (history[i+1]) txt += '  ' + history[i+1].notation;
    row.textContent = txt;
    div.appendChild(row);
  }
  div.scrollTop = div.scrollHeight;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});

newGame();
</script>
