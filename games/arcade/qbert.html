<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Q*bert - 跳方块</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let state = 'title', score = 0, lives = 3, level = 1, hiScore = 0;
let cubes = [], player = null, enemies = [], balls = [], discs = [];
let particles = [], hopAnim = 0, levelComplete = false, levelTimer = 0;
let swearTimer = 0, swearText = '', frameCount = 0, lastTime = 0;
let spawnTimer = 0, ballTimer = 0, bgHue = 0;
const ROWS = 7, CUBE_W = 48, CUBE_H = 28;
const BASE_X = 400, BASE_Y = 95;
const COLOR_SETS = [
  { base: '#2244aa', target: '#ffcc00', name: '蓝变金' },
  { base: '#225522', target: '#ff6699', name: '绿变粉' },
  { base: '#442255', target: '#66ffcc', name: '紫变青' },
  { base: '#554422', target: '#cc66ff', name: '棕变紫' },
  { base: '#224444', target: '#ff8844', name: '青变橙' }
];
const SWEARS = ['@#$%!', '#!@%', '$@#!', '%!@#', '!#$@'];

function cubePos(row, col) {
  let x = BASE_X + (col - row / 2) * CUBE_W;
  let y = BASE_Y + row * (CUBE_H + 14);
  return { x, y };
}

function initLevel() {
  cubes = [];
  let colorSet = COLOR_SETS[(level - 1) % COLOR_SETS.length];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c <= r; c++) {
      let pos = cubePos(r, c);
      cubes.push({ row: r, col: c, x: pos.x, y: pos.y, color: colorSet.base, target: colorSet.target, changed: false, flashTimer: 0 });
    }
  }
  player = { row: 0, col: 0, x: BASE_X, y: BASE_Y - 22, alive: true, hopping: false, hopT: 0, fromX: 0, fromY: 0, toX: 0, toY: 0, falling: false, facing: 1, animFrame: 0 };
  enemies = [];
  balls = [];
  discs = [];
  levelComplete = false;
  levelTimer = 0;
  spawnTimer = 0;
  ballTimer = 0;
  // Add discs on sides for escape
  if (level > 1) {
    let discRow = 2 + Math.floor(Math.random() * 3);
    let pos = cubePos(discRow, -1);
    discs.push({ x: pos.x - 20, y: pos.y, row: discRow, side: 'left', used: false, angle: 0 });
    let pos2 = cubePos(discRow, discRow + 1);
    discs.push({ x: pos2.x + 20, y: pos2.y, row: discRow, side: 'right', used: false, angle: 0 });
  }
  spawnEnemy();
}

function spawnEnemy() {
  let type = Math.random() < 0.35 + level * 0.05 ? 'coily' : 'redball';
  let startCol = Math.random() < 0.5 ? 0 : 1;
  let pos = cubePos(0, startCol);
  enemies.push({
    type, row: 0, col: startCol, x: pos.x, y: pos.y - 22,
    moveTimer: 0, alive: true, hopping: false, hopT: 0,
    fromX: pos.x, fromY: pos.y - 22, toX: pos.x, toY: pos.y - 22,
    isEgg: type === 'coily', eggTimer: 100 + Math.random() * 60,
    falling: false, animFrame: Math.random() * 10
  });
}

function spawnBall() {
  let startCol = Math.random() < 0.5 ? 0 : 1;
  let pos = cubePos(0, startCol);
  balls.push({ row: 0, col: startCol, x: pos.x, y: pos.y - 22, moveTimer: 0, hopping: false, hopT: 0, fromX: pos.x, fromY: pos.y - 22, toX: pos.x, toY: pos.y - 22, falling: false, dead: false });
}

function getCube(row, col) {
  return cubes.find(c => c.row === row && c.col === col);
}

function hopEntity(ent, dr, dc) {
  let nr = ent.row + dr, nc = ent.col + dc;
  let target = getCube(nr, nc);
  ent.fromX = ent.x; ent.fromY = ent.y;
  if (target) {
    ent.row = nr; ent.col = nc;
    ent.toX = target.x; ent.toY = target.y - 22;
    ent.falling = false;
  } else {
    let pos = cubePos(nr, nc);
    ent.toX = pos.x; ent.toY = pos.y + 120;
    ent.falling = true;
  }
  ent.hopping = true; ent.hopT = 0;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 1) * 5, life: 25 + Math.random() * 25, color, size: 2 + Math.random() * 4 });
  }
}

function update(dt) {
  if (state !== 'play') return;
  frameCount += dt;
  bgHue = (bgHue + dt * 0.1) % 360;
  levelTimer += dt;
  if (player) player.animFrame += dt * 0.15;

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (swearTimer > 0) swearTimer -= dt;

  for (let c of cubes) { if (c.flashTimer > 0) c.flashTimer -= dt; }
  for (let d of discs) { d.angle += dt * 0.05; }

  if (levelComplete) {
    levelTimer += dt;
    if (levelTimer > 100) { level++; initLevel(); }
    return;
  }

  // Player hop animation
  if (player.hopping) {
    player.hopT += dt * 0.07;
    if (player.hopT >= 1) {
      player.hopT = 1; player.hopping = false;
      player.x = player.toX; player.y = player.toY;
      if (player.falling) { killPlayer(); return; }
      let cube = getCube(player.row, player.col);
      if (cube && !cube.changed) {
        cube.changed = true; cube.color = cube.target;
        cube.flashTimer = 15;
        score += 25;
        spawnParticles(cube.x, cube.y, cube.target, 6);
      }
      checkLevelComplete();
    } else {
      let t = player.hopT;
      player.x = player.fromX + (player.toX - player.fromX) * t;
      player.y = player.fromY + (player.toY - player.fromY) * t - Math.sin(t * Math.PI) * 35;
    }
  }

  // Spawn enemies periodically
  spawnTimer += dt;
  let spawnRate = Math.max(150, 300 - level * 20);
  if (spawnTimer > spawnRate && enemies.length < 2 + Math.floor(level / 2)) {
    spawnTimer = 0;
    spawnEnemy();
  }
  ballTimer += dt;
  if (ballTimer > 120 && balls.length < 2 + Math.floor(level / 3)) {
    ballTimer = 0;
    spawnBall();
  }

  // Update enemies
  for (let e of enemies) {
    if (!e.alive) continue;
    e.animFrame += dt * 0.12;
    if (e.isEgg) {
      e.eggTimer -= dt;
      if (e.eggTimer <= 0) {
        e.isEgg = false;
        spawnParticles(e.x, e.y, '#a6f', 8);
      }
      continue;
    }
    if (e.hopping) {
      e.hopT += dt * 0.055;
      if (e.hopT >= 1) {
        e.hopT = 1; e.hopping = false;
        e.x = e.toX; e.y = e.toY;
        if (e.falling) {
          e.alive = false;
          if (e.type === 'coily') { score += 500; spawnParticles(e.x, e.y - 50, '#a3f', 12); }
          continue;
        }
      } else {
        let t = e.hopT;
        e.x = e.fromX + (e.toX - e.fromX) * t;
        e.y = e.fromY + (e.toY - e.fromY) * t - Math.sin(t * Math.PI) * 28;
      }
    } else {
      e.moveTimer += dt;
      let interval = e.type === 'coily' ? 35 : 50;
      if (e.moveTimer > interval) {
        e.moveTimer = 0;
        if (e.type === 'coily') {
          // Chase player intelligently
          let dr = player.row > e.row ? 1 : (player.row < e.row ? -1 : 0);
          let dc = 0;
          if (dr === 0) dc = player.col > e.col ? 1 : -1;
          else if (Math.random() < 0.25) dc = Math.random() < 0.5 ? 0 : 1;
          hopEntity(e, dr, dr === 1 ? dc : (dr === -1 ? dc - 1 : dc));
          if (dr === -1) { e.col = e.col; } // adjust for diagonal
        } else {
          // Red balls just bounce down randomly
          let dr = 1, dc = Math.random() < 0.5 ? 0 : 1;
          hopEntity(e, dr, dc);
        }
      }
    }
    // Collision with player
    if (!e.isEgg && !player.hopping && Math.abs(e.x - player.x) < 22 && Math.abs(e.y - player.y) < 22) {
      killPlayer(); return;
    }
  }
  enemies = enemies.filter(e => e.alive);

  // Update balls
  for (let b of balls) {
    if (b.hopping) {
      b.hopT += dt * 0.065;
      if (b.hopT >= 1) {
        b.hopT = 1; b.hopping = false;
        b.x = b.toX; b.y = b.toY;
        if (b.falling) { b.dead = true; continue; }
      } else {
        let t = b.hopT;
        b.x = b.fromX + (b.toX - b.fromX) * t;
        b.y = b.fromY + (b.toY - b.fromY) * t - Math.sin(t * Math.PI) * 28;
      }
    } else {
      b.moveTimer += dt;
      if (b.moveTimer > 45) { b.moveTimer = 0; hopEntity(b, 1, Math.random() < 0.5 ? 0 : 1); }
    }
    if (!player.hopping && Math.abs(b.x - player.x) < 20 && Math.abs(b.y - player.y) < 20) {
      killPlayer(); return;
    }
  }
  balls = balls.filter(b => !b.dead);
}

function checkLevelComplete() {
  if (cubes.every(c => c.changed)) {
    levelComplete = true; levelTimer = 0;
    score += 100 * level + 250;
    for (let c of cubes) spawnParticles(c.x, c.y, c.target, 3);
  }
}

function killPlayer() {
  lives--;
  swearTimer = 80;
  swearText = SWEARS[Math.floor(Math.random() * SWEARS.length)];
  spawnParticles(player.x, player.y, '#f90', 18);
  spawnParticles(player.x, player.y, '#ff0', 8);
  if (lives <= 0) {
    state = 'over';
    if (score > hiScore) hiScore = score;
  } else {
    player.row = 0; player.col = 0;
    player.x = BASE_X; player.y = BASE_Y - 22;
    player.hopping = false; player.falling = false;
    enemies = []; balls = [];
  }
}

function drawCube(x, y, topColor, leftColor, rightColor, flash) {
  if (flash > 0) {
    topColor = '#fff';
  }
  ctx.fillStyle = topColor;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + CUBE_W / 2, y + CUBE_H / 2);
  ctx.lineTo(x, y + CUBE_H); ctx.lineTo(x - CUBE_W / 2, y + CUBE_H / 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = leftColor;
  ctx.beginPath();
  ctx.moveTo(x - CUBE_W / 2, y + CUBE_H / 2); ctx.lineTo(x, y + CUBE_H);
  ctx.lineTo(x, y + CUBE_H + 16); ctx.lineTo(x - CUBE_W / 2, y + CUBE_H / 2 + 16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = rightColor;
  ctx.beginPath();
  ctx.moveTo(x + CUBE_W / 2, y + CUBE_H / 2); ctx.lineTo(x, y + CUBE_H);
  ctx.lineTo(x, y + CUBE_H + 16); ctx.lineTo(x + CUBE_W / 2, y + CUBE_H / 2 + 16);
  ctx.closePath(); ctx.fill();
}

function draw() {
  // Background
  let grad = ctx.createLinearGradient(0, 0, 0, 480);
  grad.addColorStop(0, `hsl(${240 + bgHue * 0.05}, 40%, 6%)`);
  grad.addColorStop(1, `hsl(${260 + bgHue * 0.05}, 35%, 12%)`);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 800, 480);

  if (state === 'title') { drawTitle(); return; }
  if (state === 'over') { drawOver(); return; }

  // Draw discs
  for (let d of discs) {
    if (d.used) continue;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.angle);
    ctx.fillStyle = '#f44';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f88';
    ctx.beginPath(); ctx.ellipse(0, -2, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Draw cubes
  for (let c of cubes) {
    let dark = shadeColor(c.color, -45);
    let darker = shadeColor(c.color, -80);
    drawCube(c.x, c.y, c.color, dark, darker, c.flashTimer);
  }

  // Draw balls
  for (let b of balls) {
    ctx.fillStyle = '#f33';
    ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f99';
    ctx.beginPath(); ctx.arc(b.x - 3, b.y - 4, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#a00'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, Math.PI * 2); ctx.stroke();
  }

  // Draw enemies
  for (let e of enemies) {
    if (!e.alive) continue;
    if (e.isEgg) {
      let wobble = Math.sin(e.animFrame * 3) * 2;
      ctx.fillStyle = '#a6f';
      ctx.beginPath(); ctx.ellipse(e.x + wobble, e.y, 10, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c8f';
      ctx.beginPath(); ctx.ellipse(e.x + wobble - 2, e.y - 4, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
      // Crack lines when about to hatch
      if (e.eggTimer < 30) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(e.x - 3, e.y - 5); ctx.lineTo(e.x + 2, e.y); ctx.lineTo(e.x - 1, e.y + 5); ctx.stroke();
      }
    } else if (e.type === 'coily') {
      let bob = Math.sin(e.animFrame * 2) * 2;
      // Snake body coils
      ctx.strokeStyle = '#a3f'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(e.x, e.y + 8);
      ctx.quadraticCurveTo(e.x + 10, e.y + 16 + bob, e.x, e.y + 24);
      ctx.quadraticCurveTo(e.x - 10, e.y + 30 - bob, e.x, e.y + 36);
      ctx.stroke();
      // Head
      ctx.fillStyle = '#c5f';
      ctx.beginPath(); ctx.arc(e.x, e.y - 4 + bob, 11, 0, Math.PI * 2); ctx.fill();
      // Eyes
      ctx.fillStyle = '#ff0';
      ctx.beginPath(); ctx.arc(e.x - 4, e.y - 6 + bob, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 4, e.y - 6 + bob, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#800';
      ctx.beginPath(); ctx.arc(e.x - 4, e.y - 6 + bob, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + 4, e.y - 6 + bob, 2, 0, Math.PI * 2); ctx.fill();
      // Angry eyebrows
      ctx.strokeStyle = '#609'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e.x - 7, e.y - 11 + bob); ctx.lineTo(e.x - 2, e.y - 9 + bob); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(e.x + 7, e.y - 11 + bob); ctx.lineTo(e.x + 2, e.y - 9 + bob); ctx.stroke();
    } else {
      // Red ball enemy (same as balls but with face)
      let squish = 1 + Math.sin(e.animFrame * 3) * 0.1;
      ctx.fillStyle = '#e22';
      ctx.beginPath(); ctx.ellipse(e.x, e.y, 11 * squish, 11 / squish, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f88';
      ctx.beginPath(); ctx.arc(e.x - 3, e.y - 3, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Draw player (Q*bert character)
  if (player && !player.falling) {
    let px = player.x, py = player.y;
    let bob = player.hopping ? 0 : Math.sin(player.animFrame * 2) * 1.5;
    let squish = player.hopping ? 1.1 : 1;
    ctx.save();
    ctx.translate(px, py + bob);
    ctx.scale(player.facing, 1);
    ctx.scale(1 / squish, squish);
    // Body (orange round)
    ctx.fillStyle = '#f90';
    ctx.beginPath(); ctx.arc(0, -6, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fc0';
    ctx.beginPath(); ctx.arc(-3, -10, 5, 0, Math.PI * 2); ctx.fill();
    // Nose/snout
    ctx.fillStyle = '#f60';
    ctx.beginPath();
    ctx.moveTo(8, -6); ctx.lineTo(18, -4); ctx.lineTo(8, 0);
    ctx.closePath(); ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-3, -9, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -9, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-2, -9, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -9, 2, 0, Math.PI * 2); ctx.fill();
    // Feet
    ctx.fillStyle = '#f60';
    let footAnim = player.hopping ? 0 : Math.sin(player.animFrame * 4) * 3;
    ctx.beginPath(); ctx.ellipse(-6, 8 + footAnim, 5, 4, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, 8 - footAnim, 5, 4, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Swear bubble
  if (swearTimer > 0 && player) {
    let alpha = Math.min(1, swearTimer / 30);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(player.x - 25, player.y - 55, 50, 24, 8);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(player.x - 3, player.y - 31); ctx.lineTo(player.x + 3, player.y - 31); ctx.lineTo(player.x, player.y - 25);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f00'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(swearText, player.x, player.y - 38);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // HUD
  ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
  ctx.fillText('分数: ' + score, 10, 25);
  ctx.fillText('最高: ' + hiScore, 180, 25);
  ctx.fillStyle = '#f44';
  ctx.fillText('生命: ' + '♥'.repeat(Math.max(0, lives)), 400, 25);
  ctx.fillStyle = '#4af';
  ctx.fillText('关卡: ' + level, 580, 25);
  let remaining = cubes.filter(c => !c.changed).length;
  ctx.fillStyle = '#aaa';
  ctx.fillText('剩余: ' + remaining + '/' + cubes.length, 680, 25);

  // Progress bar
  let pct = 1 - remaining / cubes.length;
  ctx.fillStyle = '#333'; ctx.fillRect(10, 465, 200, 8);
  ctx.fillStyle = '#4f4'; ctx.fillRect(10, 465, 200 * pct, 8);
  ctx.strokeStyle = '#555'; ctx.strokeRect(10, 465, 200, 8);

  // Level complete message
  if (levelComplete) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, 200, 800, 80);
    ctx.fillStyle = '#ff0'; ctx.font = 'bold 38px monospace'; ctx.textAlign = 'center';
    ctx.fillText('关卡完成! +' + (100 * level + 250), 400, 250);
    ctx.textAlign = 'left';
  }
}

function drawTitle() {
  // Animated cubes in background
  let t = Date.now() * 0.001;
  for (let i = 0; i < 8; i++) {
    let x = 100 + i * 90;
    let y = 380 + Math.sin(t + i * 0.7) * 15;
    let color = i % 2 ? '#ffcc00' : '#2244aa';
    drawCube(x, y, color, shadeColor(color, -45), shadeColor(color, -80), 0);
  }

  ctx.fillStyle = '#f90'; ctx.font = 'bold 56px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Q*bert', 400, 110);
  ctx.fillStyle = '#fc0'; ctx.font = '22px monospace';
  ctx.fillText('跳 方 块', 400, 148);

  // Animated Q*bert character
  let charY = 210 + Math.sin(t * 2) * 12;
  ctx.fillStyle = '#f90';
  ctx.beginPath(); ctx.arc(400, charY, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f60';
  ctx.beginPath(); ctx.moveTo(412, charY); ctx.lineTo(425, charY + 2); ctx.lineTo(412, charY + 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(396, charY - 4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(405, charY - 4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(397, charY - 4, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(406, charY - 4, 2.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#4f4'; ctx.font = '18px monospace';
  ctx.fillText('方向键 - 对角跳跃 (↑左上 ↓右下 ←左下 →右上)', 400, 280);
  ctx.fillText('改变所有方块颜色即过关', 400, 310);
  ctx.fillText('躲避紫蛇Coily和紅球!', 400, 340);
  ctx.fillText('掉下金字塔会失去生命', 400, 370);

  ctx.fillStyle = '#ff0'; ctx.font = 'bold 24px monospace';
  let blink = Math.sin(t * 4) > 0;
  if (blink) ctx.fillText('按 ENTER 开始游戏', 400, 430);
  ctx.fillStyle = '#888'; ctx.font = '14px monospace';
  ctx.fillText('ESC 退出', 400, 465);
  ctx.textAlign = 'left';
}

function drawOver() {
  let t = Date.now() * 0.001;
  ctx.fillStyle = '#f44'; ctx.font = 'bold 46px monospace'; ctx.textAlign = 'center';
  ctx.fillText('游 戏 结 束', 400, 140);
  ctx.fillStyle = '#fff'; ctx.font = '26px monospace';
  ctx.fillText('最终分数: ' + score, 400, 220);
  ctx.fillStyle = '#ff0'; ctx.font = '22px monospace';
  ctx.fillText('最高纪录: ' + hiScore, 400, 265);
  ctx.fillStyle = '#aaa'; ctx.font = '18px monospace';
  ctx.fillText('到达关卡: ' + level, 400, 310);

  // Falling Q*bert animation
  let fallY = (t * 50) % 200 + 320;
  ctx.fillStyle = '#f90';
  ctx.beginPath(); ctx.arc(400, fallY, 12, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#4f4'; ctx.font = 'bold 22px monospace';
  let blink = Math.sin(t * 4) > 0;
  if (blink) ctx.fillText('按 ENTER 重新开始', 400, 420);
  ctx.fillStyle = '#888'; ctx.font = '14px monospace';
  ctx.fillText('ESC 退出', 400, 460);
  ctx.textAlign = 'left';
}

function shadeColor(color, amount) {
  if (color.startsWith('rgb')) return color;
  let r = parseInt(color.slice(1, 3), 16) + amount;
  let g = parseInt(color.slice(3, 5), 16) + amount;
  let b = parseInt(color.slice(5, 7), 16) + amount;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}

function gameLoop(time) {
  let dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
  if (e.code === 'Enter') {
    if (state === 'title') { state = 'play'; score = 0; lives = 3; level = 1; initLevel(); }
    else if (state === 'over') { state = 'play'; score = 0; lives = 3; level = 1; initLevel(); }
    return;
  }
  if (state !== 'play' || !player || player.hopping || player.falling || levelComplete) return;
  let dr = 0, dc = 0;
  // Diagonal controls: Up=up-left, Down=down-right, Left=down-left, Right=up-right
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { dr = -1; dc = 0; player.facing = -1; }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { dr = 1; dc = 1; player.facing = 1; }
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { dr = 1; dc = 0; player.facing = -1; }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { dr = -1; dc = -1; player.facing = 1; }
  else return;
  e.preventDefault();
  let nr = player.row + dr, nc = player.col + dc;
  if (nr < 0 || nc < 0 || nc > nr) {
    // Check for disc
    let disc = discs.find(d => !d.used && d.row === player.row && ((d.side === 'left' && dc < 0) || (d.side === 'right' && dc >= 0)));
    if (disc) {
      disc.used = true;
      player.fromX = player.x; player.fromY = player.y;
      player.toX = BASE_X; player.toY = BASE_Y - 22;
      player.row = 0; player.col = 0;
      player.hopping = true; player.hopT = 0; player.falling = false;
      // Disc ride removes coily
      enemies = enemies.filter(en => { if (en.type === 'coily') { score += 500; spawnParticles(en.x, en.y, '#a3f', 10); return false; } return true; });
      return;
    }
    // Fall off
    player.falling = true;
    player.fromX = player.x; player.fromY = player.y;
    let pos = cubePos(nr, nc);
    player.toX = pos.x; player.toY = pos.y + 160;
    player.hopping = true; player.hopT = 0;
    return;
  }
  hopEntity(player, dr, dc);
});

requestAnimationFrame(gameLoop);
</script>
