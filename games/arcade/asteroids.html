<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小行星</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

let score = 0;
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});

const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2, RESPAWN: 3 };
let state = STATE.TITLE;
let lives = 3;
let level = 1;
let shakeTimer = 0, shakeIntensity = 0;
let respawnTimer = 0;
let extraShipGiven = false;
let invincibleTimer = 0;

// Ship
const ship = {
  x: W/2, y: H/2, angle: -Math.PI/2,
  vx: 0, vy: 0, thrust: false, radius: 12,
  rotSpeed: 0.06, thrustPower: 0.12, friction: 0.995
};

// Bullets
let bullets = [];
const BULLET_SPEED = 7;
const BULLET_LIFE = 60;
let shootCooldown = 0;

// Asteroids
let asteroids = [];
const ASTEROID_SIZES = { large: 40, medium: 22, small: 12 };
const ASTEROID_SCORES = { large: 20, medium: 50, small: 100 };
const ASTEROID_SPEEDS = { large: 1, medium: 1.8, small: 2.8 };

// Particles
let particles = [];
// Thrust particles
let thrustParticles = [];

// Stars background
const stars = [];
for (let i = 0; i < 80; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*H, size: Math.random()*1.5+0.5, blink: Math.random()*Math.PI*2 });
}

// Input
let keys = {};
document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Space') {
    if (state === STATE.TITLE) startGame();
    else if (state === STATE.GAMEOVER) state = STATE.TITLE;
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', () => {
  if (state === STATE.TITLE) startGame();
  else if (state === STATE.GAMEOVER) state = STATE.TITLE;
});

function createAsteroid(x, y, size) {
  const speed = ASTEROID_SPEEDS[size] * (1 + level * 0.1);
  const angle = Math.random() * Math.PI * 2;
  // Generate jagged shape
  const verts = [];
  const numVerts = 8 + Math.floor(Math.random() * 5);
  const baseR = ASTEROID_SIZES[size];
  for (let i = 0; i < numVerts; i++) {
    const a = (i / numVerts) * Math.PI * 2;
    const r = baseR * (0.7 + Math.random() * 0.4);
    verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return {
    x, y, vx: Math.cos(angle) * speed * (0.5 + Math.random()),
    vy: Math.sin(angle) * speed * (0.5 + Math.random()),
    size, radius: baseR, verts,
    rotation: 0, rotSpeed: (Math.random() - 0.5) * 0.03
  };
}

function spawnAsteroids(count) {
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (Math.hypot(x - ship.x, y - ship.y) < 150);
    asteroids.push(createAsteroid(x, y, 'large'));
  }
}

function startGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3; level = 1;
  extraShipGiven = false;
  resetShip();
  bullets = [];
  asteroids = [];
  particles = [];
  thrustParticles = [];
  spawnAsteroids(4);
}

function resetShip() {
  ship.x = W/2; ship.y = H/2;
  ship.vx = 0; ship.vy = 0;
  ship.angle = -Math.PI/2;
  invincibleTimer = 120;
}

function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * (speed || 3) + 1;
    particles.push({
      x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
      life: 1, decay: Math.random()*0.02+0.015, color, size: Math.random()*3+1
    });
  }
}

function triggerShake(i, d) { shakeIntensity = i; shakeTimer = d; }

function wrap(obj) {
  if (obj.x < -50) obj.x = W + 50;
  if (obj.x > W + 50) obj.x = -50;
  if (obj.y < -50) obj.y = H + 50;
  if (obj.y > H + 50) obj.y = -50;
}

function update() {
  if (state === STATE.RESPAWN) {
    respawnTimer--;
    if (respawnTimer <= 0) {
      state = STATE.PLAYING;
      resetShip();
    }
    updateParticles();
    updateAsteroids();
    return;
  }
  if (state !== STATE.PLAYING) return;

  // Ship rotation
  if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= ship.rotSpeed;
  if (keys['ArrowRight'] || keys['KeyD']) ship.angle += ship.rotSpeed;

  // Thrust
  ship.thrust = keys['ArrowUp'] || keys['KeyW'];
  if (ship.thrust) {
    ship.vx += Math.cos(ship.angle) * ship.thrustPower;
    ship.vy += Math.sin(ship.angle) * ship.thrustPower;
    // Thrust particles
    const ex = ship.x - Math.cos(ship.angle) * 14;
    const ey = ship.y - Math.sin(ship.angle) * 14;
    thrustParticles.push({
      x: ex, y: ey,
      vx: -Math.cos(ship.angle) * (2 + Math.random()*2) + (Math.random()-0.5),
      vy: -Math.sin(ship.angle) * (2 + Math.random()*2) + (Math.random()-0.5),
      life: 1, decay: 0.06 + Math.random()*0.04
    });
  }

  // Physics
  ship.vx *= ship.friction;
  ship.vy *= ship.friction;
  ship.x += ship.vx;
  ship.y += ship.vy;
  wrap(ship);

  // Shooting
  if (shootCooldown > 0) shootCooldown--;
  if (keys['Space'] && shootCooldown === 0 && state === STATE.PLAYING) {
    bullets.push({
      x: ship.x + Math.cos(ship.angle) * 14,
      y: ship.y + Math.sin(ship.angle) * 14,
      vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx * 0.3,
      vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy * 0.3,
      life: BULLET_LIFE
    });
    shootCooldown = 10;
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life--;
    wrap(b);
    if (b.life <= 0) bullets.splice(i, 1);
  }

  updateAsteroids();

  // Collision: bullets vs asteroids
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      if (dist < a.radius) {
        bullets.splice(i, 1);
        destroyAsteroid(j);
        break;
      }
    }
  }

  // Collision: ship vs asteroids
  if (invincibleTimer > 0) invincibleTimer--;
  if (invincibleTimer <= 0) {
    for (let a of asteroids) {
      const dist = Math.hypot(ship.x - a.x, ship.y - a.y);
      if (dist < a.radius + ship.radius - 4) {
        destroyShip();
        break;
      }
    }
  }

  // Thrust particles
  for (let i = thrustParticles.length - 1; i >= 0; i--) {
    const p = thrustParticles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) thrustParticles.splice(i, 1);
  }

  updateParticles();

  // Extra ship at 10000
  if (score >= 10000 && !extraShipGiven) {
    extraShipGiven = true;
    lives++;
    spawnParticles(ship.x, ship.y, '#0ff', 20, 4);
  }

  // Level clear
  if (asteroids.length === 0) {
    level++;
    spawnAsteroids(3 + level);
  }

  if (shakeTimer > 0) shakeTimer--;
}

function updateAsteroids() {
  for (let a of asteroids) {
    a.x += a.vx; a.y += a.vy;
    a.rotation += a.rotSpeed;
    wrap(a);
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.98; p.vy *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function destroyAsteroid(index) {
  const a = asteroids[index];
  score += ASTEROID_SCORES[a.size];
  spawnParticles(a.x, a.y, '#aaa', a.size === 'large' ? 15 : a.size === 'medium' ? 10 : 6, 3);
  triggerShake(a.size === 'large' ? 4 : 2, a.size === 'large' ? 8 : 4);

  // Split
  if (a.size === 'large') {
    asteroids.push(createAsteroid(a.x, a.y, 'medium'));
    asteroids.push(createAsteroid(a.x, a.y, 'medium'));
  } else if (a.size === 'medium') {
    asteroids.push(createAsteroid(a.x, a.y, 'small'));
    asteroids.push(createAsteroid(a.x, a.y, 'small'));
  }
  asteroids.splice(index, 1);
}

function destroyShip() {
  lives--;
  spawnParticles(ship.x, ship.y, '#0ff', 25, 4);
  spawnParticles(ship.x, ship.y, '#ff0', 15, 3);
  triggerShake(8, 15);
  if (lives <= 0) {
    state = STATE.GAMEOVER;
  } else {
    state = STATE.RESPAWN;
    respawnTimer = 90;
  }
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
  }

  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);

  // Stars
  const time = performance.now() * 0.001;
  for (let s of stars) {
    const alpha = 0.3 + 0.4 * Math.sin(time + s.blink);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  if (state === STATE.TITLE) { drawTitle(); ctx.restore(); return; }
  if (state === STATE.GAMEOVER) { drawGameOver(); ctx.restore(); return; }

  // Asteroids
  for (let a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rotation);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#666';
    ctx.shadowBlur = 3;
    ctx.beginPath();
    ctx.moveTo(a.verts[0].x, a.verts[0].y);
    for (let v of a.verts) ctx.lineTo(v.x, v.y);
    ctx.closePath();
    ctx.stroke();
    ctx.fillStyle = 'rgba(100,100,100,0.15)';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Ship (not during respawn)
  if (state === STATE.PLAYING) {
    if (invincibleTimer <= 0 || Math.floor(invincibleTimer / 5) % 2 === 0) {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle);
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(-10, -9);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-10, 9);
      ctx.closePath();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Thrust flame
      if (ship.thrust) {
        ctx.strokeStyle = '#f80';
        ctx.beginPath();
        ctx.moveTo(-8, -4);
        ctx.lineTo(-16 - Math.random()*6, 0);
        ctx.lineTo(-8, 4);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Bullets
  ctx.fillStyle = '#ff0';
  ctx.shadowColor = '#ff0';
  ctx.shadowBlur = 4;
  for (let b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Thrust particles
  for (let p of thrustParticles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.life > 0.5 ? '#f80' : '#f40';
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('分数: ' + score, 10, 24);
  ctx.textAlign = 'center';
  ctx.fillText('等级: ' + level, W/2, 24);
  ctx.textAlign = 'right';
  // Draw ship icons for lives
  for (let i = 0; i < lives; i++) {
    const lx = W - 30 - i * 25;
    ctx.save();
    ctx.translate(lx, 18);
    ctx.rotate(-Math.PI/2);
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-6, -5); ctx.lineTo(-3, 0); ctx.lineTo(-6, 5);
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  if (state === STATE.RESPAWN) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('准备...', W/2, H/2);
  }

  ctx.restore();
}

function drawTitle() {
  // Floating asteroids on title
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const ax = (performance.now() * 0.02 * (i+1) * 0.3 + i * 170) % (W + 100) - 50;
    const ay = 80 + i * 80;
    ctx.beginPath();
    for (let j = 0; j < 8; j++) {
      const a = (j/8)*Math.PI*2;
      const r = 20 + (j%3)*8;
      const px = ax + Math.cos(a)*r, py = ay + Math.sin(a)*r;
      j === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.stroke();
  }

  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20;
  ctx.fillText('小 行 星', W/2, H/2 - 60);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText('ASTEROIDS', W/2, H/2 - 20);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '15px monospace';
  ctx.fillText('← → 旋转    ↑ 推进    空格 射击', W/2, H/2 + 25);
  ctx.fillText('大=20分  中=50分  小=100分', W/2, H/2 + 55);
  ctx.fillText('10000分奖励一条命', W/2, H/2 + 80);
  ctx.fillStyle = '#ff0';
  ctx.font = '16px monospace';
  ctx.fillText('点击或按空格开始', W/2, H/2 + 125);
}

function drawGameOver() {
  ctx.fillStyle = '#f00';
  ctx.font = 'bold 46px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#f00';
  ctx.shadowBlur = 20;
  ctx.fillText('游戏结束', W/2, H/2 - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '22px monospace';
  ctx.fillText('最终分数: ' + score, W/2, H/2 + 10);
  ctx.fillText('到达等级: ' + level, W/2, H/2 + 45);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('点击返回标题', W/2, H/2 + 100);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
