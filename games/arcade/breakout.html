<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打砖块</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

let score = 0;

// Game states
const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2, LEVELUP: 3 };
let state = STATE.TITLE;
let lives = 3;
let level = 1;
let shakeTimer = 0;
let shakeIntensity = 0;

// Paddle
const paddle = { w: 100, h: 14, x: W/2 - 50, y: H - 40, speed: 8, color: '#0ff' };

// Ball
let ball = { x: W/2, y: H - 60, r: 7, dx: 4, dy: -4, speed: 5, stuck: true };

// Bricks
let bricks = [];
const brickRows = 6, brickCols = 10;
const brickW = 70, brickH = 20, brickPad = 4, brickTop = 50, brickLeft = 25;
const brickColors = ['#ff0055','#ff6600','#ffcc00','#00ff88','#00ccff','#aa55ff'];
const brickPoints = [60, 50, 40, 30, 20, 10];

// Particles
let particles = [];

// Power-ups
let powerups = [];
const POWERUP_TYPES = ['wide','multi','slow'];
const POWERUP_COLORS = { wide: '#0f0', multi: '#f0f', slow: '#ff0' };

// Multi-ball
let balls = [];

// Input
let keys = {};
let mouseX = W / 2;
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('click', () => {
  if (state === STATE.TITLE) { startGame(); }
  else if (state === STATE.GAMEOVER) { state = STATE.TITLE; }
  else if (state === STATE.PLAYING && ball.stuck) { ball.stuck = false; }
  else if (state === STATE.LEVELUP) { nextLevel(); }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
  if (e.code === 'Space') {
    if (state === STATE.TITLE) startGame();
    else if (state === STATE.PLAYING && ball.stuck) ball.stuck = false;
    else if (state === STATE.LEVELUP) nextLevel();
    else if (state === STATE.GAMEOVER) state = STATE.TITLE;
  }
});

function createBricks() {
  bricks = [];
  for (let r = 0; r < brickRows; r++) {
    for (let c = 0; c < brickCols; c++) {
      let hp = 1;
      if (level >= 3 && r < 2) hp = 2;
      if (level >= 5 && r === 0) hp = 3;
      // Pattern variation per level
      let skip = false;
      if (level % 3 === 2 && (r + c) % 3 === 0) skip = true;
      if (level % 4 === 0 && r === 2 && c > 2 && c < 7) skip = true;
      if (!skip) {
        bricks.push({
          x: brickLeft + c * (brickW + brickPad),
          y: brickTop + r * (brickH + brickPad),
          w: brickW, h: brickH,
          color: brickColors[r], points: brickPoints[r],
          hp: hp, maxHp: hp, alive: true
        });
      }
    }
  }
}

function startGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3; level = 1;
  paddle.w = 100;
  resetBall();
  createBricks();
  balls = [];
  powerups = [];
  particles = [];
}

function nextLevel() {
  level++;
  state = STATE.PLAYING;
  paddle.w = 100;
  resetBall();
  createBricks();
  balls = [];
  powerups = [];
}

function resetBall() {
  ball = { x: W/2, y: H - 60, r: 7, dx: 4, dy: -4, speed: 5 + level * 0.3, stuck: true };
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 4 + 1;
    particles.push({
      x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
      life: 1, decay: Math.random()*0.03+0.02, color, size: Math.random()*4+2
    });
  }
}

function spawnPowerup(x, y) {
  if (Math.random() < 0.15) {
    const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
    powerups.push({ x, y, w: 24, h: 24, vy: 2.5, type, color: POWERUP_COLORS[type] });
  }
}

function triggerShake(intensity, duration) {
  shakeIntensity = intensity;
  shakeTimer = duration;
}

function update() {
  if (state !== STATE.PLAYING) return;

  // Paddle movement
  if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed;
  if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed;
  paddle.x += (mouseX - paddle.x - paddle.w/2) * 0.1;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  // Ball on paddle
  if (ball.stuck) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;
    return;
  }

  // Update main ball
  updateBall(ball);

  // Update extra balls
  for (let i = balls.length - 1; i >= 0; i--) {
    updateBall(balls[i]);
    if (balls[i].dead) balls.splice(i, 1);
  }

  // Powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy;
    if (p.y > H) { powerups.splice(i, 1); continue; }
    if (p.x < paddle.x + paddle.w && p.x + p.w > paddle.x &&
        p.y + p.h > paddle.y && p.y < paddle.y + paddle.h) {
      applyPowerup(p.type);
      powerups.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Shake
  if (shakeTimer > 0) shakeTimer--;

  // Check level clear
  if (bricks.every(b => !b.alive)) {
    state = STATE.LEVELUP;
  }
}

function updateBall(b) {
  b.x += b.dx;
  b.y += b.dy;

  // Wall collisions
  if (b.x - b.r < 0) { b.x = b.r; b.dx = Math.abs(b.dx); }
  if (b.x + b.r > W) { b.x = W - b.r; b.dx = -Math.abs(b.dx); }
  if (b.y - b.r < 0) { b.y = b.r; b.dy = Math.abs(b.dy); }

  // Bottom - lose ball
  if (b.y + b.r > H) {
    if (b === ball) {
      if (balls.length > 0) {
        ball = balls.pop();
        ball.stuck = false;
      } else {
        loseLife();
      }
    } else {
      b.dead = true;
    }
    return;
  }

  // Paddle collision
  if (b.dy > 0 && b.y + b.r > paddle.y && b.y - b.r < paddle.y + paddle.h &&
      b.x > paddle.x && b.x < paddle.x + paddle.w) {
    const hitPos = (b.x - paddle.x) / paddle.w; // 0 to 1
    const angle = (hitPos - 0.5) * Math.PI * 0.7; // -63 to +63 degrees
    const speed = Math.sqrt(b.dx*b.dx + b.dy*b.dy);
    b.dx = Math.sin(angle) * speed;
    b.dy = -Math.cos(angle) * speed;
    b.y = paddle.y - b.r;
    spawnParticles(b.x, b.y, '#0ff', 5);
  }

  // Brick collision
  for (let brick of bricks) {
    if (!brick.alive) continue;
    if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w &&
        b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {
      // Determine bounce direction
      const overlapLeft = (b.x + b.r) - brick.x;
      const overlapRight = (brick.x + brick.w) - (b.x - b.r);
      const overlapTop = (b.y + b.r) - brick.y;
      const overlapBottom = (brick.y + brick.h) - (b.y - b.r);
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
      if (minOverlap === overlapTop || minOverlap === overlapBottom) b.dy = -b.dy;
      else b.dx = -b.dx;

      brick.hp--;
      if (brick.hp <= 0) {
        brick.alive = false;
        score += brick.points;
        spawnParticles(brick.x + brick.w/2, brick.y + brick.h/2, brick.color, 12);
        spawnPowerup(brick.x + brick.w/2, brick.y + brick.h/2);
        triggerShake(3, 5);
      } else {
        spawnParticles(b.x, b.y, brick.color, 4);
      }
      break;
    }
  }
}

function applyPowerup(type) {
  if (type === 'wide') { paddle.w = Math.min(180, paddle.w + 40); }
  else if (type === 'slow') { ball.dx *= 0.7; ball.dy *= 0.7; }
  else if (type === 'multi') {
    for (let i = 0; i < 2; i++) {
      const angle = (Math.random() - 0.5) * 1.2;
      const speed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
      balls.push({
        x: ball.x, y: ball.y, r: ball.r,
        dx: Math.sin(angle) * speed, dy: -Math.cos(angle) * speed,
        speed: speed, stuck: false, dead: false
      });
    }
  }
  spawnParticles(paddle.x + paddle.w/2, paddle.y, POWERUP_COLORS[type], 15);
}

function loseLife() {
  lives--;
  triggerShake(6, 10);
  if (lives <= 0) {
    state = STATE.GAMEOVER;
  } else {
    resetBall();
    balls = [];
    powerups = [];
    paddle.w = 100;
  }
}

function draw() {
  ctx.save();
  // Screen shake
  if (shakeTimer > 0) {
    const sx = (Math.random()-0.5) * shakeIntensity;
    const sy = (Math.random()-0.5) * shakeIntensity;
    ctx.translate(sx, sy);
  }

  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  if (state === STATE.TITLE) { drawTitle(); ctx.restore(); return; }
  if (state === STATE.GAMEOVER) { drawGameOver(); ctx.restore(); return; }
  if (state === STATE.LEVELUP) { drawLevelUp(); ctx.restore(); return; }

  // Bricks
  for (let brick of bricks) {
    if (!brick.alive) continue;
    ctx.fillStyle = brick.color;
    ctx.globalAlpha = 0.4 + 0.6 * (brick.hp / brick.maxHp);
    ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.strokeRect(brick.x, brick.y, brick.w, brick.h);
    // Glow
    ctx.shadowColor = brick.color;
    ctx.shadowBlur = 6;
    ctx.fillRect(brick.x, brick.y, brick.w, 2);
    ctx.shadowBlur = 0;
  }

  // Paddle
  ctx.fillStyle = paddle.color;
  ctx.shadowColor = paddle.color;
  ctx.shadowBlur = 12;
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.shadowBlur = 0;
  // Paddle highlight
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, 3);

  // Ball
  drawBall(ball);
  for (let b of balls) drawBall(b);

  // Powerups
  for (let p of powerups) {
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    const label = p.type === 'wide' ? '宽' : p.type === 'multi' ? '多' : '慢';
    ctx.fillText(label, p.x, p.y + 4);
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('分数: ' + score, 10, 24);
  ctx.fillText('关卡: ' + level, W/2 - 30, 24);
  ctx.textAlign = 'right';
  ctx.fillText('生命: ' + '♥'.repeat(lives), W - 10, 24);

  if (ball.stuck) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('点击或按空格发射', W/2, H - 70);
  }

  ctx.restore();
}

function drawBall(b) {
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawTitle() {
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20;
  ctx.fillText('打 砖 块', W/2, H/2 - 60);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText('BREAKOUT', W/2, H/2 - 20);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('← → 或鼠标移动挡板', W/2, H/2 + 30);
  ctx.fillText('点击或空格发射球', W/2, H/2 + 60);
  ctx.fillStyle = '#ff0';
  ctx.fillText('点击开始游戏', W/2, H/2 + 110);
  // Decorative bricks
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = brickColors[i % 6];
    ctx.fillRect(W/2 - 200 + i*50, H/2 - 120, 44, 16);
  }
}

function drawGameOver() {
  ctx.fillStyle = '#f00';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#f00';
  ctx.shadowBlur = 20;
  ctx.fillText('游 戏 结 束', W/2, H/2 - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '22px monospace';
  ctx.fillText('最终分数: ' + score, W/2, H/2 + 10);
  ctx.fillText('到达关卡: ' + level, W/2, H/2 + 45);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('点击返回标题', W/2, H/2 + 100);
}

function drawLevelUp() {
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 40px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#0f0';
  ctx.shadowBlur = 20;
  ctx.fillText('关卡 ' + level + ' 完成!', W/2, H/2 - 30);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText('分数: ' + score, W/2, H/2 + 20);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('点击进入第 ' + (level+1) + ' 关', W/2, H/2 + 70);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
