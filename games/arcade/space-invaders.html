<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>太空侵略者</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

let score = 0;

const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2, WAVE: 3 };
let state = STATE.TITLE;
let lives = 3;
let wave = 1;
let shakeTimer = 0, shakeIntensity = 0;

// Player
const player = { x: W/2, y: H - 40, w: 40, h: 20, speed: 5, cooldown: 0 };
let playerBullets = [];
let alienBullets = [];

// Aliens
let aliens = [];
let alienDir = 1;
let alienSpeed = 0.5;
let alienDropAmount = 16;
let alienShootTimer = 0;
let alienShootInterval = 60;

// Shields
let shields = [];

// Particles
let particles = [];

// UFO bonus
let ufo = null;
let ufoTimer = 0;

// Input
let keys = {};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === STATE.TITLE) startGame();
    else if (state === STATE.GAMEOVER) state = STATE.TITLE;
    else if (state === STATE.WAVE) startWave();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', () => {
  if (state === STATE.TITLE) startGame();
  else if (state === STATE.GAMEOVER) state = STATE.TITLE;
  else if (state === STATE.WAVE) startWave();
});

const ALIEN_TYPES = [
  { color: '#ff0055', points: 30, w: 24, h: 16 }, // top row
  { color: '#00ffcc', points: 20, w: 28, h: 16 }, // middle rows
  { color: '#66ff00', points: 10, w: 32, h: 16 }, // bottom rows
];

function createAliens() {
  aliens = [];
  const cols = 11, rows = 5;
  const startX = 100, startY = 60 + Math.min(wave - 1, 5) * 8;
  const gapX = 50, gapY = 36;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let type = r === 0 ? 0 : (r <= 2 ? 1 : 2);
      aliens.push({
        x: startX + c * gapX,
        y: startY + r * gapY,
        w: ALIEN_TYPES[type].w,
        h: ALIEN_TYPES[type].h,
        type: type,
        alive: true,
        frame: 0
      });
    }
  }
  alienDir = 1;
  alienSpeed = 0.5 + wave * 0.15;
  alienShootInterval = Math.max(20, 60 - wave * 5);
}

function createShields() {
  shields = [];
  const shieldCount = 4;
  const shieldW = 60, shieldH = 40;
  const gap = (W - shieldCount * shieldW) / (shieldCount + 1);
  for (let i = 0; i < shieldCount; i++) {
    const sx = gap + i * (shieldW + gap);
    const sy = H - 110;
    // Create pixel grid for shield
    const pixels = [];
    const pw = 4, ph = 4;
    for (let py = 0; py < shieldH; py += ph) {
      for (let px = 0; px < shieldW; px += pw) {
        // Arch shape
        const cx = px - shieldW/2, cy = py;
        const inArch = py > shieldH * 0.5 && Math.abs(cx) < shieldW * 0.2;
        if (!inArch) {
          pixels.push({ x: sx + px, y: sy + py, w: pw, h: ph, alive: true });
        }
      }
    }
    shields.push(pixels);
  }
}

function startGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3; wave = 1;
  player.x = W / 2;
  playerBullets = []; alienBullets = [];
  particles = []; ufo = null; ufoTimer = 600;
  createAliens();
  createShields();
}

function startWave() {
  state = STATE.PLAYING;
  playerBullets = []; alienBullets = [];
  ufo = null; ufoTimer = 600;
  createAliens();
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    particles.push({
      x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
      life: 1, decay: Math.random()*0.03+0.02, color, size: Math.random()*3+1
    });
  }
}

function triggerShake(i, d) { shakeIntensity = i; shakeTimer = d; }

function update() {
  if (state !== STATE.PLAYING) return;

  // Player movement
  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));

  // Player shooting
  if (player.cooldown > 0) player.cooldown--;
  if (keys['Space'] && player.cooldown === 0 && playerBullets.length < 3) {
    playerBullets.push({ x: player.x, y: player.y - player.h/2, w: 3, h: 12, vy: -8 });
    player.cooldown = 15;
  }

  // Update player bullets
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    playerBullets[i].y += playerBullets[i].vy;
    if (playerBullets[i].y < -10) playerBullets.splice(i, 1);
  }

  // Alien movement
  const aliveAliens = aliens.filter(a => a.alive);
  const totalAliens = 55;
  const speedMult = 1 + (totalAliens - aliveAliens.length) / totalAliens * 2.5;
  let moveDown = false;

  for (let a of aliveAliens) {
    a.x += alienDir * alienSpeed * speedMult;
  }

  // Check bounds
  for (let a of aliveAliens) {
    if (a.x + a.w/2 > W - 10 || a.x - a.w/2 < 10) {
      moveDown = true;
      break;
    }
  }

  if (moveDown) {
    alienDir *= -1;
    for (let a of aliveAliens) {
      a.y += alienDropAmount;
      a.x += alienDir * alienSpeed * speedMult * 2;
    }
  }

  // Alien animation
  if (Math.random() < 0.05) {
    for (let a of aliens) a.frame = a.frame === 0 ? 1 : 0;
  }

  // Alien shooting
  alienShootTimer++;
  if (alienShootTimer >= alienShootInterval && aliveAliens.length > 0) {
    alienShootTimer = 0;
    // Pick random bottom alien from a column
    const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
    alienBullets.push({ x: shooter.x, y: shooter.y + shooter.h/2, w: 3, h: 10, vy: 3 + wave * 0.3 });
  }

  // Update alien bullets
  for (let i = alienBullets.length - 1; i >= 0; i--) {
    alienBullets[i].y += alienBullets[i].vy;
    if (alienBullets[i].y > H + 10) alienBullets.splice(i, 1);
  }

  // UFO
  ufoTimer--;
  if (ufoTimer <= 0 && !ufo) {
    ufo = { x: -40, y: 30, w: 36, h: 16, vx: 2, points: [50,100,150,300][Math.floor(Math.random()*4)] };
    ufoTimer = 800 + Math.random() * 400;
  }
  if (ufo) {
    ufo.x += ufo.vx;
    if (ufo.x > W + 40) ufo = null;
  }

  // Collision: player bullets vs aliens
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    for (let a of aliens) {
      if (!a.alive) continue;
      if (b.x > a.x - a.w/2 && b.x < a.x + a.w/2 &&
          b.y > a.y - a.h/2 && b.y < a.y + a.h/2) {
        a.alive = false;
        score += ALIEN_TYPES[a.type].points;
        spawnParticles(a.x, a.y, ALIEN_TYPES[a.type].color, 10);
        playerBullets.splice(i, 1);
        triggerShake(2, 4);
        break;
      }
    }
  }

  // Collision: player bullets vs UFO
  if (ufo) {
    for (let i = playerBullets.length - 1; i >= 0; i--) {
      const b = playerBullets[i];
      if (b.x > ufo.x - ufo.w/2 && b.x < ufo.x + ufo.w/2 &&
          b.y > ufo.y - ufo.h/2 && b.y < ufo.y + ufo.h/2) {
        score += ufo.points;
        spawnParticles(ufo.x, ufo.y, '#f0f', 15);
        playerBullets.splice(i, 1);
        ufo = null;
        triggerShake(4, 8);
        break;
      }
    }
  }

  // Collision: bullets vs shields
  for (let shield of shields) {
    for (let px of shield) {
      if (!px.alive) continue;
      // Player bullets
      for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        if (b.x > px.x && b.x < px.x + px.w && b.y > px.y && b.y < px.y + px.h) {
          px.alive = false;
          playerBullets.splice(i, 1);
          break;
        }
      }
      // Alien bullets
      for (let i = alienBullets.length - 1; i >= 0; i--) {
        const b = alienBullets[i];
        if (b.x > px.x && b.x < px.x + px.w && b.y > px.y && b.y < px.y + px.h) {
          px.alive = false;
          alienBullets.splice(i, 1);
          break;
        }
      }
    }
  }

  // Collision: alien bullets vs player
  for (let i = alienBullets.length - 1; i >= 0; i--) {
    const b = alienBullets[i];
    if (b.x > player.x - player.w/2 && b.x < player.x + player.w/2 &&
        b.y > player.y - player.h/2 && b.y < player.y + player.h/2) {
      alienBullets.splice(i, 1);
      loseLife();
      break;
    }
  }

  // Aliens reach bottom
  for (let a of aliveAliens) {
    if (a.y + a.h/2 > player.y - 20) {
      state = STATE.GAMEOVER;
      return;
    }
  }

  // Aliens vs shields (destroy shield pixels)
  for (let a of aliveAliens) {
    for (let shield of shields) {
      for (let px of shield) {
        if (!px.alive) continue;
        if (a.x + a.w/2 > px.x && a.x - a.w/2 < px.x + px.w &&
            a.y + a.h/2 > px.y && a.y - a.h/2 < px.y + px.h) {
          px.alive = false;
        }
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (shakeTimer > 0) shakeTimer--;

  // Wave clear
  if (aliveAliens.length === 0) {
    wave++;
    state = STATE.WAVE;
  }
}

function loseLife() {
  lives--;
  spawnParticles(player.x, player.y, '#0ff', 20);
  triggerShake(6, 12);
  if (lives <= 0) state = STATE.GAMEOVER;
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
  }
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // Stars background
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 50; i++) {
    const sx = (i * 137.5) % W;
    const sy = (i * 97.3 + performance.now() * 0.01 * (i%3+1)) % H;
    ctx.fillRect(sx, sy, 1, 1);
  }

  if (state === STATE.TITLE) { drawTitle(); ctx.restore(); return; }
  if (state === STATE.GAMEOVER) { drawGameOver(); ctx.restore(); return; }
  if (state === STATE.WAVE) { drawWave(); ctx.restore(); return; }

  // Shields
  ctx.fillStyle = '#00ff66';
  for (let shield of shields) {
    for (let px of shield) {
      if (px.alive) ctx.fillRect(px.x, px.y, px.w, px.h);
    }
  }

  // Aliens
  for (let a of aliens) {
    if (!a.alive) continue;
    const t = ALIEN_TYPES[a.type];
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 6;
    // Draw alien shape
    drawAlien(a.x, a.y, a.w, a.h, a.type, a.frame);
    ctx.shadowBlur = 0;
  }

  // UFO
  if (ufo) {
    ctx.fillStyle = '#f0f';
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(ufo.x, ufo.y, ufo.w/2, ufo.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(ufo.x, ufo.y - 4, ufo.w/4, ufo.h/3, 0, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Player
  ctx.fillStyle = '#0ff';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - player.h/2);
  ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
  ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(player.x - 2, player.y - player.h/2 - 8, 4, 10);
  ctx.shadowBlur = 0;

  // Player bullets
  ctx.fillStyle = '#ff0';
  ctx.shadowColor = '#ff0';
  ctx.shadowBlur = 4;
  for (let b of playerBullets) {
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  }
  ctx.shadowBlur = 0;

  // Alien bullets
  ctx.fillStyle = '#f44';
  for (let b of alienBullets) {
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
    ctx.fillRect(b.x - 1, b.y + b.h/2, 2, 4);
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('分数: ' + score, 10, 22);
  ctx.textAlign = 'center';
  ctx.fillText('第 ' + wave + ' 波', W/2, 22);
  ctx.textAlign = 'right';
  ctx.fillText('生命: ' + '▲'.repeat(lives), W - 10, 22);

  ctx.restore();
}

function drawAlien(x, y, w, h, type, frame) {
  const hw = w/2, hh = h/2;
  ctx.beginPath();
  if (type === 0) {
    // Small squid type
    ctx.rect(x - hw*0.4, y - hh, hw*0.8, h);
    ctx.rect(x - hw, y - hh*0.4, w, hh*0.8);
    if (frame === 0) { ctx.rect(x - hw, y + hh*0.4, hw*0.4, hh*0.6); ctx.rect(x + hw*0.6, y + hh*0.4, hw*0.4, hh*0.6); }
    else { ctx.rect(x - hw*0.6, y + hh*0.4, hw*0.4, hh*0.6); ctx.rect(x + hw*0.2, y + hh*0.4, hw*0.4, hh*0.6); }
  } else if (type === 1) {
    // Medium crab type
    ctx.rect(x - hw*0.6, y - hh, hw*1.2, h);
    ctx.rect(x - hw, y - hh*0.5, w, hh);
    if (frame === 0) { ctx.rect(x - hw, y - hh, hw*0.3, hh*0.6); ctx.rect(x + hw*0.7, y - hh, hw*0.3, hh*0.6); }
    else { ctx.rect(x - hw, y + hh*0.3, hw*0.3, hh*0.7); ctx.rect(x + hw*0.7, y + hh*0.3, hw*0.3, hh*0.7); }
  } else {
    // Large octopus type
    ctx.rect(x - hw*0.7, y - hh, hw*1.4, h*0.8);
    ctx.rect(x - hw, y - hh*0.3, w, hh*0.6);
    if (frame === 0) { ctx.rect(x - hw, y + hh*0.3, hw*0.5, hh*0.7); ctx.rect(x + hw*0.5, y + hh*0.3, hw*0.5, hh*0.7); }
    else { ctx.rect(x - hw*0.7, y + hh*0.4, hw*0.4, hh*0.6); ctx.rect(x + hw*0.3, y + hh*0.4, hw*0.4, hh*0.6); }
  }
  ctx.fill();
}

function drawTitle() {
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 44px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#0f0';
  ctx.shadowBlur = 20;
  ctx.fillText('太空侵略者', W/2, H/2 - 70);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText('SPACE INVADERS', W/2, H/2 - 30);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '15px monospace';
  ctx.fillText('← → 移动    空格 射击', W/2, H/2 + 20);
  ctx.fillText('消灭所有外星人，保护地球！', W/2, H/2 + 50);
  // Draw sample aliens
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = ALIEN_TYPES[i].color;
    drawAlien(W/2 - 80 + i*80, H/2 + 90, ALIEN_TYPES[i].w*1.5, ALIEN_TYPES[i].h*1.5, i, 0);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText(ALIEN_TYPES[i].points + '分', W/2 - 80 + i*80, H/2 + 115);
  }
  ctx.fillStyle = '#ff0';
  ctx.font = '16px monospace';
  ctx.fillText('点击或按空格开始', W/2, H/2 + 155);
}

function drawGameOver() {
  ctx.fillStyle = '#f00';
  ctx.font = 'bold 44px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#f00';
  ctx.shadowBlur = 20;
  ctx.fillText('游戏结束', W/2, H/2 - 40);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '22px monospace';
  ctx.fillText('最终分数: ' + score, W/2, H/2 + 10);
  ctx.fillText('到达波数: ' + wave, W/2, H/2 + 45);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('点击返回标题', W/2, H/2 + 100);
}

function drawWave() {
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 15;
  ctx.fillText('第 ' + (wave-1) + ' 波 清除!', W/2, H/2 - 30);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText('分数: ' + score, W/2, H/2 + 15);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('点击准备第 ' + wave + ' 波', W/2, H/2 + 60);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
