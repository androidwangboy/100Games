<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>公路赛车 - Road Fighter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let state = 'title', score = 0, lives = 3, hiScore = 0, level = 1;
let player, enemies, fuels, roadOffset, speed, maxSpeed, fuel, distance;
let keys = {}, particles = [], shakeTimer = 0, invincible = 0;
let spawnTimer = 0, fuelTimer = 0, difficultyTimer = 0, frameCount = 0;
let roadCurve = 0, targetCurve = 0, curveTimer = 0;
let treesLeft = [], treesRight = [], dashLines = [];
let lastTime = 0, nearMissTimer = 0, nearMissCount = 0;
const ROAD_LEFT = 200, ROAD_RIGHT = 600, LANES = 4;
const LANE_W = (ROAD_RIGHT - ROAD_LEFT) / LANES;

function laneX(lane) { return ROAD_LEFT + lane * LANE_W + LANE_W / 2; }

function init() {
  player = { x: 400, y: 390, w: 30, h: 52, lane: 1.5, tilt: 0, engineAnim: 0, braking: false };
  enemies = []; fuels = []; particles = [];
  roadOffset = 0; speed = 3; maxSpeed = 8; fuel = 100; distance = 0;
  spawnTimer = 0; fuelTimer = 0; difficultyTimer = 0;
  invincible = 0; shakeTimer = 0; nearMissCount = 0; nearMissTimer = 0;
  roadCurve = 0; targetCurve = 0; curveTimer = 0;
  treesLeft = []; treesRight = [];
  for (let i = 0; i < 8; i++) {
    treesLeft.push({ y: i * 70, h: 30 + Math.random() * 40, w: 20 + Math.random() * 15 });
    treesRight.push({ y: i * 70 + 35, h: 30 + Math.random() * 40, w: 20 + Math.random() * 15 });
  }
}

function spawnEnemy() {
  let lane = Math.floor(Math.random() * LANES);
  let type = Math.random() < 0.25 ? 'truck' : 'car';
  let colors = ['#e44', '#44e', '#e8e', '#4ee', '#ee4', '#f80', '#8f4'];
  let enemySpeed = 1 + Math.random() * 2 + level * 0.2;
  enemies.push({
    x: laneX(lane), y: -70, w: type === 'truck' ? 36 : 28,
    h: type === 'truck' ? 72 : 48, type,
    speed: enemySpeed, color: colors[Math.floor(Math.random() * colors.length)],
    lane, swerve: Math.random() < 0.15 + level * 0.02 ? (Math.random() - 0.5) * 0.6 : 0,
    passed: false, honked: false
  });
}

function spawnFuel() {
  let lane = Math.floor(Math.random() * LANES);
  fuels.push({ x: laneX(lane), y: -30, w: 22, h: 30, lane, bob: 0 });
}

function spawnParticles(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * (spread || 6),
      vy: (Math.random() - 0.5) * (spread || 6),
      life: 20 + Math.random() * 25,
      color, size: 2 + Math.random() * 4
    });
  }
}

function update(dt) {
  if (state !== 'play') return;
  frameCount += dt;
  player.engineAnim += dt * speed * 0.1;
  if (shakeTimer > 0) shakeTimer -= dt;
  if (invincible > 0) invincible -= dt;
  if (nearMissTimer > 0) nearMissTimer -= dt;

  // Difficulty progression
  difficultyTimer += dt;
  if (difficultyTimer > 500) {
    difficultyTimer = 0; level++;
    maxSpeed = Math.min(15, maxSpeed + 0.6);
  }

  // Speed control
  if (keys['ArrowUp'] || keys['KeyW']) {
    speed = Math.min(maxSpeed, speed + 0.06 * dt);
    player.braking = false;
  } else if (keys['ArrowDown'] || keys['KeyS']) {
    speed = Math.max(2, speed - 0.1 * dt);
    player.braking = true;
  } else {
    speed = Math.max(3, speed - 0.015 * dt);
    player.braking = false;
  }

  // Steering
  let steer = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) steer = -1;
  if (keys['ArrowRight'] || keys['KeyD']) steer = 1;
  let steerSpeed = 4.2 * dt * (speed / 5);
  player.x += steer * steerSpeed;
  player.x += roadCurve * speed * 0.02 * dt;
  player.tilt += (steer * 0.18 - player.tilt) * 0.12;
  player.x = Math.max(ROAD_LEFT + 18, Math.min(ROAD_RIGHT - 18, player.x));

  // Road curve
  curveTimer += dt;
  if (curveTimer > 200) {
    curveTimer = 0;
    targetCurve = (Math.random() - 0.5) * 2;
  }
  roadCurve += (targetCurve - roadCurve) * 0.01 * dt;

  // Update road
  roadOffset += speed * dt;
  distance += speed * dt * 0.1;
  score = Math.floor(distance) + nearMissCount * 20;

  // Fuel consumption
  fuel -= 0.018 * dt * (speed / 4);
  if (fuel <= 0) { fuel = 0; crashPlayer('fuel'); return; }

  // Spawn logic
  spawnTimer += dt;
  let spawnRate = Math.max(20, 55 - level * 4);
  if (spawnTimer > spawnRate) {
    spawnTimer = 0;
    spawnEnemy();
    if (Math.random() < 0.2 + level * 0.05) spawnEnemy();
  }
  fuelTimer += dt;
  if (fuelTimer > 160) { fuelTimer = 0; spawnFuel(); }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    e.y += (speed - e.speed) * dt;
    e.x += e.swerve * dt;
    e.x += roadCurve * speed * 0.015 * dt;
    if (e.x < ROAD_LEFT + 20 || e.x > ROAD_RIGHT - 20) e.swerve *= -1;
    if (e.y > 550) { enemies.splice(i, 1); continue; }

    // Collision detection
    if (invincible <= 0) {
      let dx = Math.abs(e.x - player.x);
      let dy = Math.abs(e.y - player.y);
      if (dx < (e.w + player.w) / 2 - 8 && dy < (e.h + player.h) / 2 - 8) {
        crashPlayer('hit');
        spawnParticles(e.x, e.y, e.color, 12, 8);
        enemies.splice(i, 1);
        return;
      }
      // Near miss detection
      if (!e.passed && e.y > player.y && dx < (e.w + player.w) / 2 + 10 && dy < (e.h + player.h) / 2 + 5) {
        e.passed = true;
        nearMissCount++;
        nearMissTimer = 40;
        particles.push({ x: player.x, y: player.y - 30, vx: 0, vy: -1.5, life: 40, color: '#0ff', size: 0, text: '险!' });
      }
    }
  }

  // Update fuel cans
  for (let i = fuels.length - 1; i >= 0; i--) {
    let f = fuels[i];
    f.y += speed * dt;
    f.bob += dt * 0.1;
    if (f.y > 550) { fuels.splice(i, 1); continue; }
    if (Math.abs(f.x - player.x) < 28 && Math.abs(f.y - player.y) < 38) {
      fuel = Math.min(100, fuel + 30);
      spawnParticles(f.x, f.y, '#4f4', 10, 5);
      particles.push({ x: f.x, y: f.y - 15, vx: 0, vy: -1.2, life: 45, color: '#4f4', size: 0, text: '+燃油' });
      fuels.splice(i, 1);
      score += 50;
    }
  }

  // Update scenery
  for (let t of treesLeft) {
    t.y += speed * dt * 0.8;
    if (t.y > 520) { t.y = -50; t.h = 30 + Math.random() * 40; t.w = 20 + Math.random() * 15; }
  }
  for (let t of treesRight) {
    t.y += speed * dt * 0.8;
    if (t.y > 520) { t.y = -50; t.h = 30 + Math.random() * 40; t.w = 20 + Math.random() * 15; }
  }

  // Exhaust particles
  if (speed > 4 && frameCount % 3 < dt) {
    particles.push({
      x: player.x - 6 + Math.random() * 12, y: player.y + 28,
      vx: (Math.random() - 0.5) * 1.5, vy: 2 + Math.random() * 2,
      life: 12 + Math.random() * 10,
      color: speed > maxSpeed * 0.8 ? '#f80' : '#666',
      size: 2 + Math.random() * 3
    });
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx || 0; p.y += p.vy || 0;
    if (!p.text) p.vy = (p.vy || 0) + 0.05;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function crashPlayer(reason) {
  lives--;
  shakeTimer = 25;
  spawnParticles(player.x, player.y, '#f80', 22, 9);
  spawnParticles(player.x, player.y, '#ff0', 12, 6);
  spawnParticles(player.x, player.y, '#333', 8, 4);
  if (lives <= 0) {
    state = 'over';
    if (score > hiScore) hiScore = score;
  } else {
    invincible = 150;
    speed = 3;
    if (reason === 'fuel') fuel = 60;
    player.x = 400;
    player.tilt = 0;
  }
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(Math.random() * shakeTimer * 0.5 - shakeTimer * 0.25, Math.random() * shakeTimer * 0.5 - shakeTimer * 0.25);
  }

  // Sky/grass background
  ctx.fillStyle = '#1a3a1a'; ctx.fillRect(0, 0, 800, 480);

  if (state === 'title') { ctx.restore(); drawTitle(); return; }
  if (state === 'over') { ctx.restore(); drawOver(); return; }

  // Grass texture
  ctx.fillStyle = '#1e4a1e';
  for (let y = (roadOffset * 1.5) % 30 - 30; y < 480; y += 30) {
    ctx.fillRect(0, y, ROAD_LEFT - 15, 2);
    ctx.fillRect(ROAD_RIGHT + 15, y, 800 - ROAD_RIGHT - 15, 2);
  }

  // Trees/scenery
  for (let t of treesLeft) {
    ctx.fillStyle = '#0a3a0a';
    ctx.beginPath(); ctx.ellipse(80 + roadCurve * 10, t.y, t.w, t.h, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0c4c0c';
    ctx.beginPath(); ctx.ellipse(78 + roadCurve * 10, t.y - 5, t.w * 0.6, t.h * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  for (let t of treesRight) {
    ctx.fillStyle = '#0a3a0a';
    ctx.beginPath(); ctx.ellipse(720 + roadCurve * 10, t.y, t.w, t.h, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0c4c0c';
    ctx.beginPath(); ctx.ellipse(722 + roadCurve * 10, t.y - 5, t.w * 0.6, t.h * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Road surface
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(ROAD_LEFT - 12, 0, ROAD_RIGHT - ROAD_LEFT + 24, 480);
  ctx.fillStyle = '#383838';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_RIGHT - ROAD_LEFT, 480);

  // Road texture (subtle)
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for (let y = (roadOffset * 2) % 20 - 20; y < 480; y += 20) {
    ctx.fillRect(ROAD_LEFT, y, ROAD_RIGHT - ROAD_LEFT, 1);
  }

  // Edge lines (red-white curbs)
  for (let y = (roadOffset * 2) % 40 - 40; y < 480; y += 40) {
    ctx.fillStyle = '#e22'; ctx.fillRect(ROAD_LEFT - 12, y, 10, 20);
    ctx.fillStyle = '#fff'; ctx.fillRect(ROAD_LEFT - 12, y + 20, 10, 20);
    ctx.fillStyle = '#e22'; ctx.fillRect(ROAD_RIGHT + 2, y, 10, 20);
    ctx.fillStyle = '#fff'; ctx.fillRect(ROAD_RIGHT + 2, y + 20, 10, 20);
  }

  // Solid edge lines
  ctx.fillStyle = '#fff';
  ctx.fillRect(ROAD_LEFT - 2, 0, 3, 480);
  ctx.fillRect(ROAD_RIGHT - 1, 0, 3, 480);

  // Lane dashes
  ctx.fillStyle = '#ccc';
  for (let l = 1; l < LANES; l++) {
    let x = ROAD_LEFT + l * LANE_W;
    for (let y = (roadOffset * 2) % 60 - 60; y < 480; y += 60) {
      ctx.fillRect(x - 1.5, y, 3, 30);
    }
  }

  // Draw fuel cans
  for (let f of fuels) {
    let bob = Math.sin(f.bob) * 2;
    ctx.save();
    ctx.translate(f.x, f.y + bob);
    // Can body
    ctx.fillStyle = '#2a2';
    ctx.beginPath(); ctx.roundRect(-11, -15, 22, 30, 3); ctx.fill();
    ctx.fillStyle = '#4f4';
    ctx.beginPath(); ctx.roundRect(-8, -12, 16, 24, 2); ctx.fill();
    // Cap
    ctx.fillStyle = '#888';
    ctx.fillRect(-4, -18, 8, 5);
    // Label
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    ctx.fillText('F', 0, 5);
    ctx.textAlign = 'left';
    // Glow
    ctx.strokeStyle = `rgba(0,255,0,${0.3 + Math.sin(f.bob * 2) * 0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-13, -17, 26, 34, 4); ctx.stroke();
    ctx.restore();
  }

  // Draw enemy vehicles
  for (let e of enemies) {
    drawVehicle(e.x, e.y, e.w, e.h, e.color, e.type === 'truck', 0, false);
  }

  // Draw player
  if (invincible <= 0 || Math.floor(invincible / 5) % 2 === 0) {
    drawVehicle(player.x, player.y, player.w, player.h, '#4af', false, player.tilt, true);
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    if (p.text) {
      ctx.fillStyle = p.color; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y); ctx.textAlign = 'left';
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  // Near miss flash
  if (nearMissTimer > 0) {
    ctx.fillStyle = `rgba(0,255,255,${nearMissTimer * 0.005})`;
    ctx.fillRect(0, 0, 800, 480);
  }

  // HUD
  drawHUD();
  ctx.restore();
}

function drawVehicle(x, y, w, h, color, isTruck, tilt, isPlayer) {
  ctx.save();
  ctx.translate(x, y);
  if (tilt) ctx.rotate(tilt);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(3, 5, w / 2 + 2, h / 2 - 5, 0, 0, Math.PI * 2); ctx.fill();

  // Body
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 6); ctx.fill();

  // Roof/windshield
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.roundRect(-w / 2 + 4, -h / 2 + 8, w - 8, h * 0.3, 3); ctx.fill();

  // Rear window
  ctx.fillStyle = 'rgba(100,150,255,0.3)';
  ctx.beginPath(); ctx.roundRect(-w / 2 + 5, h / 2 - 16, w - 10, 10, 2); ctx.fill();

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(-w / 2 + 3, -h / 2 + 2, w - 6, 5);

  // Wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(-w / 2 - 4, -h / 4, 5, 14);
  ctx.fillRect(w / 2 - 1, -h / 4, 5, 14);
  ctx.fillRect(-w / 2 - 4, h / 4 - 8, 5, 14);
  ctx.fillRect(w / 2 - 1, h / 4 - 8, 5, 14);

  if (isTruck) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(-w / 2 + 2, -2, w - 4, h / 2 - 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
    ctx.strokeRect(-w / 2 + 2, -2, w - 4, h / 2 - 4);
  }

  // Tail lights
  ctx.fillStyle = '#f22';
  ctx.fillRect(-w / 2 + 3, h / 2 - 5, 7, 4);
  ctx.fillRect(w / 2 - 10, h / 2 - 5, 7, 4);

  // Headlights (for player)
  if (isPlayer) {
    ctx.fillStyle = '#ff8';
    ctx.fillRect(-w / 2 + 3, -h / 2, 6, 4);
    ctx.fillRect(w / 2 - 9, -h / 2, 6, 4);
    // Brake lights
    if (player.braking) {
      ctx.fillStyle = '#f00';
      ctx.shadowColor = '#f00'; ctx.shadowBlur = 8;
      ctx.fillRect(-w / 2 + 2, h / 2 - 6, 8, 5);
      ctx.fillRect(w / 2 - 10, h / 2 - 6, 8, 5);
      ctx.shadowBlur = 0;
    }
  }
  ctx.restore();
}

function drawHUD() {
  // Score panel
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(5, 5, 180, 55, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '15px monospace';
  ctx.fillText('分数: ' + score, 12, 24);
  ctx.fillStyle = '#aaa'; ctx.font = '13px monospace';
  ctx.fillText('最高: ' + hiScore, 12, 42);
  ctx.fillStyle = '#0ff';
  ctx.fillText('等级: ' + level, 12, 56);

  // Lives and level
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(615, 5, 180, 55, 5); ctx.fill();
  ctx.fillStyle = '#f44'; ctx.font = '15px monospace';
  ctx.fillText('生命: ' + '♥'.repeat(Math.max(0, lives)), 622, 24);
  ctx.fillStyle = '#aaa'; ctx.font = '13px monospace';
  ctx.fillText('距离: ' + Math.floor(distance) + 'm', 622, 42);
  ctx.fillStyle = '#ff0';
  ctx.fillText('险过: ' + nearMissCount, 622, 56);

  // Fuel gauge
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(615, 65, 180, 24, 4); ctx.fill();
  ctx.fillStyle = '#333'; ctx.fillRect(650, 70, 140, 14);
  let fuelColor = fuel > 50 ? '#4f4' : fuel > 25 ? '#ff0' : '#f44';
  if (fuel <= 25 && Math.floor(frameCount / 10) % 2 === 0) fuelColor = '#f88';
  ctx.fillStyle = fuelColor;
  ctx.fillRect(652, 72, (fuel / 100) * 136, 10);
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
  ctx.fillText('燃油', 622, 82);

  // Speed gauge
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(5, 440, 150, 30, 4); ctx.fill();
  let speedPct = (speed - 2) / (maxSpeed - 2);
  ctx.fillStyle = '#333'; ctx.fillRect(50, 448, 98, 14);
  let spdColor = speedPct > 0.8 ? '#f44' : speedPct > 0.5 ? '#ff0' : '#4f4';
  ctx.fillStyle = spdColor;
  ctx.fillRect(52, 450, speedPct * 94, 10);
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
  ctx.fillText('速度', 12, 460);
  ctx.fillText(Math.floor(speed * 20) + 'km/h', 100, 460);
}

function drawTitle() {
  // Road background
  ctx.fillStyle = '#2a2a2a'; ctx.fillRect(250, 0, 300, 480);
  ctx.fillStyle = '#ccc';
  for (let y = (Date.now() * 0.1) % 60 - 60; y < 480; y += 60) {
    ctx.fillRect(398, y, 4, 30);
  }
  ctx.fillStyle = '#1a3a1a'; ctx.fillRect(0, 0, 250, 480);
  ctx.fillStyle = '#1a3a1a'; ctx.fillRect(550, 0, 250, 480);

  // Title
  ctx.fillStyle = '#f80'; ctx.font = 'bold 52px monospace'; ctx.textAlign = 'center';
  ctx.fillText('公路赛车', 400, 100);
  ctx.fillStyle = '#fa0'; ctx.font = '22px monospace';
  ctx.fillText('ROAD FIGHTER', 400, 138);

  // Animated car
  let carY = 220 + Math.sin(Date.now() * 0.003) * 8;
  drawVehicle(400, carY, 36, 58, '#4af', false, Math.sin(Date.now() * 0.005) * 0.05, true);

  // Instructions
  ctx.fillStyle = '#4f4'; ctx.font = '18px monospace';
  ctx.fillText('← → / A D - 左右转向', 400, 300);
  ctx.fillText('↑ ↓ / W S - 加速/减速', 400, 330);
  ctx.fillText('收集燃油罐, 躲避车辆!', 400, 360);
  ctx.fillText('擦身而过获得额外分数!', 400, 390);

  ctx.fillStyle = '#ff0'; ctx.font = 'bold 24px monospace';
  let blink = Math.sin(Date.now() * 0.005) > 0;
  if (blink) ctx.fillText('按 ENTER 开始游戏', 400, 435);
  ctx.fillStyle = '#888'; ctx.font = '14px monospace';
  ctx.fillText('ESC 退出', 400, 465);
  ctx.textAlign = 'left';
}

function drawOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, 800, 480);

  // Explosion animation
  let t = Date.now() * 0.003;
  for (let i = 0; i < 8; i++) {
    let angle = (i / 8) * Math.PI * 2 + t;
    let r = 30 + Math.sin(t * 2 + i) * 10;
    ctx.fillStyle = i % 2 ? '#f80' : '#f44';
    ctx.beginPath();
    ctx.arc(400 + Math.cos(angle) * r, 100 + Math.sin(angle) * r * 0.5, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#f44'; ctx.font = 'bold 46px monospace'; ctx.textAlign = 'center';
  ctx.fillText('游 戏 结 束', 400, 160);
  ctx.fillStyle = '#fff'; ctx.font = '26px monospace';
  ctx.fillText('行驶距离: ' + Math.floor(distance) + ' m', 400, 230);
  ctx.fillStyle = '#ff0'; ctx.font = '22px monospace';
  ctx.fillText('最终分数: ' + score, 400, 275);
  ctx.fillText('最高纪录: ' + hiScore, 400, 315);
  ctx.fillStyle = '#aaa'; ctx.font = '18px monospace';
  ctx.fillText('到达等级: ' + level + '  险过次数: ' + nearMissCount, 400, 355);

  ctx.fillStyle = '#4f4'; ctx.font = 'bold 22px monospace';
  let blink = Math.sin(Date.now() * 0.005) > 0;
  if (blink) ctx.fillText('按 ENTER 重新开始', 400, 420);
  ctx.fillStyle = '#888'; ctx.font = '14px monospace';
  ctx.fillText('ESC 退出', 400, 460);
  ctx.textAlign = 'left';
}

function gameLoop(time) {
  let dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Enter') {
    if (state === 'title') { state = 'play'; score = 0; lives = 3; level = 1; maxSpeed = 8; init(); }
    else if (state === 'over') { state = 'play'; score = 0; lives = 3; level = 1; maxSpeed = 8; init(); }
  }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
requestAnimationFrame(gameLoop);
