<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>导弹指挥官</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

let score = 0;
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});

const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2, WAVE_END: 3 };
let state = STATE.TITLE;
let wave = 1;
let shakeTimer = 0, shakeIntensity = 0;
let waveEndTimer = 0;

// Cities
let cities = [];
const CITY_COUNT = 6;
const CITY_W = 36, CITY_H = 24;

// Batteries (3 missile silos)
let batteries = [];
const BATTERY_AMMO = 10;

// Enemy missiles
let enemyMissiles = [];
let enemySpawnTimer = 0;
let enemySpawnInterval = 90;
let enemyMissileSpeed = 0.8;
let missilesThisWave = 0;
let missilesSpawned = 0;

// Player counter-missiles
let counterMissiles = [];

// Explosions
let explosions = [];

// Particles
let particles = [];

// Crosshair
let crossX = W/2, crossY = H/2;

// Input
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  crossX = (e.clientX - rect.left) * (W / rect.width);
  crossY = (e.clientY - rect.top) * (H / rect.height);
});

canvas.addEventListener('click', e => {
  if (state === STATE.TITLE) { startGame(); return; }
  if (state === STATE.GAMEOVER) { state = STATE.TITLE; return; }
  if (state === STATE.WAVE_END) { nextWave(); return; }
  if (state === STATE.PLAYING) {
    fireCounterMissile(crossX, crossY);
  }
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === STATE.TITLE) startGame();
    else if (state === STATE.GAMEOVER) state = STATE.TITLE;
    else if (state === STATE.WAVE_END) nextWave();
    else if (state === STATE.PLAYING) fireCounterMissile(crossX, crossY);
  }
});

function initCities() {
  cities = [];
  const positions = [90, 170, 250, 550, 630, 710];
  for (let i = 0; i < CITY_COUNT; i++) {
    cities.push({ x: positions[i], y: H - 30, w: CITY_W, h: CITY_H, alive: true });
  }
}

function initBatteries() {
  batteries = [];
  const positions = [30, W/2, W - 30];
  for (let i = 0; i < 3; i++) {
    batteries.push({ x: positions[i], y: H - 20, ammo: BATTERY_AMMO });
  }
}

function startGame() {
  state = STATE.PLAYING;
  score = 0; wave = 1;
  initCities();
  initBatteries();
  enemyMissiles = [];
  counterMissiles = [];
  explosions = [];
  particles = [];
  setupWave();
}

function nextWave() {
  wave++;
  state = STATE.PLAYING;
  // Restore ammo
  for (let b of batteries) b.ammo = BATTERY_AMMO;
  enemyMissiles = [];
  counterMissiles = [];
  explosions = [];
  setupWave();
}

function setupWave() {
  missilesThisWave = 8 + wave * 3;
  missilesSpawned = 0;
  enemySpawnInterval = Math.max(25, 90 - wave * 7);
  enemyMissileSpeed = 0.8 + wave * 0.15;
  enemySpawnTimer = 0;
}

function fireCounterMissile(targetX, targetY) {
  // Find closest battery with ammo
  let best = null, bestDist = Infinity;
  for (let b of batteries) {
    if (b.ammo <= 0) continue;
    const d = Math.hypot(targetX - b.x, targetY - b.y);
    if (d < bestDist) { bestDist = d; best = b; }
  }
  if (!best) return;

  best.ammo--;
  const speed = 6;
  const dx = targetX - best.x;
  const dy = targetY - best.y;
  const dist = Math.hypot(dx, dy);
  counterMissiles.push({
    x: best.x, y: best.y,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    targetX, targetY,
    trail: []
  });
}

function spawnEnemyMissile() {
  // Target a city or battery
  const targets = [];
  for (let c of cities) if (c.alive) targets.push({ x: c.x, y: c.y });
  for (let b of batteries) targets.push({ x: b.x, y: b.y });
  if (targets.length === 0) return;

  const target = targets[Math.floor(Math.random() * targets.length)];
  const startX = Math.random() * W;
  const speed = enemyMissileSpeed * (0.8 + Math.random() * 0.4);
  const dx = target.x - startX;
  const dy = target.y - 0;
  const dist = Math.hypot(dx, dy);

  enemyMissiles.push({
    x: startX, y: -5,
    vx: (dx / dist) * speed,
    vy: (dy / dist) * speed,
    targetX: target.x, targetY: target.y,
    trail: [],
    split: wave >= 3 && Math.random() < 0.15 // MIRV chance
  });
}

function createExplosion(x, y, isPlayer) {
  explosions.push({
    x, y,
    radius: 5,
    maxRadius: isPlayer ? 40 : 30,
    growing: true,
    life: 1,
    color: isPlayer ? '#0ff' : '#f80'
  });
  spawnParticles(x, y, isPlayer ? '#0ff' : '#f80', 8);
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 1, decay: 0.02+Math.random()*0.02, color, size: Math.random()*3+1 });
  }
}

function triggerShake(i, d) { shakeIntensity = i; shakeTimer = d; }

function update() {
  if (state !== STATE.PLAYING) return;

  // Spawn enemy missiles
  enemySpawnTimer++;
  if (enemySpawnTimer >= enemySpawnInterval && missilesSpawned < missilesThisWave) {
    enemySpawnTimer = 0;
    spawnEnemyMissile();
    missilesSpawned++;
    // Sometimes spawn multiple
    if (wave >= 4 && Math.random() < 0.3 && missilesSpawned < missilesThisWave) {
      spawnEnemyMissile();
      missilesSpawned++;
    }
  }

  // Update enemy missiles
  for (let i = enemyMissiles.length - 1; i >= 0; i--) {
    const m = enemyMissiles[i];
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 30) m.trail.shift();
    m.x += m.vx;
    m.y += m.vy;

    // MIRV split
    if (m.split && m.y > H * 0.4 && !m.hasSplit) {
      m.hasSplit = true;
      const targets = cities.filter(c => c.alive);
      if (targets.length > 0) {
        const t = targets[Math.floor(Math.random() * targets.length)];
        const dx = t.x - m.x, dy = t.y - m.y;
        const d = Math.hypot(dx, dy);
        enemyMissiles.push({
          x: m.x, y: m.y,
          vx: (dx/d) * enemyMissileSpeed, vy: (dy/d) * enemyMissileSpeed,
          targetX: t.x, targetY: t.y, trail: [], split: false
        });
      }
    }

    // Hit ground
    if (m.y >= H - 35) {
      createExplosion(m.x, H - 35, false);
      triggerShake(4, 8);
      // Check city/battery damage
      for (let c of cities) {
        if (c.alive && Math.abs(c.x - m.x) < CITY_W) {
          c.alive = false;
          spawnParticles(c.x, c.y, '#f80', 20);
          triggerShake(6, 12);
        }
      }
      enemyMissiles.splice(i, 1);
      continue;
    }

    // Check if hit by explosion
    for (let exp of explosions) {
      if (exp.growing && Math.hypot(m.x - exp.x, m.y - exp.y) < exp.radius) {
        score += 25;
        createExplosion(m.x, m.y, false);
        spawnParticles(m.x, m.y, '#ff0', 6);
        enemyMissiles.splice(i, 1);
        break;
      }
    }
  }

  // Update counter-missiles
  for (let i = counterMissiles.length - 1; i >= 0; i--) {
    const m = counterMissiles[i];
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 20) m.trail.shift();
    m.x += m.vx;
    m.y += m.vy;

    // Reached target
    const dist = Math.hypot(m.x - m.targetX, m.y - m.targetY);
    if (dist < 8 || m.y < 10) {
      createExplosion(m.targetX, m.targetY, true);
      counterMissiles.splice(i, 1);
    }
  }

  // Update explosions
  for (let i = explosions.length - 1; i >= 0; i--) {
    const exp = explosions[i];
    if (exp.growing) {
      exp.radius += 1.5;
      if (exp.radius >= exp.maxRadius) exp.growing = false;
    } else {
      exp.life -= 0.025;
      exp.radius -= 0.5;
      if (exp.life <= 0) { explosions.splice(i, 1); continue; }
    }

    // Player explosions destroy enemy missiles
    if (exp.color === '#0ff') {
      for (let j = enemyMissiles.length - 1; j >= 0; j--) {
        const m = enemyMissiles[j];
        if (Math.hypot(m.x - exp.x, m.y - exp.y) < exp.radius) {
          score += 25;
          spawnParticles(m.x, m.y, '#ff0', 6);
          createExplosion(m.x, m.y, false);
          enemyMissiles.splice(j, 1);
        }
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (shakeTimer > 0) shakeTimer--;

  // Check wave end
  if (missilesSpawned >= missilesThisWave && enemyMissiles.length === 0 && counterMissiles.length === 0) {
    // Bonus for surviving cities and remaining ammo
    let cityBonus = cities.filter(c => c.alive).length * 100;
    let ammoBonus = batteries.reduce((sum, b) => sum + b.ammo, 0) * 5;
    score += cityBonus + ammoBonus;
    state = STATE.WAVE_END;
    waveEndTimer = 0;
  }

  // Check game over
  if (cities.every(c => !c.alive)) {
    state = STATE.GAMEOVER;
    triggerShake(8, 20);
  }
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
  }

  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#000020');
  grad.addColorStop(0.7, '#0a0a30');
  grad.addColorStop(1, '#1a0a00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 197.3) % W;
    const sy = (i * 83.7) % (H * 0.6);
    ctx.fillRect(sx, sy, 1, 1);
  }

  if (state === STATE.TITLE) { drawTitle(); ctx.restore(); return; }
  if (state === STATE.GAMEOVER) { drawGameOver(); ctx.restore(); return; }

  // Ground
  ctx.fillStyle = '#2a1a00';
  ctx.fillRect(0, H - 12, W, 12);
  ctx.fillStyle = '#3a2a10';
  ctx.fillRect(0, H - 14, W, 3);

  // Cities
  for (let c of cities) {
    if (c.alive) {
      ctx.fillStyle = '#4af';
      ctx.shadowColor = '#4af';
      ctx.shadowBlur = 4;
      // Buildings
      const bw = 6, gap = 2;
      const heights = [16, 22, 12, 20, 14, 18];
      for (let b = 0; b < 6; b++) {
        const bh = heights[b];
        ctx.fillRect(c.x - c.w/2 + b*(bw+gap), c.y - bh, bw, bh);
      }
      // Windows
      ctx.fillStyle = '#ff0';
      for (let b = 0; b < 6; b++) {
        const bh = heights[b];
        for (let wy = 4; wy < bh - 2; wy += 6) {
          ctx.fillRect(c.x - c.w/2 + b*(bw+gap) + 2, c.y - bh + wy, 2, 2);
        }
      }
      ctx.shadowBlur = 0;
    } else {
      // Rubble
      ctx.fillStyle = '#333';
      ctx.fillRect(c.x - c.w/2, c.y - 4, c.w, 4);
      ctx.fillStyle = '#555';
      for (let r = 0; r < 4; r++) {
        ctx.fillRect(c.x - c.w/2 + r*10, c.y - 6 - Math.random()*3, 5, 3);
      }
    }
  }

  // Batteries
  for (let b of batteries) {
    ctx.fillStyle = '#0a0';
    ctx.shadowColor = '#0a0';
    ctx.shadowBlur = 4;
    // Silo shape
    ctx.beginPath();
    ctx.moveTo(b.x - 14, b.y);
    ctx.lineTo(b.x - 8, b.y - 16);
    ctx.lineTo(b.x + 8, b.y - 16);
    ctx.lineTo(b.x + 14, b.y);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // Ammo indicator
    ctx.fillStyle = '#ff0';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(b.ammo, b.x, b.y - 20);
    // Ammo bar
    ctx.fillStyle = b.ammo > 3 ? '#0f0' : '#f00';
    ctx.fillRect(b.x - 12, b.y + 2, 24 * (b.ammo / BATTERY_AMMO), 3);
  }

  // Enemy missile trails
  for (let m of enemyMissiles) {
    // Trail
    ctx.strokeStyle = 'rgba(255, 50, 50, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let t = 0; t < m.trail.length; t++) {
      const p = m.trail[t];
      t === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    ctx.lineTo(m.x, m.y);
    ctx.stroke();
    // Warhead
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f00';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Counter-missile trails
  for (let m of counterMissiles) {
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let t = 0; t < m.trail.length; t++) {
      const p = m.trail[t];
      t === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    ctx.lineTo(m.x, m.y);
    ctx.stroke();
    // Head
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Target marker
    ctx.strokeStyle = 'rgba(0,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(m.targetX, m.targetY, 5, 0, Math.PI*2);
    ctx.stroke();
  }

  // Explosions
  for (let exp of explosions) {
    const alpha = exp.growing ? 0.8 : exp.life * 0.8;
    ctx.beginPath();
    ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI*2);
    ctx.fillStyle = exp.color === '#0ff'
      ? `rgba(0, 255, 255, ${alpha * 0.3})`
      : `rgba(255, 150, 0, ${alpha * 0.3})`;
    ctx.fill();
    ctx.strokeStyle = exp.color === '#0ff'
      ? `rgba(0, 255, 255, ${alpha})`
      : `rgba(255, 200, 0, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    // Inner glow
    ctx.beginPath();
    ctx.arc(exp.x, exp.y, exp.radius * 0.5, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
    ctx.fill();
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Crosshair
  if (state === STATE.PLAYING) {
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(crossX - 10, crossY); ctx.lineTo(crossX - 4, crossY);
    ctx.moveTo(crossX + 4, crossY); ctx.lineTo(crossX + 10, crossY);
    ctx.moveTo(crossX, crossY - 10); ctx.lineTo(crossX, crossY - 4);
    ctx.moveTo(crossX, crossY + 4); ctx.lineTo(crossX, crossY + 10);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(crossX, crossY, 12, 0, Math.PI*2);
    ctx.stroke();
  }

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '15px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('分数: ' + score, 10, 20);
  ctx.textAlign = 'center';
  ctx.fillText('第 ' + wave + ' 波', W/2, 20);
  ctx.textAlign = 'right';
  const aliveCities = cities.filter(c => c.alive).length;
  ctx.fillText('城市: ' + aliveCities + '/' + CITY_COUNT, W - 10, 20);

  // Wave progress
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(W/2 - 60, 28, 120, 4);
  ctx.fillStyle = '#f44';
  ctx.fillRect(W/2 - 60, 28, 120 * (missilesSpawned / missilesThisWave), 4);

  // Wave end overlay
  if (state === STATE.WAVE_END) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 34px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#0f0';
    ctx.shadowBlur = 15;
    ctx.fillText('第 ' + wave + ' 波 防御成功!', W/2, H/2 - 50);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    const cityBonus = cities.filter(c => c.alive).length * 100;
    ctx.fillText('城市奖励: +' + cityBonus, W/2, H/2);
    ctx.fillText('当前分数: ' + score, W/2, H/2 + 30);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '16px monospace';
    ctx.fillText('点击准备第 ' + (wave+1) + ' 波', W/2, H/2 + 75);
  }

  ctx.restore();
}

function drawTitle() {
  // Decorative missiles
  const t = performance.now() * 0.001;
  for (let i = 0; i < 5; i++) {
    const mx = 100 + i * 150;
    const my = (t * 30 + i * 100) % H;
    ctx.strokeStyle = 'rgba(255,50,50,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx, 0); ctx.lineTo(mx + (i-2)*20, my);
    ctx.stroke();
    ctx.fillStyle = '#f44';
    ctx.beginPath();
    ctx.arc(mx + (i-2)*20 * (my/H), my, 3, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = '#f80';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#f80';
  ctx.shadowBlur = 20;
  ctx.fillText('导弹指挥官', W/2, H/2 - 70);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText('MISSILE COMMAND', W/2, H/2 - 30);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '15px monospace';
  ctx.fillText('点击发射拦截导弹，保护城市！', W/2, H/2 + 15);
  ctx.fillText('鼠标瞄准，点击发射', W/2, H/2 + 45);
  ctx.fillText('弹药有限，选择最近的发射井', W/2, H/2 + 70);
  ctx.fillStyle = '#ff0';
  ctx.font = '16px monospace';
  ctx.fillText('点击开始游戏', W/2, H/2 + 120);
}

function drawGameOver() {
  ctx.fillStyle = '#f00';
  ctx.font = 'bold 44px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#f00';
  ctx.shadowBlur = 20;
  ctx.fillText('游戏结束', W/2, H/2 - 50);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText('所有城市已被摧毁', W/2, H/2);
  ctx.fillText('最终分数: ' + score, W/2, H/2 + 35);
  ctx.fillText('坚持到第 ' + wave + ' 波', W/2, H/2 + 65);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('点击返回标题', W/2, H/2 + 110);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
