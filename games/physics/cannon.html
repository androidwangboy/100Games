<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>炮弹轨迹</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

// Game states
const STATE = { TITLE: 0, PLAYING: 1, LEVEL_CLEAR: 2, GAME_OVER: 3, WIN: 4 };
let state = STATE.TITLE;
let score = 0;
let level = 0;
let ammo = 0;
let angle = 45;
let power = 50;
let charging = false;
let chargeDir = 1;
let wind = 0;
let projectile = null;
let particles = [];
let targets = [];
let blocks = [];
let cannon = { x: 60, y: H - 60 };
let shotsFired = 0;
let levelScores = [];
let trailDots = [];
let shakeTimer = 0;
let message = '';
let messageTimer = 0;

const GRAVITY = 0.25;
const MAX_POWER = 100;

// Level definitions
const levels = [
  {
    ammo: 5, wind: 0,
    targets: [{x: 500, y: H-80, w: 30, h: 50, hp: 1}, {x: 600, y: H-80, w: 30, h: 50, hp: 1}],
    blocks: [{x: 450, y: H-60, w: 20, h: 60}, {x: 550, y: H-60, w: 20, h: 60}]
  },
  {
    ammo: 5, wind: 0.03,
    targets: [{x: 550, y: H-100, w: 30, h: 40, hp: 1}, {x: 650, y: H-80, w: 30, h: 50, hp: 1}, {x: 700, y: H-120, w: 25, h: 30, hp: 1}],
    blocks: [{x: 500, y: H-80, w: 15, h: 80}, {x: 600, y: H-60, w: 120, h: 15}, {x: 600, y: H-120, w: 15, h: 60}]
  },
  {
    ammo: 4, wind: -0.04,
    targets: [{x: 400, y: H-140, w: 30, h: 40, hp: 2}, {x: 600, y: H-80, w: 30, h: 50, hp: 1}, {x: 720, y: H-100, w: 25, h: 40, hp: 1}],
    blocks: [{x: 350, y: H-100, w: 120, h: 15}, {x: 350, y: H-100, w: 15, h: 100}, {x: 455, y: H-100, w: 15, h: 100}, {x: 560, y: H-60, w: 15, h: 60}]
  },
  {
    ammo: 4, wind: 0.05,
    targets: [{x: 450, y: H-80, w: 25, h: 50, hp: 1}, {x: 550, y: H-160, w: 30, h: 40, hp: 2}, {x: 650, y: H-80, w: 25, h: 50, hp: 1}, {x: 730, y: H-120, w: 25, h: 30, hp: 1}],
    blocks: [{x: 420, y: H-60, w: 15, h: 60}, {x: 500, y: H-120, w: 120, h: 15}, {x: 500, y: H-120, w: 15, h: 120}, {x: 610, y: H-120, w: 15, h: 120}, {x: 620, y: H-60, w: 80, h: 15}]
  },
  {
    ammo: 3, wind: -0.06,
    targets: [{x: 500, y: H-180, w: 30, h: 40, hp: 2}, {x: 600, y: H-80, w: 30, h: 50, hp: 1}, {x: 700, y: H-140, w: 30, h: 40, hp: 2}, {x: 750, y: H-80, w: 25, h: 50, hp: 1}],
    blocks: [{x: 460, y: H-140, w: 100, h: 15}, {x: 460, y: H-140, w: 15, h: 140}, {x: 545, y: H-140, w: 15, h: 140}, {x: 650, y: H-100, w: 120, h: 15}, {x: 650, y: H-100, w: 15, h: 100}, {x: 755, y: H-100, w: 15, h: 100}]
  }
];

function loadLevel(idx) {
  const lv = levels[idx];
  ammo = lv.ammo;
  wind = lv.wind;
  targets = lv.targets.map(t => ({...t, alive: true, flash: 0}));
  blocks = lv.blocks.map(b => ({...b}));
  projectile = null;
  particles = [];
  trailDots = [];
  shotsFired = 0;
  angle = 45;
  power = 50;
  charging = false;
}

function fire() {
  if (ammo <= 0 || projectile) return;
  ammo--;
  shotsFired++;
  const rad = -angle * Math.PI / 180;
  const speed = power * 0.18;
  projectile = {
    x: cannon.x + Math.cos(rad) * 40,
    y: cannon.y + Math.sin(rad) * 40,
    vx: Math.cos(rad) * speed,
    vy: Math.sin(rad) * speed,
    r: 6,
    active: true
  };
  trailDots = [];
}

function explode(x, y, big) {
  const count = big ? 30 : 15;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * (big ? 6 : 4) + 1;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 2,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color: big ? `hsl(${Math.random()*60+10}, 100%, ${50+Math.random()*30}%)` : `hsl(${Math.random()*40+20}, 90%, 60%)`,
      size: Math.random() * (big ? 5 : 3) + 2
    });
  }
  shakeTimer = big ? 12 : 6;
}

function getTrajectoryPreview() {
  const pts = [];
  const rad = -angle * Math.PI / 180;
  const speed = power * 0.18;
  let px = cannon.x + Math.cos(rad) * 40;
  let py = cannon.y + Math.sin(rad) * 40;
  let vx = Math.cos(rad) * speed;
  let vy = Math.sin(rad) * speed;
  for (let i = 0; i < 40; i++) {
    vx += wind;
    vy += GRAVITY;
    px += vx;
    py += vy;
    if (py > H - 20) break;
    if (i % 3 === 0) pts.push({x: px, y: py});
  }
  return pts;
}

function rectContains(rx, ry, rw, rh, px, py, pr) {
  return px + pr > rx && px - pr < rx + rw && py + pr > ry && py - pr < ry + rh;
}

function update() {
  if (state !== STATE.PLAYING) return;

  if (charging) {
    power += chargeDir * 1.2;
    if (power >= MAX_POWER) { power = MAX_POWER; chargeDir = -1; }
    if (power <= 10) { power = 10; chargeDir = 1; }
  }

  if (projectile && projectile.active) {
    projectile.vx += wind;
    projectile.vy += GRAVITY;
    projectile.x += projectile.vx;
    projectile.y += projectile.vy;

    trailDots.push({x: projectile.x, y: projectile.y, life: 1});
    if (trailDots.length > 30) trailDots.shift();

    // Ground collision
    if (projectile.y > H - 20) {
      explode(projectile.x, H - 20, false);
      projectile.active = false;
      projectile = null;
      checkLevelEnd();
      return;
    }
    // Out of bounds
    if (projectile.x > W + 50 || projectile.x < -50) {
      projectile = null;
      checkLevelEnd();
      return;
    }

    // Block collision
    for (let b of blocks) {
      if (rectContains(b.x, b.y, b.w, b.h, projectile.x, projectile.y, projectile.r)) {
        explode(projectile.x, projectile.y, false);
        projectile.active = false;
        projectile = null;
        checkLevelEnd();
        return;
      }
    }

    // Target collision
    for (let t of targets) {
      if (!t.alive) continue;
      if (rectContains(t.x, t.y, t.w, t.h, projectile.x, projectile.y, projectile.r)) {
        t.hp--;
        t.flash = 10;
        if (t.hp <= 0) {
          t.alive = false;
          score += 100;
          explode(t.x + t.w/2, t.y + t.h/2, true);
          showMessage('+100');
        } else {
          explode(projectile.x, projectile.y, false);
          score += 25;
        }
        projectile.active = false;
        projectile = null;
        checkLevelEnd();
        return;
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Trail fade
  for (let d of trailDots) d.life -= 0.03;

  if (shakeTimer > 0) shakeTimer--;
  if (messageTimer > 0) messageTimer--;

  // Target flash
  for (let t of targets) {
    if (t.flash > 0) t.flash--;
  }
}

function checkLevelEnd() {
  const allDead = targets.every(t => !t.alive);
  if (allDead) {
    const bonus = ammo * 50;
    score += bonus;
    if (level >= levels.length - 1) {
      state = STATE.WIN;
    } else {
      state = STATE.LEVEL_CLEAR;
      message = `奖励分: +${bonus}`;
    }
  } else if (ammo <= 0 && !projectile) {
    state = STATE.GAME_OVER;
  }
}

function showMessage(msg) {
  message = msg;
  messageTimer = 60;
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(Math.random() * shakeTimer - shakeTimer/2, Math.random() * shakeTimer - shakeTimer/2);
  }

  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#16213e');
  ctx.fillStyle = grad;
  ctx.fillRect(-10, -10, W+20, H+20);

  if (state === STATE.TITLE) {
    drawTitle();
    ctx.restore();
    return;
  }

  // Ground
  ctx.fillStyle = '#2d4a2d';
  ctx.fillRect(-10, H - 20, W + 20, 25);
  ctx.fillStyle = '#3d6a3d';
  ctx.fillRect(-10, H - 20, W + 20, 4);

  // Blocks
  for (let b of blocks) {
    ctx.fillStyle = '#5a5a6e';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#7a7a9e';
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  // Targets
  for (let t of targets) {
    if (!t.alive) continue;
    ctx.fillStyle = t.flash > 0 ? '#fff' : (t.hp > 1 ? '#e74c3c' : '#e67e22');
    ctx.fillRect(t.x, t.y, t.w, t.h);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(t.x, t.y, t.w, t.h);
    // Target symbol
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(t.x + t.w/2, t.y + t.h/2, Math.min(t.w, t.h) * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = t.hp > 1 ? '#e74c3c' : '#e67e22';
    ctx.beginPath();
    ctx.arc(t.x + t.w/2, t.y + t.h/2, Math.min(t.w, t.h) * 0.12, 0, Math.PI * 2);
    ctx.fill();
  }

  // Cannon
  drawCannon();

  // Trajectory preview
  if (!projectile && ammo > 0 && state === STATE.PLAYING) {
    const pts = getTrajectoryPreview();
    for (let i = 0; i < pts.length; i++) {
      ctx.globalAlpha = 1 - i / pts.length;
      ctx.fillStyle = '#ffff88';
      ctx.beginPath();
      ctx.arc(pts[i].x, pts[i].y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Trail
  for (let d of trailDots) {
    if (d.life <= 0) continue;
    ctx.globalAlpha = d.life * 0.5;
    ctx.fillStyle = '#ffaa44';
    ctx.beginPath();
    ctx.arc(d.x, d.y, 3 * d.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Projectile
  if (projectile && projectile.active) {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(projectile.x, projectile.y, projectile.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.arc(projectile.x - 2, projectile.y - 2, projectile.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD
  drawHUD();

  // Message
  if (messageTimer > 0) {
    ctx.globalAlpha = messageTimer / 60;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(message, W/2, H/2 - 50);
    ctx.globalAlpha = 1;
  }

  // Overlays
  if (state === STATE.LEVEL_CLEAR) drawOverlay('关卡通过!', '按 空格键 进入下一关', '#4ecdc4');
  if (state === STATE.GAME_OVER) drawOverlay('游戏结束', `最终得分: ${score}  按 R 重新开始`, '#e74c3c');
  if (state === STATE.WIN) drawOverlay('恭喜通关!', `总得分: ${score}  按 R 重新开始`, '#ffd700');

  ctx.restore();
}

function drawCannon() {
  const rad = -angle * Math.PI / 180;
  // Base
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.arc(cannon.x, cannon.y, 18, 0, Math.PI * 2);
  ctx.fill();
  // Barrel
  ctx.save();
  ctx.translate(cannon.x, cannon.y);
  ctx.rotate(rad);
  ctx.fillStyle = '#666';
  ctx.fillRect(0, -6, 40, 12);
  ctx.fillStyle = '#888';
  ctx.fillRect(35, -8, 8, 16);
  ctx.restore();
  // Wheel
  ctx.fillStyle = '#553';
  ctx.beginPath();
  ctx.arc(cannon.x, cannon.y + 10, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#775';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cannon.x, cannon.y + 10, 12, 0, Math.PI * 2);
  ctx.stroke();
}

function drawHUD() {
  ctx.textAlign = 'left';
  ctx.font = '16px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(`关卡: ${level + 1}/${levels.length}`, 15, 25);
  ctx.fillText(`得分: ${score}`, 15, 48);

  // Ammo
  ctx.fillText('弹药: ', 15, 71);
  for (let i = 0; i < ammo; i++) {
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(70 + i * 20, 66, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(70 + i * 20, 66, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Wind indicator
  ctx.fillStyle = '#aaf';
  ctx.textAlign = 'center';
  if (wind !== 0) {
    const windStr = wind > 0 ? '→'.repeat(Math.min(5, Math.ceil(Math.abs(wind)*50))) : '←'.repeat(Math.min(5, Math.ceil(Math.abs(wind)*50)));
    ctx.fillText(`风力: ${windStr}`, W/2, 25);
  } else {
    ctx.fillText('风力: 无', W/2, 25);
  }

  // Angle and power
  ctx.textAlign = 'right';
  ctx.fillStyle = '#8f8';
  ctx.fillText(`角度: ${angle.toFixed(0)}°`, W - 15, 25);
  ctx.fillText(`力度: ${power.toFixed(0)}%`, W - 15, 48);

  // Power bar
  ctx.fillStyle = '#333';
  ctx.fillRect(W - 160, 55, 145, 14);
  const pColor = power < 40 ? '#4ecdc4' : power < 70 ? '#f9ca24' : '#e74c3c';
  ctx.fillStyle = pColor;
  ctx.fillRect(W - 160, 55, 145 * (power / MAX_POWER), 14);
  ctx.strokeStyle = '#666';
  ctx.strokeRect(W - 160, 55, 145, 14);

  // Targets remaining
  const remaining = targets.filter(t => t.alive).length;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f88';
  ctx.fillText(`目标剩余: ${remaining}`, W/2, 48);
}

function drawTitle() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('炮弹轨迹', W/2, H/2 - 80);

  ctx.font = '20px Arial';
  ctx.fillStyle = '#aaa';
  ctx.fillText('调整角度和力度，摧毁所有目标!', W/2, H/2 - 30);

  ctx.font = '16px Arial';
  ctx.fillStyle = '#8f8';
  ctx.fillText('↑/↓ - 调整角度    ←/→ - 调整力度', W/2, H/2 + 20);
  ctx.fillText('空格 - 蓄力发射 (按住蓄力，松开发射)', W/2, H/2 + 50);
  ctx.fillText('F - 直接发射', W/2, H/2 + 80);

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('按 空格键 开始游戏', W/2, H/2 + 130);

  // Decorative cannon
  ctx.save();
  ctx.translate(W/2 - 150, H/2 + 160);
  ctx.fillStyle = '#666';
  ctx.fillRect(0, -5, 35, 10);
  ctx.fillStyle = '#444';
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = color;
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(title, W/2, H/2 - 20);
  ctx.fillStyle = '#ddd';
  ctx.font = '20px Arial';
  ctx.fillText(sub, W/2, H/2 + 30);
}

// Input handling
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;

  if (state === STATE.TITLE) {
    if (e.code === 'Space') {
      e.preventDefault();
      state = STATE.PLAYING;
      level = 0;
      score = 0;
      loadLevel(0);
    }
    return;
  }

  if (state === STATE.LEVEL_CLEAR) {
    if (e.code === 'Space') {
      e.preventDefault();
      level++;
      loadLevel(level);
      state = STATE.PLAYING;
    }
    return;
  }

  if (state === STATE.GAME_OVER || state === STATE.WIN) {
    if (e.code === 'KeyR') {
      state = STATE.PLAYING;
      level = 0;
      score = 0;
      loadLevel(0);
    }
    return;
  }

  if (state === STATE.PLAYING) {
    if (e.code === 'Space' && !charging && !projectile && ammo > 0) {
      e.preventDefault();
      charging = true;
      chargeDir = 1;
      power = 10;
    }
    if (e.code === 'KeyF' && !projectile && ammo > 0) {
      fire();
    }
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;

  if (state === STATE.PLAYING && e.code === 'Space' && charging) {
    e.preventDefault();
    charging = false;
    fire();
  }
});

function handleContinuousInput() {
  if (state !== STATE.PLAYING || charging) return;
  if (keys['ArrowUp']) angle = Math.min(85, angle + 0.8);
  if (keys['ArrowDown']) angle = Math.max(5, angle - 0.8);
  if (keys['ArrowRight']) power = Math.min(MAX_POWER, power + 0.8);
  if (keys['ArrowLeft']) power = Math.max(10, power - 0.8);
}

// Game loop
function gameLoop() {
  handleContinuousInput();
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
