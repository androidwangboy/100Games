<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>投篮 Basketball</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 800, H = 480;
let score = 0;
const GRAV = 0.35, FLOOR = H - 30;

let state = 'start';
let ballsLeft = 10;
let ball = null;        // active flying ball
let aiming = false;
let aimStart = null, aimCur = null;
let hoop = { x: 600, y: 200, w: 70 };
let scored = false;     // whether current shot already counted
let particles = [];
let msg = '', msgT = 0;
const shootPos = { x: 120, y: FLOOR - 20 };

function resetBall() {
  ball = { x: shootPos.x, y: shootPos.y, vx: 0, vy: 0, r: 14, flying: false };
  scored = false;
}
function newHoop() {
  hoop.x = 380 + Math.random() * 320;
  hoop.y = 130 + Math.random() * 160;
}
function startGame() {
  score = 0; ballsLeft = 10; newHoop(); resetBall(); state = 'play';
}

function shoot(power, ang) {
  ball.vx = Math.cos(ang) * power;
  ball.vy = Math.sin(ang) * power;
  ball.flying = true;
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 40, color
    });
  }
}

function update() {
  if (state !== 'play') return;
  if (ball.flying) {
    ball.vy += GRAV;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // score check: ball passing down through hoop plane
    const rimL = hoop.x, rimR = hoop.x + hoop.w;
    if (!scored && ball.vy > 0 &&
        ball.y > hoop.y - 5 && ball.y < hoop.y + 18 &&
        ball.x > rimL + 8 && ball.x < rimR - 8) {
      scored = true; score++;
      msg = '进球! +1'; msgT = 70;
      spawnParticles(ball.x, hoop.y, '#ffd54a');
    }

    // rim bounce (simple)
    [rimL, rimR].forEach(rx => {
      const dx = ball.x - rx, dy = ball.y - hoop.y;
      const d = Math.hypot(dx, dy);
      if (d < ball.r + 4) {
        const nx = dx / d, ny = dy / d;
        const dot = ball.vx * nx + ball.vy * ny;
        ball.vx -= 1.5 * dot * nx; ball.vy -= 1.5 * dot * ny;
        ball.vx *= 0.7; ball.vy *= 0.7;
        ball.x = rx + nx * (ball.r + 4);
        ball.y = hoop.y + ny * (ball.r + 4);
      }
    });

    // floor / walls / out
    if (ball.y > FLOOR - ball.r) {
      ball.y = FLOOR - ball.r; ball.vy *= -0.5; ball.vx *= 0.7;
      if (Math.abs(ball.vy) < 1.5) endShot();
    }
    if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.6; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -0.6; }
    if (ball.y > H + 50) endShot();
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
  particles = particles.filter(p => p.life > 0);
  if (msgT > 0) msgT--;
}

function endShot() {
  ballsLeft--;
  if (ballsLeft <= 0) { state = 'over'; return; }
  if (scored) newHoop();
  resetBall();
}

function drawHoop() {
  // backboard
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(hoop.x + hoop.w - 4, hoop.y - 60, 8, 80);
  ctx.strokeStyle = '#ff5533'; ctx.lineWidth = 3;
  ctx.strokeRect(hoop.x + hoop.w - 30, hoop.y - 50, 26, 34);
  // pole
  ctx.fillStyle = '#666';
  ctx.fillRect(hoop.x + hoop.w + 2, hoop.y - 60, 6, FLOOR - hoop.y + 60);
  // rim
  ctx.strokeStyle = '#ff7733'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(hoop.x, hoop.y); ctx.lineTo(hoop.x + hoop.w, hoop.y); ctx.stroke();
  // net
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const nx = hoop.x + (hoop.w * i / 5);
    ctx.beginPath();
    ctx.moveTo(nx, hoop.y);
    ctx.lineTo(hoop.x + hoop.w / 2 + (nx - hoop.x - hoop.w / 2) * 0.4, hoop.y + 32);
    ctx.stroke();
  }
}

function drawBall(b) {
  ctx.fillStyle = '#ff8833';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a3300'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x - b.r, b.y); ctx.lineTo(b.x + b.r, b.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x, b.y - b.r); ctx.lineTo(b.x, b.y + b.r); ctx.stroke();
}

function draw() {
  // background gradient court
  ctx.fillStyle = '#1a1a2a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2a2a3a'; ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.strokeStyle = '#444'; ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();

  if (state === 'start') {
    ctx.fillStyle = '#ff8833'; ctx.font = 'bold 54px Arial'; ctx.textAlign = 'center';
    ctx.fillText('投 篮 BASKETBALL', W / 2, 150);
    ctx.fillStyle = '#ccc'; ctx.font = '20px Arial';
    ctx.fillText('按住篮球拖动瞄准，松开投篮', W / 2, 200);
    ctx.fillText('拖得越远力量越大 · 共 10 个球', W / 2, 235);
    ctx.fillStyle = '#4caf50'; ctx.fillRect(W / 2 - 100, 290, 200, 60);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Arial';
    ctx.fillText('开始游戏', W / 2, 330);
    ctx.fillStyle = '#777'; ctx.font = '14px Arial';
    ctx.fillText('按 ESC 退出', W / 2, 420);
    return;
  }

  drawHoop();

  if (state === 'play') {
    drawBall(ball);
    // aim trajectory preview
    if (aiming && aimStart && aimCur) {
      const dx = aimStart.x - aimCur.x, dy = aimStart.y - aimCur.y;
      const power = Math.min(Math.hypot(dx, dy) * 0.18, 22);
      const ang = Math.atan2(dy, dx);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      let px = ball.x, py = ball.y, pvx = Math.cos(ang) * power, pvy = Math.sin(ang) * power;
      for (let i = 0; i < 30; i++) {
        pvy += GRAV; px += pvx; py += pvy;
        if (i % 2 === 0) { ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill(); }
        if (py > FLOOR) break;
      }
      // power bar
      ctx.fillStyle = '#333'; ctx.fillRect(20, H - 20, 200, 10);
      ctx.fillStyle = '#ff5533'; ctx.fillRect(20, H - 20, 200 * (power / 22), 10);
    }
  }

  particles.forEach(p => {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left'; ctx.font = 'bold 24px Arial';
  ctx.fillStyle = '#ffd54a'; ctx.fillText('进球: ' + score, 20, 35);
  ctx.textAlign = 'right'; ctx.fillStyle = '#7ec8ff';
  ctx.fillText('剩余球: ' + ballsLeft, W - 20, 35);

  if (msgT > 0) {
    ctx.fillStyle = '#4caf50'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, msgT / 25);
    ctx.fillText(msg, W / 2, 100);
    ctx.globalAlpha = 1;
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd54a'; ctx.font = 'bold 50px Arial'; ctx.textAlign = 'center';
    ctx.fillText('比赛结束!', W / 2, 170);
    ctx.fillStyle = '#fff'; ctx.font = '30px Arial';
    ctx.fillText('命中: ' + score + ' / 10', W / 2, 230);
    ctx.fillStyle = '#4caf50'; ctx.fillRect(W / 2 - 100, 290, 200, 60);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px Arial';
    ctx.fillText('再来一次', W / 2, 328);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function getPos(e) {
  const rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}

cv.addEventListener('mousedown', e => {
  const p = getPos(e);
  if (state === 'start') {
    if (p.x > W / 2 - 100 && p.x < W / 2 + 100 && p.y > 290 && p.y < 350) startGame();
    return;
  }
  if (state === 'over') {
    if (p.x > W / 2 - 100 && p.x < W / 2 + 100 && p.y > 290 && p.y < 350) startGame();
    return;
  }
  if (state === 'play' && !ball.flying) {
    aiming = true; aimStart = p; aimCur = p;
  }
});
cv.addEventListener('mousemove', e => { if (aiming) aimCur = getPos(e); });
cv.addEventListener('mouseup', e => {
  if (!aiming) return;
  aiming = false;
  const p = getPos(e);
  const dx = aimStart.x - p.x, dy = aimStart.y - p.y;
  const power = Math.min(Math.hypot(dx, dy) * 0.18, 22);
  if (power > 1.5) shoot(power, Math.atan2(dy, dx));
  aimStart = aimCur = null;
});

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); return; }
  if ((state === 'start' || state === 'over') && e.code === 'Enter') startGame();
});

loop();
</script>
</body>
</html>
