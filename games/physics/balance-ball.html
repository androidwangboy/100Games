<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>平衡球</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

const STATE = { TITLE: 0, PLAYING: 1, DEAD: 2, LEVEL_CLEAR: 3, WIN: 4 };
let state = STATE.TITLE;
let score = 0;
let level = 0;
let timer = 0;
let platformAngle = 0;
let targetAngle = 0;
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10, onGround: false };
let particles = [];
let deathTimer = 0;
let cameraX = 0;

const GRAVITY = 0.4;
const FRICTION = 0.985;
const MAX_ANGLE = 0.35;
const ANGLE_SPEED = 0.025;
const BALL_ACCEL = 0.35;
const BOUNCE = 0.3;

// Level definitions: platforms are segments with gaps
const levels = [
  {
    name: '初级平衡',
    startX: 60, startY: 200,
    goalX: 700, goalY: 200,
    platforms: [
      {x: 20, y: 250, w: 200},
      {x: 260, y: 250, w: 150},
      {x: 450, y: 250, w: 120},
      {x: 610, y: 250, w: 180}
    ],
    obstacles: [
      {x: 320, y: 220, w: 20, h: 30}
    ],
    timeLimit: 30
  },
  {
    name: '起伏之路',
    startX: 60, startY: 150,
    goalX: 740, goalY: 280,
    platforms: [
      {x: 20, y: 200, w: 150},
      {x: 210, y: 240, w: 120},
      {x: 370, y: 200, w: 100},
      {x: 510, y: 280, w: 130},
      {x: 680, y: 320, w: 110}
    ],
    obstacles: [
      {x: 250, y: 210, w: 15, h: 30},
      {x: 540, y: 250, w: 15, h: 30}
    ],
    timeLimit: 35
  },
  {
    name: '危险间隙',
    startX: 50, startY: 150,
    goalX: 750, goalY: 180,
    platforms: [
      {x: 10, y: 200, w: 120},
      {x: 180, y: 220, w: 80},
      {x: 320, y: 190, w: 90},
      {x: 460, y: 230, w: 70},
      {x: 580, y: 200, w: 80},
      {x: 710, y: 220, w: 80}
    ],
    obstacles: [
      {x: 200, y: 190, w: 15, h: 30},
      {x: 480, y: 200, w: 15, h: 30},
      {x: 600, y: 170, w: 15, h: 30}
    ],
    timeLimit: 40
  },
  {
    name: '螺旋阶梯',
    startX: 50, startY: 100,
    goalX: 730, goalY: 350,
    platforms: [
      {x: 10, y: 150, w: 130},
      {x: 180, y: 190, w: 100},
      {x: 320, y: 230, w: 110},
      {x: 200, y: 290, w: 100},
      {x: 380, y: 320, w: 90},
      {x: 530, y: 290, w: 100},
      {x: 680, y: 380, w: 110}
    ],
    obstacles: [
      {x: 220, y: 160, w: 15, h: 30},
      {x: 350, y: 200, w: 15, h: 30},
      {x: 560, y: 260, w: 15, h: 30}
    ],
    timeLimit: 45
  },
  {
    name: '终极挑战',
    startX: 50, startY: 100,
    goalX: 750, goalY: 300,
    platforms: [
      {x: 10, y: 150, w: 100},
      {x: 160, y: 180, w: 70},
      {x: 290, y: 150, w: 80},
      {x: 420, y: 200, w: 60},
      {x: 530, y: 170, w: 70},
      {x: 640, y: 220, w: 60},
      {x: 720, y: 340, w: 70}
    ],
    obstacles: [
      {x: 180, y: 150, w: 12, h: 30},
      {x: 310, y: 120, w: 12, h: 30},
      {x: 440, y: 170, w: 12, h: 30},
      {x: 550, y: 140, w: 12, h: 30},
      {x: 660, y: 190, w: 12, h: 30}
    ],
    timeLimit: 50
  }
];

function loadLevel(idx) {
  const lv = levels[idx];
  ball.x = lv.startX;
  ball.y = lv.startY;
  ball.vx = 0;
  ball.vy = 0;
  ball.onGround = false;
  platformAngle = 0;
  targetAngle = 0;
  timer = lv.timeLimit;
  particles = [];
  deathTimer = 0;
  cameraX = 0;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 2,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      color,
      size: Math.random() * 4 + 2
    });
  }
}

function update(dt) {
  if (state !== STATE.PLAYING) return;

  // Timer
  timer -= dt;
  if (timer <= 0) {
    timer = 0;
    killBall();
    return;
  }

  // Platform tilt
  if (keys['ArrowLeft']) targetAngle = -MAX_ANGLE;
  else if (keys['ArrowRight']) targetAngle = MAX_ANGLE;
  else targetAngle = 0;

  platformAngle += (targetAngle - platformAngle) * 0.08;

  // Ball physics
  ball.vy += GRAVITY;
  ball.vx += Math.sin(platformAngle) * BALL_ACCEL;
  ball.vx *= FRICTION;
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.onGround = false;

  const lv = levels[level];

  // Platform collision
  for (let p of lv.platforms) {
    const px = p.x - cameraX;
    if (ball.x + ball.r > px && ball.x - ball.r < px + p.w) {
      // Top surface
      if (ball.y + ball.r > p.y && ball.y + ball.r < p.y + 20 && ball.vy >= 0) {
        ball.y = p.y - ball.r;
        ball.vy = -ball.vy * BOUNCE;
        if (Math.abs(ball.vy) < 1) ball.vy = 0;
        ball.onGround = true;
        // Rolling friction on ground
        ball.vx *= 0.98;
      }
    }
  }

  // Obstacle collision
  for (let o of lv.obstacles) {
    const ox = o.x - cameraX;
    if (ball.x + ball.r > ox && ball.x - ball.r < ox + o.w &&
        ball.y + ball.r > o.y && ball.y - ball.r < o.y + o.h) {
      // Push ball away
      const cx = ox + o.w / 2;
      if (ball.x < cx) {
        ball.x = ox - ball.r;
        ball.vx = -Math.abs(ball.vx) * 0.5 - 1;
      } else {
        ball.x = ox + o.w + ball.r;
        ball.vx = Math.abs(ball.vx) * 0.5 + 1;
      }
      spawnParticles(ball.x, ball.y, '#ff8844', 5);
    }
  }

  // Fall death
  if (ball.y > H + 50) {
    killBall();
    return;
  }

  // Goal check
  const gx = lv.goalX - cameraX;
  if (Math.abs(ball.x - gx) < 25 && Math.abs(ball.y - lv.goalY) < 40) {
    const timeBonus = Math.floor(timer * 10);
    score += 100 + timeBonus;
    spawnParticles(ball.x, ball.y, '#4ecdc4', 20);
    if (level >= levels.length - 1) {
      state = STATE.WIN;
    } else {
      state = STATE.LEVEL_CLEAR;
    }
  }

  // Camera follow (smooth)
  const targetCam = Math.max(0, ball.x - W * 0.35);
  // For simplicity, levels fit in one screen mostly
  cameraX = 0;

  // Particles
  updateParticles();
}

function killBall() {
  spawnParticles(ball.x, ball.y, '#e74c3c', 25);
  state = STATE.DEAD;
  deathTimer = 90;
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 50; i++) {
    const sx = (i * 137.5 + 50) % W;
    const sy = (i * 73.3 + 20) % (H * 0.6);
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  if (state === STATE.TITLE) {
    drawTitle();
    return;
  }

  const lv = levels[level];

  // Draw platforms with tilt visualization
  ctx.save();
  for (let p of lv.platforms) {
    const px = p.x - cameraX;
    // Platform body
    ctx.fillStyle = '#3a5a8a';
    ctx.fillRect(px, p.y, p.w, 12);
    // Top surface
    ctx.fillStyle = '#5a8aba';
    ctx.fillRect(px, p.y, p.w, 4);
    // Edge markers
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(px, p.y, 3, 12);
    ctx.fillRect(px + p.w - 3, p.y, 3, 12);
  }

  // Draw obstacles
  for (let o of lv.obstacles) {
    const ox = o.x - cameraX;
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(ox, o.y, o.w, o.h);
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(ox + 2, o.y + 2, o.w - 4, o.h - 4);
    // Warning stripes
    ctx.fillStyle = '#f39c12';
    for (let s = 0; s < o.h; s += 8) {
      ctx.fillRect(ox, o.y + s, o.w, 3);
    }
  }

  // Draw goal
  const gx = lv.goalX - cameraX;
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(gx - 3, lv.goalY - 40, 6, 50);
  // Flag
  ctx.fillStyle = '#27ae60';
  ctx.beginPath();
  ctx.moveTo(gx + 3, lv.goalY - 40);
  ctx.lineTo(gx + 28, lv.goalY - 30);
  ctx.lineTo(gx + 3, lv.goalY - 20);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '10px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('终点', gx + 14, lv.goalY - 28);

  // Draw ball
  if (state === STATE.PLAYING || state === STATE.LEVEL_CLEAR) {
    // Ball shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(ball.x, ball.y + ball.r + 3, ball.r * 0.8, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ball
    const ballGrad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r);
    ballGrad.addColorStop(0, '#ffd700');
    ballGrad.addColorStop(1, '#ff8c00');
    ctx.fillStyle = ballGrad;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#cc7000';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(ball.x - 3, ball.y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Tilt indicator
  drawTiltIndicator();

  // HUD
  drawHUD(lv);

  // Overlays
  if (state === STATE.DEAD) {
    if (deathTimer > 0) deathTimer--;
    drawOverlay('球掉落了!', '按 R 重试本关', '#e74c3c');
  }
  if (state === STATE.LEVEL_CLEAR) {
    drawOverlay('关卡通过!', `时间奖励: +${Math.floor(timer * 10)}  按 空格 下一关`, '#4ecdc4');
  }
  if (state === STATE.WIN) {
    drawOverlay('恭喜通关!', `总得分: ${score}  按 R 重新开始`, '#ffd700');
  }
}

function drawTiltIndicator() {
  const cx = W / 2, cy = H - 30;
  ctx.save();
  ctx.translate(cx, cy);

  // Background arc
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, 0, 25, Math.PI + 0.3, -0.3);
  ctx.stroke();

  // Platform line
  ctx.rotate(platformAngle);
  ctx.strokeStyle = '#5a8aba';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  ctx.lineTo(20, 0);
  ctx.stroke();

  // Ball on indicator
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(ball.vx * 3, -6, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = '#888';
  ctx.font = '11px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('平台倾斜', cx, cy + 20);
}

function drawHUD(lv) {
  ctx.textAlign = 'left';
  ctx.font = '16px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(`关卡 ${level + 1}: ${lv.name}`, 15, 25);
  ctx.fillText(`得分: ${score}`, 15, 48);

  // Timer
  const timeColor = timer < 10 ? '#e74c3c' : timer < 20 ? '#f39c12' : '#2ecc71';
  ctx.fillStyle = timeColor;
  ctx.textAlign = 'right';
  ctx.font = 'bold 20px Arial';
  ctx.fillText(`⏱ ${timer.toFixed(1)}s`, W - 15, 28);

  // Timer bar
  ctx.fillStyle = '#333';
  ctx.fillRect(W - 165, 35, 150, 8);
  ctx.fillStyle = timeColor;
  ctx.fillRect(W - 165, 35, 150 * (timer / lv.timeLimit), 8);

  // Speed indicator
  ctx.textAlign = 'center';
  ctx.font = '12px Arial';
  ctx.fillStyle = '#aaa';
  const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy).toFixed(1);
  ctx.fillText(`速度: ${speed}`, W / 2, 20);
}

function drawTitle() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('平衡球', W / 2, H / 2 - 90);

  ctx.font = '20px Arial';
  ctx.fillStyle = '#aaa';
  ctx.fillText('倾斜平台，引导小球到达终点!', W / 2, H / 2 - 40);

  ctx.font = '16px Arial';
  ctx.fillStyle = '#8f8';
  ctx.fillText('← / → - 倾斜平台', W / 2, H / 2 + 10);
  ctx.fillText('小心间隙，不要掉下去!', W / 2, H / 2 + 40);
  ctx.fillText('用时越短，奖励分越高', W / 2, H / 2 + 70);

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('按 空格键 开始游戏', W / 2, H / 2 + 120);

  // Animated ball
  const t = Date.now() / 500;
  const bx = W / 2 + Math.sin(t) * 60;
  const by = H / 2 + 160 + Math.sin(t * 2) * 5;
  const g = ctx.createRadialGradient(bx - 2, by - 2, 1, bx, by, 12);
  g.addColorStop(0, '#ffd700');
  g.addColorStop(1, '#ff8c00');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(bx, by, 12, 0, Math.PI * 2);
  ctx.fill();
}

function drawOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = color;
  ctx.font = 'bold 40px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, H / 2 - 20);
  ctx.fillStyle = '#ddd';
  ctx.font = '20px Arial';
  ctx.fillText(sub, W / 2, H / 2 + 25);
}

// Input
const keys = {};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
  keys[e.code] = true;

  if (state === STATE.TITLE && e.code === 'Space') {
    e.preventDefault();
    state = STATE.PLAYING;
    level = 0;
    score = 0;
    loadLevel(0);
  }
  if (state === STATE.DEAD && e.code === 'KeyR') {
    state = STATE.PLAYING;
    loadLevel(level);
  }
  if (state === STATE.LEVEL_CLEAR && e.code === 'Space') {
    e.preventDefault();
    level++;
    loadLevel(level);
    state = STATE.PLAYING;
  }
  if (state === STATE.WIN && e.code === 'KeyR') {
    state = STATE.PLAYING;
    level = 0;
    score = 0;
    loadLevel(0);
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  updateParticles();
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
