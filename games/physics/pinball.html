<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弹球台 - Pinball</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
'use strict';

// ============================================================
// 弹球台 - Pinball
// 物理引擎: 重力 / 反弹恢复系数 / 旋转挡板 / 圆形碰撞
// 操作: Z=左挡板  /=右挡板  空格=蓄力发射
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ---------- 物理常量 ----------
const GRAVITY = 0.22;
const WALL_RESTITUTION = 0.72;   // 墙壁弹性
const BUMPER_RESTITUTION = 1.5;  // 缓冲器弹性 (主动弹射)
const SLING_RESTITUTION = 1.7;   // 弹射器
const FRICTION = 0.999;
const BALL_RADIUS = 8;
const MAX_BALL_SPEED = 16;

// ---------- 球台布局 ----------
// 球台是一个有边界的区域, 右侧有发射通道
const TABLE = {
  left: 30,
  right: 720,
  top: 30,
  bottom: H - 10,
  launchLaneX: 745,   // 发射通道中心X
  launchLaneW: 36
};

// ---------- 游戏状态 ----------
let score = 0;
let ballsLeft = 3;
let gameState = 'ready';   // ready / charging / playing / draining / gameover
let multiplier = 1;
let tiltWarning = 0;
let tiltShakes = 0;
let message = '';
let messageTimer = 0;
let frame = 0;

// ---------- 球 ----------
let balls = [];

class Ball {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.r = BALL_RADIUS;
    this.active = true;
    this.inLane = true;   // 在发射通道中
    this.trail = [];
  }
  update() {
    this.vy += GRAVITY;
    this.vx *= FRICTION;
    this.vy *= FRICTION;
    // 限速
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > MAX_BALL_SPEED) {
      this.vx = this.vx / sp * MAX_BALL_SPEED;
      this.vy = this.vy / sp * MAX_BALL_SPEED;
    }
    this.x += this.vx;
    this.y += this.vy;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 8) this.trail.shift();
  }
  draw() {
    // 拖尾
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      ctx.globalAlpha = i / this.trail.length * 0.4;
      ctx.fillStyle = '#c0c0c0';
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.r * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 球体 (金属质感)
    const grad = ctx.createRadialGradient(this.x - 3, this.y - 3, 1, this.x, this.y, this.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#d0d0d8');
    grad.addColorStop(1, '#707080');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#404048';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ---------- 挡板 (Flipper) ----------
class Flipper {
  constructor(x, y, side) {
    this.x = x; this.y = y;
    this.side = side;        // 'left' or 'right'
    this.length = 70;
    this.width = 14;
    this.restAngle = side === 'left' ? 0.5 : Math.PI - 0.5;   // 静止角度
    this.activeAngle = side === 'left' ? -0.6 : Math.PI + 0.6; // 激活角度
    this.angle = this.restAngle;
    this.active = false;
    this.angularVel = 0;
    this.prevTip = this.getTip();
  }
  getTip() {
    return {
      x: this.x + Math.cos(this.angle) * this.length,
      y: this.y + Math.sin(this.angle) * this.length
    };
  }
  update() {
    const target = this.active ? this.activeAngle : this.restAngle;
    const prev = this.angle;
    const diff = target - this.angle;
    this.angle += diff * 0.4;   // 快速旋转动画
    this.angularVel = this.angle - prev;
    this.prevTip = this.getTip();
  }
  // 碰撞: 球与挡板线段
  collide(ball) {
    const tip = this.getTip();
    // 线段最近点
    const dx = tip.x - this.x;
    const dy = tip.y - this.y;
    const len2 = dx * dx + dy * dy;
    let t = ((ball.x - this.x) * dx + (ball.y - this.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const closestX = this.x + dx * t;
    const closestY = this.y + dy * t;
    const distX = ball.x - closestX;
    const distY = ball.y - closestY;
    const dist = Math.hypot(distX, distY);
    const minDist = ball.r + this.width / 2;
    if (dist < minDist && dist > 0) {
      const nx = distX / dist;
      const ny = distY / dist;
      // 推出
      const overlap = minDist - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      // 反射速度
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx -= 2 * dot * nx;
      ball.vy -= 2 * dot * ny;
      ball.vx *= 0.6;
      ball.vy *= 0.6;
      // 挡板激活时施加额外力量
      if (this.active && Math.abs(this.angularVel) > 0.02) {
        const power = this.side === 'left' ? 11 : 11;
        // 沿挡板法线方向弹射, 越靠近末端力量越大
        const tipFactor = 0.5 + t * 0.9;
        ball.vx += nx * power * tipFactor;
        ball.vy += ny * power * tipFactor - 3 * tipFactor;
      }
      return true;
    }
    return false;
  }
  draw() {
    const tip = this.getTip();
    ctx.save();
    ctx.lineCap = 'round';
    // 阴影
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = this.width + 4;
    ctx.beginPath();
    ctx.moveTo(this.x + 2, this.y + 2);
    ctx.lineTo(tip.x + 2, tip.y + 2);
    ctx.stroke();
    // 主体
    const grad = ctx.createLinearGradient(this.x, this.y, tip.x, tip.y);
    grad.addColorStop(0, this.active ? '#ff6b6b' : '#e74c3c');
    grad.addColorStop(1, this.active ? '#ff9f43' : '#c0392b');
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.width;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    // 高光
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();
    // 轴心
    ctx.fillStyle = '#7f8c8d';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }
}

// ---------- 圆形缓冲器 (Bumper) ----------
class Bumper {
  constructor(x, y, r, color) {
    this.x = x; this.y = y;
    this.r = r;
    this.color = color;
    this.flash = 0;
    this.pulse = 0;
  }
  collide(ball) {
    const d = Math.hypot(ball.x - this.x, ball.y - this.y);
    if (d < this.r + ball.r && d > 0) {
      const nx = (ball.x - this.x) / d;
      const ny = (ball.y - this.y) / d;
      const overlap = this.r + ball.r - d;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const speed = Math.hypot(ball.vx, ball.vy);
      const newSpeed = Math.max(speed, 6) * BUMPER_RESTITUTION * 0.7;
      ball.vx = nx * newSpeed;
      ball.vy = ny * newSpeed;
      this.flash = 12;
      this.pulse = 1;
      addScore(100, this.x, this.y);
      return true;
    }
    return false;
  }
  update() {
    if (this.flash > 0) this.flash--;
    this.pulse *= 0.85;
  }
  draw() {
    const r = this.r + this.pulse * 6;
    // 外圈光晕
    if (this.flash > 0) {
      ctx.globalAlpha = this.flash / 12 * 0.5;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r + 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 底座
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath();
    ctx.arc(this.x, this.y, r + 4, 0, Math.PI * 2);
    ctx.fill();
    // 主体
    const grad = ctx.createRadialGradient(this.x - r * 0.3, this.y - r * 0.3, 2, this.x, this.y, r);
    grad.addColorStop(0, this.flash > 0 ? '#fff' : this.color);
    grad.addColorStop(1, this.color);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 中心
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, r * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- 弹射器 (Slingshot) - 三角形 ----------
class Slingshot {
  constructor(points, side) {
    this.points = points;   // [{x,y}, {x,y}, {x,y}]
    this.side = side;
    this.flash = 0;
  }
  collide(ball) {
    // 检测球与三角形每条边
    for (let i = 0; i < this.points.length; i++) {
      const a = this.points[i];
      const b = this.points[(i + 1) % this.points.length];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len2 = dx * dx + dy * dy;
      let t = ((ball.x - a.x) * dx + (ball.y - a.y) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = a.x + dx * t;
      const cy = a.y + dy * t;
      const distX = ball.x - cx;
      const distY = ball.y - cy;
      const dist = Math.hypot(distX, distY);
      if (dist < ball.r + 3 && dist > 0) {
        const nx = distX / dist;
        const ny = distY / dist;
        ball.x += nx * (ball.r + 3 - dist);
        ball.y += ny * (ball.r + 3 - dist);
        const power = 9;
        ball.vx = nx * power;
        ball.vy = ny * power;
        this.flash = 10;
        addScore(50, cx, cy);
        return true;
      }
    }
    return false;
  }
  update() { if (this.flash > 0) this.flash--; }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.points[0].x, this.points[0].y);
    for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i].x, this.points[i].y);
    ctx.closePath();
    ctx.fillStyle = this.flash > 0 ? '#f39c12' : '#8e44ad';
    ctx.fill();
    ctx.strokeStyle = this.flash > 0 ? '#fff' : '#9b59b6';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

// ---------- 掉落目标 (Drop Target) ----------
class DropTarget {
  constructor(x, y, w, h) {
    this.x = x; this.y = y;
    this.w = w; this.h = h;
    this.down = false;
    this.flash = 0;
    this.respawnTimer = 0;
  }
  collide(ball) {
    if (this.down) return false;
    const cx = Math.max(this.x, Math.min(ball.x, this.x + this.w));
    const cy = Math.max(this.y, Math.min(ball.y, this.y + this.h));
    const d = Math.hypot(ball.x - cx, ball.y - cy);
    if (d < ball.r) {
      // 反弹
      ball.vy = -Math.abs(ball.vy) * 0.5 - 2;
      ball.vx *= 0.8;
      this.down = true;
      this.flash = 15;
      this.respawnTimer = 300;
      addScore(500, this.x + this.w / 2, this.y);
      checkAllTargets();
      return true;
    }
    return false;
  }
  update() {
    if (this.flash > 0) this.flash--;
    if (this.down) {
      this.respawnTimer--;
      if (this.respawnTimer <= 0) this.down = false;
    }
  }
  draw() {
    if (this.down) {
      // 已落下 - 显示凹槽
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(this.x, this.y, this.w, this.h);
      return;
    }
    ctx.fillStyle = this.flash > 0 ? '#fff' : '#e67e22';
    ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.strokeStyle = '#f39c12';
    ctx.lineWidth = 2;
    ctx.strokeRect(this.x, this.y, this.w, this.h);
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(this.x, this.y, this.w, 3);
  }
}

// ---------- 实例化游戏元素 ----------
const flippers = [
  new Flipper(300, H - 70, 'left'),
  new Flipper(470, H - 70, 'right')
];

const bumpers = [
  new Bumper(250, 150, 26, '#e74c3c'),
  new Bumper(400, 110, 26, '#3498db'),
  new Bumper(530, 170, 26, '#2ecc71')
];

const slingshots = [
  new Slingshot([
    { x: 180, y: H - 130 },
    { x: 250, y: H - 90 },
    { x: 180, y: H - 80 }
  ], 'left'),
  new Slingshot([
    { x: 590, y: H - 130 },
    { x: 520, y: H - 90 },
    { x: 590, y: H - 80 }
  ], 'right')
];

const dropTargets = [
  new DropTarget(150, 250, 40, 12),
  new DropTarget(330, 220, 40, 12),
  new DropTarget(510, 250, 40, 12),
  new DropTarget(620, 200, 40, 12)
];

// ---------- 粒子 & 飘字 ----------
let particles = [];
let floatTexts = [];

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      r: Math.random() * 3 + 1,
      color,
      life: 30 + Math.random() * 20
    });
  }
}

function addScore(points, x, y) {
  const gained = points * multiplier;
  score += gained;
  if (x !== undefined) {
    floatTexts.push({ x, y, text: '+' + gained, color: '#f1c40f', life: 45 });
  }
}

function showMessage(msg) {
  message = msg;
  messageTimer = 120;
}

function checkAllTargets() {
  if (dropTargets.every(t => t.down)) {
    addScore(5000, W / 2, H / 2);
    showMessage('全部目标! +5000 奖励!');
    multiplier = Math.min(multiplier + 1, 5);
    spawnParticles(W / 2, H / 2, '#f1c40f', 40);
    // 重置目标
    setTimeout(() => { dropTargets.forEach(t => { t.down = false; }); }, 1000);
  }
}

// ---------- 发射器 ----------
let plungerCharge = 0;
let plungerCharging = false;

// ---------- 输入 ----------
const keys = {};
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
  if (keys[e.code]) return;
  keys[e.code] = true;
  if (e.code === 'KeyZ') flippers[0].active = true;
  if (e.code === 'Slash') { flippers[1].active = true; e.preventDefault(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameState === 'ready') {
      gameState = 'charging';
      plungerCharging = true;
    } else if (gameState === 'gameover') {
      resetGame();
    }
  }
  // 倾斜 (左右方向键) - 危险操作
  if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && gameState === 'playing') {
    tiltShakes++;
    if (tiltShakes > 5) {
      tiltWarning = 180;
      showMessage('倾斜警告! TILT!');
      // 球死亡
      balls.forEach(b => b.active = false);
    } else if (tiltShakes > 3) {
      showMessage('警告: 不要摇晃球台!');
    }
  }
});

document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'KeyZ') flippers[0].active = false;
  if (e.code === 'Slash') flippers[1].active = false;
  if (e.code === 'Space' && gameState === 'charging') {
    launchBall();
  }
});

function launchBall() {
  plungerCharging = false;
  const power = 8 + plungerCharge * 0.14;
  for (const b of balls) {
    if (b.inLane) {
      b.vy = -power;
      b.inLane = false;
    }
  }
  plungerCharge = 0;
  gameState = 'playing';
}

function resetGame() {
  score = 0;
  ballsLeft = 3;
  multiplier = 1;
  tiltShakes = 0;
  tiltWarning = 0;
  dropTargets.forEach(t => { t.down = false; });
  spawnNewBall();
  gameState = 'ready';
}

function spawnNewBall() {
  balls = [new Ball(TABLE.launchLaneX, H - 60)];
}

// ---------- 球台墙壁碰撞 ----------
function collideWalls(ball) {
  const r = ball.r;
  // 发射通道: 球在通道中时只在通道内运动
  if (ball.inLane) {
    if (ball.x - r < TABLE.launchLaneX - TABLE.launchLaneW / 2) {
      ball.x = TABLE.launchLaneX - TABLE.launchLaneW / 2 + r;
      ball.vx *= -WALL_RESTITUTION;
    }
    if (ball.x + r > TABLE.launchLaneX + TABLE.launchLaneW / 2) {
      ball.x = TABLE.launchLaneX + TABLE.launchLaneW / 2 - r;
      ball.vx *= -WALL_RESTITUTION;
    }
    if (ball.y + r > H - 30) {
      ball.y = H - 30 - r;
      ball.vy = 0;
    }
    return;
  }

  // 顶部
  if (ball.y - r < TABLE.top) {
    ball.y = TABLE.top + r;
    ball.vy *= -WALL_RESTITUTION;
  }
  // 左墙
  if (ball.x - r < TABLE.left) {
    ball.x = TABLE.left + r;
    ball.vx *= -WALL_RESTITUTION;
  }
  // 右墙 (主区域右边界, 不含发射通道)
  if (ball.x + r > TABLE.right && ball.y > 100) {
    // 检查是否进入发射通道区域上方导流
    ball.x = TABLE.right - r;
    ball.vx *= -WALL_RESTITUTION;
  }
  // 右上角弧线导流 (让球从发射通道进入主区域)
  if (ball.x > TABLE.right - r && ball.y < 120) {
    // 弧形顶部导流板
    if (ball.y - r < TABLE.top + 30) {
      ball.y = TABLE.top + 30 + r;
      ball.vy *= -WALL_RESTITUTION;
      ball.vx = -Math.abs(ball.vx) - 1;  // 导向左边
    }
  }
  // 发射通道右墙
  if (ball.x + r > TABLE.launchLaneX + TABLE.launchLaneW / 2) {
    ball.x = TABLE.launchLaneX + TABLE.launchLaneW / 2 - r;
    ball.vx *= -WALL_RESTITUTION;
  }
  // 发射通道与主区域之间的隔墙 (单向: 球从上方可进入通道, 但通道底部有弹簧)
  if (ball.x - r < TABLE.launchLaneX - TABLE.launchLaneW / 2 &&
      ball.x + r > TABLE.launchLaneX - TABLE.launchLaneW / 2 &&
      ball.y > 130) {
    // 只在球从右侧接近隔墙时阻挡
    if (ball.vx > 0 && ball.x < TABLE.launchLaneX - TABLE.launchLaneW / 2 + 5) {
      ball.x = TABLE.launchLaneX - TABLE.launchLaneW / 2 - r;
      ball.vx *= -WALL_RESTITUTION;
    }
  }

  // 底部导流斜板 (漏斗形, 引导球到挡板)
  // 左侧斜板
  const leftGuide = { x1: TABLE.left, y1: H - 160, x2: 230, y2: H - 70 };
  collideLine(ball, leftGuide);
  // 右侧斜板
  const rightGuide = { x1: TABLE.right, y1: H - 160, x2: 540, y2: H - 70 };
  collideLine(ball, rightGuide);
}

function collideLine(ball, line) {
  const dx = line.x2 - line.x1;
  const dy = line.y2 - line.y1;
  const len2 = dx * dx + dy * dy;
  let t = ((ball.x - line.x1) * dx + (ball.y - line.y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = line.x1 + dx * t;
  const cy = line.y1 + dy * t;
  const distX = ball.x - cx;
  const distY = ball.y - cy;
  const dist = Math.hypot(distX, distY);
  if (dist < ball.r + 3 && dist > 0) {
    const nx = distX / dist;
    const ny = distY / dist;
    ball.x += nx * (ball.r + 3 - dist);
    ball.y += ny * (ball.r + 3 - dist);
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx -= 2 * dot * nx * WALL_RESTITUTION;
    ball.vy -= 2 * dot * ny * WALL_RESTITUTION;
  }
}

// ---------- 排水检测 ----------
function checkDrain(ball) {
  // 球从挡板之间落下
  if (ball.y > H + 20) {
    ball.active = false;
    return true;
  }
  return false;
}

// ---------- 物理更新 ----------
function updatePhysics() {
  // 挡板
  flippers.forEach(f => f.update());

  // 蓄力
  if (gameState === 'charging' && plungerCharging) {
    plungerCharge = Math.min(plungerCharge + 1.5, 100);
  }

  // 缓冲器 & 目标
  bumpers.forEach(b => b.update());
  slingshots.forEach(s => s.update());
  dropTargets.forEach(t => t.update());

  // 球
  for (const ball of balls) {
    if (!ball.active) continue;
    ball.update();

    if (!ball.inLane) {
      collideWalls(ball);
      // 挡板
      flippers.forEach(f => f.collide(ball));
      // 缓冲器
      bumpers.forEach(b => {
        if (b.collide(ball)) spawnParticles(ball.x, ball.y, b.color, 6);
      });
      // 弹射器
      slingshots.forEach(s => {
        if (s.collide(ball)) spawnParticles(ball.x, ball.y, '#9b59b6', 5);
      });
      // 目标
      dropTargets.forEach(t => t.collide(ball));
    } else {
      collideWalls(ball);
    }

    // 排水
    if (checkDrain(ball)) {
      onBallDrained();
    }
  }

  balls = balls.filter(b => b.active);

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.y -= 0.8;
    f.life--;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }

  if (messageTimer > 0) messageTimer--;
  if (tiltWarning > 0) tiltWarning--;
  if (tiltWarning === 0 && tiltShakes > 0 && frame % 60 === 0) tiltShakes--;
}

function onBallDrained() {
  ballsLeft--;
  multiplier = 1;
  spawnParticles(TABLE.launchLaneX, H - 40, '#e74c3c', 15);
  if (ballsLeft <= 0) {
    gameState = 'gameover';
    showMessage('游戏结束!');
  } else {
    showMessage('失去一球! 剩余: ' + ballsLeft);
    setTimeout(() => {
      if (gameState !== 'gameover') {
        spawnNewBall();
        gameState = 'ready';
      }
    }, 800);
    gameState = 'draining';
  }
}

// ---------- 渲染 ----------
function drawTable() {
  // 背景
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // 球台面板
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a1a3e');
  grad.addColorStop(1, '#0d0d2a');
  ctx.fillStyle = grad;
  ctx.fillRect(TABLE.left, TABLE.top, TABLE.right - TABLE.left, H - TABLE.top);

  // 装饰弧线
  ctx.strokeStyle = 'rgba(52, 152, 219, 0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(385, 140, 180, Math.PI * 0.8, Math.PI * 2.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(385, 140, 140, Math.PI * 0.85, Math.PI * 2.15);
  ctx.stroke();

  // 边界墙
  ctx.strokeStyle = '#3498db';
  ctx.lineWidth = 4;
  ctx.strokeRect(TABLE.left, TABLE.top, TABLE.right - TABLE.left, H - TABLE.top - 5);

  // 发射通道
  ctx.fillStyle = '#151530';
  ctx.fillRect(TABLE.launchLaneX - TABLE.launchLaneW / 2, TABLE.top + 30,
               TABLE.launchLaneW, H - TABLE.top - 30);
  ctx.strokeStyle = '#3498db';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(TABLE.launchLaneX - TABLE.launchLaneW / 2, TABLE.top + 30);
  ctx.lineTo(TABLE.launchLaneX - TABLE.launchLaneW / 2, H - 10);
  ctx.moveTo(TABLE.launchLaneX + TABLE.launchLaneW / 2, TABLE.top + 30);
  ctx.lineTo(TABLE.launchLaneX + TABLE.launchLaneW / 2, H - 10);
  ctx.stroke();

  // 顶部弧形导流
  ctx.strokeStyle = '#2980b9';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(TABLE.right + 10, TABLE.top + 60, 70, Math.PI, Math.PI * 1.5);
  ctx.stroke();

  // 底部导流斜板
  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(TABLE.left, H - 160);
  ctx.lineTo(230, H - 70);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(TABLE.right, H - 160);
  ctx.lineTo(540, H - 70);
  ctx.stroke();

  // 排水口标记
  ctx.fillStyle = 'rgba(231, 76, 60, 0.3)';
  ctx.fillRect(230, H - 15, 310, 15);
  ctx.fillStyle = '#e74c3c';
  ctx.font = '10px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('DRAIN', 385, H - 4);

  // 发射弹簧
  const springY = H - 30;
  const compression = plungerCharge / 100 * 25;
  ctx.strokeStyle = '#95a5a6';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const y = springY + compression + i * (30 - compression) / 6;
    ctx.moveTo(TABLE.launchLaneX - 10, y);
    ctx.lineTo(TABLE.launchLaneX + 10, y + 3);
  }
  ctx.stroke();
  // 发射头
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(TABLE.launchLaneX - 12, springY + compression - 8, 24, 8);
}

function drawHUD() {
  // 分数面板
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(W - 250, 0, 250, 60);
  ctx.strokeStyle = '#f39c12';
  ctx.lineWidth = 1;
  ctx.strokeRect(W - 250, 0, 250, 60);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 22px Arial';
  ctx.fillText(score.toLocaleString(), W - 240, 28);

  ctx.fillStyle = '#fff';
  ctx.font = '13px Arial';
  ctx.fillText('球: ', W - 240, 50);
  for (let i = 0; i < ballsLeft; i++) {
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath();
    ctx.arc(W - 215 + i * 20, 46, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // 倍数
  if (multiplier > 1) {
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'right';
    ctx.fillText('x' + multiplier, W - 15, 50);
  }

  // 操作提示
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '11px Arial';
  ctx.fillText('Z=左挡板  /=右挡板  空格=发射', 35, 18);

  // 蓄力条
  if (gameState === 'charging' || gameState === 'ready') {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '13px Arial';
    ctx.textAlign = 'center';
    if (gameState === 'ready') {
      ctx.fillText('按住空格蓄力, 松开发射!', TABLE.launchLaneX - 10, H / 2);
    }
    // 力度条
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(TABLE.launchLaneX - 8, H - 140, 16, 100);
    const chargeColor = plungerCharge > 80 ? '#e74c3c' : plungerCharge > 50 ? '#f39c12' : '#2ecc71';
    ctx.fillStyle = chargeColor;
    ctx.fillRect(TABLE.launchLaneX - 8, H - 140 + (100 - plungerCharge), 16, plungerCharge);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(TABLE.launchLaneX - 8, H - 140, 16, 100);
  }

  // 消息
  if (messageTimer > 0) {
    ctx.globalAlpha = Math.min(1, messageTimer / 30);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 24px Arial';
    ctx.fillText(message, W / 2 - 30, H / 2 - 30);
    ctx.globalAlpha = 1;
  }

  // 倾斜警告
  if (tiltWarning > 0) {
    ctx.globalAlpha = 0.5 + Math.sin(frame * 0.3) * 0.3;
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('TILT!', W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px Arial';
  for (const f of floatTexts) {
    ctx.globalAlpha = f.life / 45;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e74c3c';
  ctx.font = 'bold 48px Arial';
  ctx.fillText('游戏结束', W / 2, H / 2 - 50);
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 28px Arial';
  ctx.fillText('最终得分: ' + score.toLocaleString(), W / 2, H / 2 + 10);
  ctx.fillStyle = '#fff';
  ctx.font = '18px Arial';
  ctx.fillText('按空格键重新开始', W / 2, H / 2 + 60);
}

// ---------- 主循环 ----------
function gameLoop() {
  frame++;

  if (gameState !== 'gameover') {
    updatePhysics();
  }

  // 渲染
  drawTable();
  slingshots.forEach(s => s.draw());
  dropTargets.forEach(t => t.draw());
  bumpers.forEach(b => b.draw());
  flippers.forEach(f => f.draw());
  balls.forEach(b => b.draw());
  drawParticles();
  drawHUD();

  if (gameState === 'gameover') drawGameOver();

  requestAnimationFrame(gameLoop);
}

// 初始化
spawnNewBall();
gameLoop();
</script>
