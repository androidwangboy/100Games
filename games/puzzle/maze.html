<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>迷宫</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

const STATE_TITLE = 0, STATE_PLAY = 1, STATE_WIN = 2, STATE_SOLVE = 3;
let state = STATE_TITLE;
let score = 0;

// Maze data
let mazeW = 15, mazeH = 15;
let maze = [];
let playerX = 0, playerY = 0;
let endX = 0, endY = 0;
let steps = 0;
let timer = 0;
let timerInterval = null;
let fogOfWar = false;
let visited = [];
let solvePath = [];
let solveAnimIdx = 0;
let solveAnimTimer = null;
let difficulty = 0;

const SIZES = [15, 25, 35];
const SIZE_NAMES = ['小 (15×15)', '中 (25×25)', '大 (35×35)'];

// Colors
const COL_BG = '#1a1a2e';
const COL_WALL = '#4a4a6a';
const COL_PATH = '#22223a';
const COL_PLAYER = '#4fc3f7';
const COL_END = '#66bb6a';
const COL_FOG = '#0a0a15';
const COL_VISITED = '#2a2a4a';
const COL_SOLVE = '#ffab40';
const COL_TEXT = '#eee';
const COL_BTN = '#333';
const COL_BTN_HOVER = '#555';

let buttons = [];
let hoverBtn = -1;

function initButtons() {
  buttons = [];
  if (state === STATE_TITLE) {
    for (let i = 0; i < 3; i++) {
      buttons.push({ x: 280, y: 180 + i * 60, w: 240, h: 45, label: SIZE_NAMES[i], action: () => startGame(i) });
    }
    buttons.push({ x: 280, y: 380, w: 240, h: 40, label: fogOfWar ? '战争迷雾: 开' : '战争迷雾: 关', action: () => { fogOfWar = !fogOfWar; initButtons(); } });
  } else if (state === STATE_PLAY) {
    buttons.push({ x: 650, y: 10, w: 130, h: 32, label: '放弃(显示路径)', action: giveUp });
    buttons.push({ x: 650, y: 50, w: 130, h: 32, label: '重新开始', action: () => { state = STATE_TITLE; stopTimer(); initButtons(); } });
  } else if (state === STATE_WIN || state === STATE_SOLVE) {
    buttons.push({ x: 300, y: 350, w: 200, h: 50, label: '返回菜单', action: () => { state = STATE_TITLE; initButtons(); } });
  }
}

// Maze generation - Recursive Backtracker
function generateMaze(w, h) {
  // Each cell has walls: [top, right, bottom, left]
  let grid = Array.from({length: h}, () => Array.from({length: w}, () => [true, true, true, true]));
  let vis = Array.from({length: h}, () => Array(w).fill(false));
  let stack = [];
  let cx = 0, cy = 0;
  vis[cy][cx] = true;
  stack.push([cx, cy]);

  const dirs = [[0,-1,0,2], [1,0,1,3], [0,1,2,0], [-1,0,3,1]]; // dx,dy,wall,opposite

  while (stack.length > 0) {
    let [x, y] = stack[stack.length - 1];
    let neighbors = [];
    for (let [dx, dy, wall, opp] of dirs) {
      let nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < w && ny >= 0 && ny < h && !vis[ny][nx]) {
        neighbors.push([nx, ny, wall, opp]);
      }
    }
    if (neighbors.length === 0) {
      stack.pop();
    } else {
      let [nx, ny, wall, opp] = neighbors[Math.floor(Math.random() * neighbors.length)];
      grid[y][x][wall] = false;
      grid[ny][nx][opp] = false;
      vis[ny][nx] = true;
      stack.push([nx, ny]);
    }
  }
  return grid;
}

function startGame(sizeIdx) {
  difficulty = sizeIdx;
  mazeW = SIZES[sizeIdx];
  mazeH = SIZES[sizeIdx];
  maze = generateMaze(mazeW, mazeH);
  playerX = 0;
  playerY = 0;
  endX = mazeW - 1;
  endY = mazeH - 1;
  steps = 0;
  timer = 0;
  solvePath = [];
  solveAnimIdx = 0;
  visited = Array.from({length: mazeH}, () => Array(mazeW).fill(false));
  visited[0][0] = true;
  state = STATE_PLAY;
  startTimer();
  initButtons();
}

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => { timer++; }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function movePlayer(dx, dy) {
  if (state !== STATE_PLAY) return;
  let nx = playerX + dx, ny = playerY + dy;
  if (nx < 0 || nx >= mazeW || ny < 0 || ny >= mazeH) return;

  // Check wall
  let wallIdx = dx === 1 ? 1 : dx === -1 ? 3 : dy === 1 ? 2 : 0;
  if (maze[playerY][playerX][wallIdx]) return;

  playerX = nx;
  playerY = ny;
  steps++;
  visited[ny][nx] = true;

  if (playerX === endX && playerY === endY) {
    stopTimer();
    score = Math.max(0, 2000 - timer * 3 - steps * 2) + (difficulty + 1) * 300;
    state = STATE_WIN;
    solvePath = solveMaze();
    initButtons();
  }
}

function giveUp() {
  stopTimer();
  solvePath = solveMaze();
  solveAnimIdx = 0;
  state = STATE_SOLVE;
  score = 0;
  initButtons();
  animateSolve();
}

function solveMaze() {
  // BFS from player to end
  let queue = [[playerX, playerY]];
  let prev = Array.from({length: mazeH}, () => Array(mazeW).fill(null));
  let vis = Array.from({length: mazeH}, () => Array(mazeW).fill(false));
  vis[playerY][playerX] = true;

  const dirs = [[0,-1,0], [1,0,1], [0,1,2], [-1,0,3]];

  while (queue.length > 0) {
    let [x, y] = queue.shift();
    if (x === endX && y === endY) {
      // Reconstruct path
      let path = [];
      let cur = [endX, endY];
      while (cur) {
        path.unshift(cur);
        cur = prev[cur[1]][cur[0]];
      }
      return path;
    }
    for (let [dx, dy, wallIdx] of dirs) {
      let nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < mazeW && ny >= 0 && ny < mazeH && !vis[ny][nx] && !maze[y][x][wallIdx]) {
        vis[ny][nx] = true;
        prev[ny][nx] = [x, y];
        queue.push([nx, ny]);
      }
    }
  }
  return [];
}

function animateSolve() {
  if (solveAnimTimer) clearInterval(solveAnimTimer);
  solveAnimTimer = setInterval(() => {
    solveAnimIdx++;
    if (solveAnimIdx >= solvePath.length) {
      clearInterval(solveAnimTimer);
      solveAnimTimer = null;
    }
  }, 50);
}

function formatTime(s) {
  let m = Math.floor(s / 60);
  let sec = s % 60;
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}

// Drawing
function draw() {
  ctx.fillStyle = COL_BG;
  ctx.fillRect(0, 0, W, H);

  if (state === STATE_TITLE) drawTitle();
  else if (state === STATE_PLAY) drawPlay();
  else if (state === STATE_WIN) drawWin();
  else if (state === STATE_SOLVE) drawSolve();

  drawButtons();
  requestAnimationFrame(draw);
}

function drawTitle() {
  ctx.fillStyle = COL_TEXT;
  ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('迷 宫', W/2, 90);
  ctx.font = '18px sans-serif';
  ctx.fillStyle = '#aaa';
  ctx.fillText('选择迷宫大小开始游戏', W/2, 140);
  ctx.fillText('操作: 方向键/WASD移动 | ESC退出', W/2, 450);
}

function getCellSize() {
  let maxW = 600, maxH = 440;
  let cellW = Math.floor(maxW / mazeW);
  let cellH = Math.floor(maxH / mazeH);
  return Math.min(cellW, cellH, 30);
}

function drawMaze(offsetX, offsetY, cellSize, showFog, showPath, pathLen) {
  let mw = mazeW * cellSize;
  let mh = mazeH * cellSize;

  // Draw cells
  for (let y = 0; y < mazeH; y++) {
    for (let x = 0; x < mazeW; x++) {
      let px = offsetX + x * cellSize;
      let py = offsetY + y * cellSize;

      // Fog of war
      if (showFog && !visited[y][x]) {
        // Check if adjacent to visited
        let nearVisited = false;
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            let ny2 = y+dy, nx2 = x+dx;
            if (ny2>=0 && ny2<mazeH && nx2>=0 && nx2<mazeW && visited[ny2][nx2]) nearVisited = true;
          }
        if (!nearVisited) {
          ctx.fillStyle = COL_FOG;
          ctx.fillRect(px, py, cellSize, cellSize);
          continue;
        }
      }

      ctx.fillStyle = visited[y][x] ? COL_VISITED : COL_PATH;
      ctx.fillRect(px, py, cellSize, cellSize);

      // Draw walls
      ctx.strokeStyle = COL_WALL;
      ctx.lineWidth = 2;
      let walls = maze[y][x];
      if (walls[0]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+cellSize, py); ctx.stroke(); }
      if (walls[1]) { ctx.beginPath(); ctx.moveTo(px+cellSize, py); ctx.lineTo(px+cellSize, py+cellSize); ctx.stroke(); }
      if (walls[2]) { ctx.beginPath(); ctx.moveTo(px, py+cellSize); ctx.lineTo(px+cellSize, py+cellSize); ctx.stroke(); }
      if (walls[3]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py+cellSize); ctx.stroke(); }
    }
  }

  // Draw solve path
  if (showPath && solvePath.length > 0) {
    let len = pathLen !== undefined ? Math.min(pathLen, solvePath.length) : solvePath.length;
    ctx.strokeStyle = COL_SOLVE;
    ctx.lineWidth = Math.max(2, cellSize / 4);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < len; i++) {
      let [sx, sy] = solvePath[i];
      let px = offsetX + sx * cellSize + cellSize/2;
      let py = offsetY + sy * cellSize + cellSize/2;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // Draw end
  let epx = offsetX + endX * cellSize + cellSize/2;
  let epy = offsetY + endY * cellSize + cellSize/2;
  ctx.fillStyle = COL_END;
  ctx.beginPath();
  ctx.arc(epx, epy, cellSize/3, 0, Math.PI*2);
  ctx.fill();

  // Draw player
  let ppx = offsetX + playerX * cellSize + cellSize/2;
  let ppy = offsetY + playerY * cellSize + cellSize/2;
  ctx.fillStyle = COL_PLAYER;
  ctx.beginPath();
  ctx.arc(ppx, ppy, cellSize/3, 0, Math.PI*2);
  ctx.fill();
}

function drawPlay() {
  let cellSize = getCellSize();
  let mw = mazeW * cellSize;
  let mh = mazeH * cellSize;
  let offsetX = (620 - mw) / 2 + 10;
  let offsetY = (H - mh) / 2;

  drawMaze(offsetX, offsetY, cellSize, fogOfWar, false, 0);

  // HUD
  ctx.fillStyle = COL_TEXT;
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`时间: ${formatTime(timer)}`, 650, 110);
  ctx.fillText(`步数: ${steps}`, 650, 135);
  ctx.fillText(`大小: ${mazeW}×${mazeH}`, 650, 160);
  ctx.fillText(fogOfWar ? '迷雾: 开' : '迷雾: 关', 650, 185);

  // Minimap for large mazes
  if (mazeW >= 25) {
    drawMinimap(650, 210);
  }
}

function drawMinimap(mx, my) {
  let mmSize = 120;
  let cs = mmSize / mazeW;
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(mx, my, mmSize, mmSize);
  ctx.strokeStyle = '#444';
  ctx.strokeRect(mx, my, mmSize, mmSize);

  for (let y = 0; y < mazeH; y++) {
    for (let x = 0; x < mazeW; x++) {
      if (!visited[y][x]) continue;
      let px = mx + x * cs;
      let py = my + y * cs;
      ctx.fillStyle = '#3a3a5a';
      ctx.fillRect(px, py, cs, cs);
      ctx.strokeStyle = '#5a5a7a';
      ctx.lineWidth = 0.5;
      let walls = maze[y][x];
      if (walls[0]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+cs, py); ctx.stroke(); }
      if (walls[1]) { ctx.beginPath(); ctx.moveTo(px+cs, py); ctx.lineTo(px+cs, py+cs); ctx.stroke(); }
      if (walls[2]) { ctx.beginPath(); ctx.moveTo(px, py+cs); ctx.lineTo(px+cs, py+cs); ctx.stroke(); }
      if (walls[3]) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py+cs); ctx.stroke(); }
    }
  }

  // Player on minimap
  ctx.fillStyle = COL_PLAYER;
  ctx.fillRect(mx + playerX * cs, my + playerY * cs, cs+1, cs+1);
  // End on minimap
  ctx.fillStyle = COL_END;
  ctx.fillRect(mx + endX * cs, my + endY * cs, cs+1, cs+1);
}

function drawWin() {
  let cellSize = getCellSize();
  let mw = mazeW * cellSize;
  let mh = mazeH * cellSize;
  let offsetX = (W - mw) / 2;
  let offsetY = (H - mh) / 2 - 20;

  drawMaze(offsetX, offsetY, cellSize, false, true, solvePath.length);

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 60);
  ctx.fillStyle = COL_TEXT;
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`通关! 用时: ${formatTime(timer)}  步数: ${steps}  得分: ${score}`, W/2, 40);
}

function drawSolve() {
  let cellSize = getCellSize();
  let mw = mazeW * cellSize;
  let mh = mazeH * cellSize;
  let offsetX = (W - mw) / 2;
  let offsetY = (H - mh) / 2 - 20;

  drawMaze(offsetX, offsetY, cellSize, false, true, solveAnimIdx);

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 60);
  ctx.fillStyle = '#ffab40';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('路径展示中... (最短路径)', W/2, 40);
}

function drawButtons() {
  for (let i = 0; i < buttons.length; i++) {
    let b = buttons[i];
    ctx.fillStyle = (i === hoverBtn) ? COL_BTN_HOVER : COL_BTN;
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = COL_TEXT;
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

// Input
canvas.addEventListener('mousemove', e => {
  let rect = canvas.getBoundingClientRect();
  let mx = (e.clientX - rect.left) * (W / rect.width);
  let my = (e.clientY - rect.top) * (H / rect.height);
  hoverBtn = -1;
  for (let i = 0; i < buttons.length; i++) {
    let b = buttons[i];
    if (mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) { hoverBtn = i; break; }
  }
  canvas.style.cursor = hoverBtn >= 0 ? 'pointer' : 'default';
});

canvas.addEventListener('click', e => {
  let rect = canvas.getBoundingClientRect();
  let mx = (e.clientX - rect.left) * (W / rect.width);
  let my = (e.clientY - rect.top) * (H / rect.height);
  for (let b of buttons) {
    if (mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) { b.action(); return; }
  }
});

document.addEventListener('keydown', e => {
  if (state !== STATE_PLAY) return;
  if (e.code === 'Escape') return;
  switch(e.code) {
    case 'ArrowUp': case 'KeyW': movePlayer(0, -1); e.preventDefault(); break;
    case 'ArrowDown': case 'KeyS': movePlayer(0, 1); e.preventDefault(); break;
    case 'ArrowLeft': case 'KeyA': movePlayer(-1, 0); e.preventDefault(); break;
    case 'ArrowRight': case 'KeyD': movePlayer(1, 0); e.preventDefault(); break;
  }
});

initButtons();
draw();
</script>
</body>
</html>
