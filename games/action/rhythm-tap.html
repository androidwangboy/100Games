<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>节奏点击</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

let state = 'title';
let score = 0, combo = 0, maxCombo = 0, multiplier = 1;
let health = 100, bestScore = 0;
let notes = [], effects = [], judgments = [], bgParticles = [];
let frameCount = 0, songTime = 0, noteIndex = 0;
let laneFlash = [0, 0, 0, 0];
let lanePressed = [false, false, false, false];
let stats = { perfect: 0, great: 0, good: 0, miss: 0 };
let beatPulse = 0, totalNotes = 0;

const BPM = 130;
const BEAT_INTERVAL = 60000 / BPM;
const LANES = 4;
const LANE_W = 90;
const LANE_START = (W - LANES * LANE_W) / 2;
const HIT_Y = H - 70;
const NOTE_SPEED = 4.5;
const KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
const KEY_LABELS = ['D', 'F', 'J', 'K'];
const LANE_COLORS = ['#e74c3c', '#f39c12', '#2ecc71', '#3498db'];
const LANE_GLOW = ['rgba(231,76,60,', 'rgba(243,156,18,', 'rgba(46,204,113,', 'rgba(52,152,219,'];

let beatmap = [];

function generateBeatmap() {
  beatmap = [];
  const totalBeats = 140;
  let seed = 12345;
  function rng() { seed = (seed * 1664525 + 1013904223) & 0xFFFFFFFF; return (seed >>> 0) / 0xFFFFFFFF; }

  for (let beat = 4; beat < totalBeats; beat++) {
    const time = beat * BEAT_INTERVAL;
    const section = Math.floor(beat / 16);
    const density = section < 1 ? 0.35 : section < 3 ? 0.5 : section < 5 ? 0.65 : section < 7 ? 0.8 : 0.92;

    if (rng() < density) {
      const lane = Math.floor(rng() * LANES);
      beatmap.push({ time, lane });
      if (section >= 4 && rng() < 0.25) {
        let lane2 = (lane + 1 + Math.floor(rng() * 3)) % LANES;
        beatmap.push({ time, lane: lane2 });
      }
    }
    if (section >= 2 && rng() < 0.3) {
      const halfTime = time + BEAT_INTERVAL / 2;
      const lane = Math.floor(rng() * LANES);
      beatmap.push({ time: halfTime, lane });
    }
    if (section >= 5 && rng() < 0.2) {
      const quarterTime = time + BEAT_INTERVAL / 4;
      const lane = Math.floor(rng() * LANES);
      beatmap.push({ time: quarterTime, lane });
    }
  }
  beatmap.sort((a, b) => a.time - b.time);
  totalNotes = beatmap.length;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); return; }
  if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) { startGame(); return; }
  if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) { startGame(); return; }
  if (state === 'result' && (e.code === 'Space' || e.code === 'Enter')) { state = 'title'; return; }
  if (state !== 'playing') return;

  const laneIdx = KEYS.indexOf(e.code);
  if (laneIdx === -1) return;
  e.preventDefault();
  if (lanePressed[laneIdx]) return;
  lanePressed[laneIdx] = true;
  laneFlash[laneIdx] = 12;
  hitNote(laneIdx);
});

document.addEventListener('keyup', e => {
  const laneIdx = KEYS.indexOf(e.code);
  if (laneIdx >= 0) lanePressed[laneIdx] = false;
});

function startGame() {
  state = 'playing';
  score = 0; combo = 0; maxCombo = 0; multiplier = 1;
  health = 100; notes = []; effects = []; judgments = [];
  frameCount = 0; songTime = 0; noteIndex = 0;
  stats = { perfect: 0, great: 0, good: 0, miss: 0 };
  laneFlash = [0, 0, 0, 0]; lanePressed = [false, false, false, false];
  beatPulse = 0;
  generateBeatmap();
  initBgParticles();
}

function initBgParticles() {
  bgParticles = [];
  for (let i = 0; i < 30; i++) {
    bgParticles.push({
      x: Math.random() * W, y: Math.random() * H,
      speed: 0.3 + Math.random() * 0.7,
      radius: 1 + Math.random() * 2,
      alpha: 0.1 + Math.random() * 0.3
    });
  }
}

function hitNote(lane) {
  let closest = null, closestDist = Infinity;
  for (const n of notes) {
    if (n.lane !== lane || n.hit) continue;
    const dist = Math.abs(n.y - HIT_Y);
    if (dist < closestDist) { closestDist = dist; closest = n; }
  }

  if (!closest || closestDist > 80) {
    effects.push({
      x: LANE_START + lane * LANE_W + LANE_W / 2, y: HIT_Y,
      vx: 0, vy: 0, life: 10, color: '#555', radius: 15, isRing: true
    });
    return;
  }

  closest.hit = true;
  let judgment, points, color;
  if (closestDist < 12) { judgment = 'Perfect'; points = 300; color = '#f1c40f'; stats.perfect++; health = Math.min(100, health + 3); }
  else if (closestDist < 30) { judgment = 'Great'; points = 200; color = '#2ecc71'; stats.great++; health = Math.min(100, health + 2); }
  else if (closestDist < 55) { judgment = 'Good'; points = 100; color = '#3498db'; stats.good++; health = Math.min(100, health + 1); }
  else { judgment = 'OK'; points = 50; color = '#95a5a6'; stats.good++; }

  combo++;
  if (combo > maxCombo) maxCombo = combo;
  multiplier = 1 + Math.floor(combo / 10) * 0.5;
  score += Math.round(points * multiplier);
  beatPulse = 8;

  const cx = LANE_START + lane * LANE_W + LANE_W / 2;
  judgments.push({ text: judgment, color, x: cx, y: HIT_Y - 45, life: 45, scale: 1.3 });

  const particleCount = judgment === 'Perfect' ? 14 : judgment === 'Great' ? 10 : 6;
  for (let i = 0; i < particleCount; i++) {
    const angle = (i / particleCount) * Math.PI * 2 + Math.random() * 0.3;
    const speed = 2 + Math.random() * 5;
    effects.push({
      x: cx, y: HIT_Y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
      life: 25 + Math.random() * 10, color: LANE_COLORS[lane],
      radius: 2 + Math.random() * 3, isRing: false
    });
  }
  effects.push({ x: cx, y: HIT_Y, vx: 0, vy: 0, life: 15, color: LANE_COLORS[lane], radius: 10, isRing: true });
}

function update() {
  frameCount++;
  if (beatPulse > 0) beatPulse--;

  for (const bp of bgParticles) {
    bp.y -= bp.speed;
    if (bp.y < -5) { bp.y = H + 5; bp.x = Math.random() * W; }
  }

  if (state !== 'playing') return;

  songTime += 16.67;
  const beatPhase = (songTime % BEAT_INTERVAL) / BEAT_INTERVAL;

  const travelTime = (HIT_Y + 20) / NOTE_SPEED * 16.67;
  while (noteIndex < beatmap.length && beatmap[noteIndex].time - songTime < travelTime) {
    const bm = beatmap[noteIndex];
    notes.push({ lane: bm.lane, y: -20, hit: false, missed: false, glow: 0 });
    noteIndex++;
  }

  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.y += NOTE_SPEED;
    n.glow = Math.max(0, 1 - Math.abs(n.y - HIT_Y) / 100);
    if (!n.hit && n.y > HIT_Y + 70) {
      n.missed = true;
      combo = 0; multiplier = 1;
      health -= 6;
      stats.miss++;
      const cx = LANE_START + n.lane * LANE_W + LANE_W / 2;
      judgments.push({ text: 'Miss', color: '#e74c3c', x: cx, y: HIT_Y - 45, life: 35, scale: 1 });
      effects.push({ x: cx, y: HIT_Y, vx: 0, vy: 0, life: 12, color: '#e74c3c', radius: 20, isRing: true });
      notes.splice(i, 1);
      if (health <= 0) { health = 0; endGame(); return; }
    } else if (n.hit) {
      notes.splice(i, 1);
    }
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.x += e.vx || 0; e.y += e.vy || 0;
    if (!e.isRing) e.vy = (e.vy || 0) + 0.25;
    if (e.isRing) e.radius += 2;
    e.life--;
    if (e.life <= 0) effects.splice(i, 1);
  }

  for (let i = judgments.length - 1; i >= 0; i--) {
    const j = judgments[i];
    j.y -= 0.7; j.life--;
    j.scale += (1 - j.scale) * 0.15;
    if (j.life <= 0) judgments.splice(i, 1);
  }

  for (let i = 0; i < LANES; i++) { if (laneFlash[i] > 0) laneFlash[i]--; }

  if (noteIndex >= beatmap.length && notes.length === 0) endGame();
}

function endGame() {
  state = 'result';
  if (score > bestScore) bestScore = score;
}

function drawBackground() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  for (const bp of bgParticles) {
    ctx.globalAlpha = bp.alpha;
    ctx.fillStyle = '#6c5ce7';
    ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.radius, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (let i = 0; i < LANES; i++) {
    const x = LANE_START + i * LANE_W;
    const flashIntensity = laneFlash[i] / 12;
    if (flashIntensity > 0) {
      const grad = ctx.createLinearGradient(0, HIT_Y, 0, 0);
      grad.addColorStop(0, LANE_GLOW[i] + (flashIntensity * 0.25) + ')');
      grad.addColorStop(1, LANE_GLOW[i] + '0)');
      ctx.fillStyle = grad;
      ctx.fillRect(x, 0, LANE_W, HIT_Y);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(x, 0, LANE_W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(LANE_START + LANES * LANE_W, 0);
  ctx.lineTo(LANE_START + LANES * LANE_W, H); ctx.stroke();
}

function drawHitZone() {
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(LANE_START, HIT_Y); ctx.lineTo(LANE_START + LANES * LANE_W, HIT_Y); ctx.stroke();

  for (let i = 0; i < LANES; i++) {
    const x = LANE_START + i * LANE_W + LANE_W / 2;
    const pressed = lanePressed[i];
    const flash = laneFlash[i] / 12;

    ctx.strokeStyle = LANE_COLORS[i];
    ctx.lineWidth = pressed ? 4 : 2;
    ctx.globalAlpha = pressed ? 1 : 0.5 + flash * 0.5;
    ctx.beginPath(); ctx.arc(x, HIT_Y, 26, 0, Math.PI * 2); ctx.stroke();

    if (pressed || flash > 0) {
      ctx.fillStyle = LANE_GLOW[i] + (0.15 + flash * 0.2) + ')';
      ctx.beginPath(); ctx.arc(x, HIT_Y, 26, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1;

    ctx.fillStyle = pressed ? '#fff' : 'rgba(255,255,255,0.5)';
    ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
    ctx.fillText(KEY_LABELS[i], x, HIT_Y + 50);
  }
}

function drawNotes() {
  for (const n of notes) {
    if (n.hit) continue;
    const x = LANE_START + n.lane * LANE_W + LANE_W / 2;
    const color = LANE_COLORS[n.lane];
    const noteW = 62, noteH = 22;

    if (n.glow > 0.3) {
      ctx.shadowColor = color;
      ctx.shadowBlur = n.glow * 15;
    }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x - noteW / 2, n.y - noteH / 2, noteW, noteH, 6); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.roundRect(x - noteW / 2 + 4, n.y - noteH / 2 + 3, noteW - 8, noteH / 3, 3); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.roundRect(x - noteW / 2, n.y - noteH / 2, noteW, noteH, 6); ctx.stroke();
  }
}

function drawEffects() {
  for (const e of effects) {
    const alpha = e.life / (e.isRing ? 15 : 30);
    ctx.globalAlpha = Math.min(1, alpha);
    if (e.isRing) {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius * alpha, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  for (const j of judgments) {
    ctx.globalAlpha = Math.min(1, j.life / 20);
    ctx.fillStyle = j.color;
    ctx.font = `bold ${Math.round(20 * j.scale)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(j.text, j.x, j.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`${score}`, 15, 30);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#888';
  ctx.fillText('SCORE', 15, 45);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#aaa';
  ctx.fillText(`x${multiplier.toFixed(1)}`, 15, 65);

  if (combo > 2) {
    ctx.textAlign = 'center';
    const comboScale = 1 + beatPulse * 0.02;
    ctx.fillStyle = '#f1c40f';
    ctx.font = `bold ${Math.round(Math.min(38, 24 + combo * 0.4) * comboScale)}px sans-serif`;
    ctx.fillText(`${combo}`, W / 2, 45);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#e67e22';
    ctx.fillText('COMBO', W / 2, 62);
  }

  const hbW = 160, hbH = 12, hbX = W - hbW - 15, hbY = 20;
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.roundRect(hbX, hbY, hbW, hbH, 6); ctx.fill();
  const hpRatio = health / 100;
  const hpColor = health > 50 ? '#2ecc71' : health > 25 ? '#f39c12' : '#e74c3c';
  if (hpRatio > 0) {
    ctx.fillStyle = hpColor;
    ctx.beginPath(); ctx.roundRect(hbX, hbY, hbW * hpRatio, hbH, 6); ctx.fill();
  }
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(hbX, hbY, hbW, hbH, 6); ctx.stroke();

  const progress = beatmap.length > 0 ? noteIndex / beatmap.length : 0;
  ctx.fillStyle = '#222'; ctx.fillRect(0, H - 4, W, 4);
  ctx.fillStyle = '#6c5ce7'; ctx.fillRect(0, H - 4, W * progress, 4);
}

function drawTitle() {
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, 0, W, H);
  for (const bp of bgParticles) {
    ctx.globalAlpha = bp.alpha;
    ctx.fillStyle = '#6c5ce7';
    ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.radius, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  const pulse = Math.sin(frameCount * 0.04) * 2;
  ctx.fillStyle = '#9b59b6'; ctx.font = `bold ${48 + pulse}px sans-serif`;
  ctx.fillText('🎵 节奏点击', W / 2, H / 2 - 90);
  ctx.fillStyle = '#ecf0f1'; ctx.font = '19px sans-serif';
  ctx.fillText('音符下落时按下对应按键击中', W / 2, H / 2 - 40);

  const laneColors = ['#e74c3c', '#f39c12', '#2ecc71', '#3498db'];
  const labels = ['D', 'F', 'J', 'K'];
  for (let i = 0; i < 4; i++) {
    const kx = W / 2 - 90 + i * 60;
    ctx.fillStyle = laneColors[i];
    ctx.beginPath(); ctx.roundRect(kx - 18, H / 2 - 10, 36, 36, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px monospace';
    ctx.fillText(labels[i], kx, H / 2 + 14);
  }

  ctx.fillStyle = '#95a5a6'; ctx.font = '15px sans-serif';
  ctx.fillText('Perfect / Great / Good / Miss 四级判定', W / 2, H / 2 + 60);
  ctx.fillText('连击增加倍率，Miss扣血，血量归零则失败', W / 2, H / 2 + 85);
  ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 22px sans-serif';
  const blink = Math.sin(frameCount * 0.06) > 0;
  if (blink) ctx.fillText('按空格开始', W / 2, H / 2 + 130);
  if (bestScore > 0) {
    ctx.fillStyle = '#95a5a6'; ctx.font = '16px sans-serif';
    ctx.fillText(`最高分: ${bestScore}`, W / 2, H / 2 + 165);
  }
}

function drawResult() {
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const total = stats.perfect + stats.great + stats.good + stats.miss;
  const acc = total > 0 ? Math.round((stats.perfect * 100 + stats.great * 70 + stats.good * 40) / total) : 0;
  let rank = acc >= 95 ? 'S' : acc >= 85 ? 'A' : acc >= 70 ? 'B' : acc >= 50 ? 'C' : 'D';
  let rankColor = rank === 'S' ? '#f1c40f' : rank === 'A' ? '#2ecc71' : rank === 'B' ? '#3498db' : rank === 'C' ? '#e67e22' : '#e74c3c';

  ctx.fillStyle = '#fff'; ctx.font = 'bold 32px sans-serif';
  ctx.fillText('演奏完成!', W / 2, 55);

  ctx.fillStyle = rankColor; ctx.font = 'bold 80px sans-serif';
  ctx.shadowColor = rankColor; ctx.shadowBlur = 20;
  ctx.fillText(rank, W / 2, 150);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`分数: ${score}`, W / 2, 205);

  ctx.font = '18px sans-serif';
  const items = [
    { label: 'Perfect', val: stats.perfect, color: '#f1c40f' },
    { label: 'Great', val: stats.great, color: '#2ecc71' },
    { label: 'Good', val: stats.good, color: '#3498db' },
    { label: 'Miss', val: stats.miss, color: '#e74c3c' },
  ];
  items.forEach((item, i) => {
    const y = 250 + i * 32;
    ctx.fillStyle = item.color; ctx.textAlign = 'right';
    ctx.fillText(item.label, W / 2 - 10, y);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(`${item.val}`, W / 2 + 10, y);
  });

  ctx.textAlign = 'center'; ctx.fillStyle = '#ddd'; ctx.font = '18px sans-serif';
  ctx.fillText(`最大连击: ${maxCombo}   准确率: ${acc}%`, W / 2, 395);
  if (score >= bestScore && score > 0) {
    ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText('★ 新纪录! ★', W / 2, 425);
  }
  ctx.fillStyle = '#95a5a6'; ctx.font = '15px sans-serif';
  ctx.fillText('按空格返回标题', W / 2, 460);
}

function render() {
  if (state === 'title') { drawTitle(); return; }
  if (state === 'result') { drawResult(); return; }
  drawBackground();
  drawHitZone();
  drawNotes();
  drawEffects();
  drawHUD();
}

function loop() { update(); render(); requestAnimationFrame(loop); }
initBgParticles();
loop();
</script>
</body>
</html>
