<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>打字速度</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

let state = 'title';
let score = 0, lives = 3, combo = 0, maxCombo = 0;
let words = [], particles = [], floatingTexts = [], input = '';
let totalTyped = 0, correctTyped = 0, wordsCompleted = 0;
let startTime = 0, elapsed = 0, difficulty = 0, frameCount = 0;
let spawnTimer = 0, bestScore = 0, bestWPM = 0;
let screenFlash = 0, dangerPulse = 0;
let activeWordIdx = -1;

const WORDS_EASY = ['cat','dog','run','sun','hat','cup','red','big','top','fun','map','pen','box','fly','ice','jam','key','leg','net','owl','ant','bat','cow','eel','fox','gem','hen','ink','jet','kit'];
const WORDS_MED = ['apple','brave','cloud','dance','eagle','flame','grape','house','ivory','joker','knife','lemon','magic','noble','ocean','piano','queen','river','stone','tiger','amber','bloom','charm','drift','ember','frost','gleam','hazel','index','jolly'];
const WORDS_HARD = ['amazing','balance','captain','diamond','elephant','freedom','gravity','harvest','imagine','journal','kingdom','liberty','mystery','network','organic','passion','quantum','rainbow','shelter','thunder','absolute','brilliant','carnival','dinosaur','enormous','fountain','gorgeous','handsome','illusion','jubilant'];
const WORDS_EXPERT = ['keyboard','luminous','magnific','notebook','obstacle','paradise','question','romantic','sandwich','treasure','umbrella','vacation','wildfire','xylophon','yearning','zeppelin','abstract','birthday','circular','downtown'];

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); return; }
  if (state === 'title') { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  if (state === 'gameover') { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  if (state !== 'playing') return;

  if (e.code === 'Backspace') {
    input = input.slice(0, -1);
    if (input.length === 0) activeWordIdx = -1;
    e.preventDefault();
    return;
  }
  if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
    const ch = e.key.toLowerCase();
    input += ch;
    totalTyped++;

    if (activeWordIdx === -1) {
      for (let i = 0; i < words.length; i++) {
        if (words[i].text.startsWith(input)) { activeWordIdx = i; break; }
      }
    }

    if (activeWordIdx >= 0 && activeWordIdx < words.length) {
      const w = words[activeWordIdx];
      if (w.text.startsWith(input)) {
        correctTyped++;
        w.highlight = input.length;
        if (w.text === input) {
          destroyWord(w, activeWordIdx);
          input = '';
          activeWordIdx = -1;
        }
      } else {
        input = input.slice(0, -1);
        combo = 0;
        activeWordIdx = -1;
        screenFlash = 5;
      }
    } else {
      const anyMatch = words.some(w => w.text.startsWith(input));
      if (!anyMatch) {
        input = input.slice(0, -1);
        combo = 0;
        screenFlash = 5;
      } else {
        correctTyped++;
      }
    }
  }
});

function startGame() {
  state = 'playing';
  score = 0; lives = 3; combo = 0; maxCombo = 0;
  words = []; particles = []; floatingTexts = []; input = '';
  totalTyped = 0; correctTyped = 0; wordsCompleted = 0;
  startTime = Date.now(); difficulty = 0; frameCount = 0;
  spawnTimer = 0; screenFlash = 0; activeWordIdx = -1;
}

function getWordPool() {
  if (difficulty < 1) return WORDS_EASY;
  if (difficulty < 2) return [...WORDS_EASY, ...WORDS_MED];
  if (difficulty < 3.5) return [...WORDS_MED, ...WORDS_HARD];
  return [...WORDS_MED, ...WORDS_HARD, ...WORDS_EXPERT];
}

function spawnWord() {
  const pool = getWordPool();
  let text = pool[Math.floor(Math.random() * pool.length)];
  let attempts = 0;
  while (words.some(w => w.text === text) && attempts < 20) {
    text = pool[Math.floor(Math.random() * pool.length)];
    attempts++;
  }
  if (words.some(w => w.text === text)) return;
  const speed = 0.35 + difficulty * 0.12 + Math.random() * 0.15;
  const hue = Math.floor(Math.random() * 360);
  words.push({
    text, x: 50 + Math.random() * (W - 250), y: -25,
    speed, highlight: 0,
    color: `hsl(${hue}, 70%, 65%)`,
    bgColor: `hsla(${hue}, 70%, 65%, 0.08)`,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.02 + Math.random() * 0.02
  });
}

function destroyWord(w, idx) {
  wordsCompleted++;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  const multiplier = 1 + Math.floor(combo / 5) * 0.5;
  const pts = Math.round(w.text.length * 10 * multiplier);
  score += pts;

  const cx = w.x + w.text.length * 7;
  const cy = w.y;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 15, color: w.color,
      radius: 2 + Math.random() * 3
    });
  }
  floatingTexts.push({ x: cx, y: cy - 10, text: `+${pts}`, life: 50, color: '#f1c40f' });
  if (combo > 0 && combo % 5 === 0) {
    floatingTexts.push({ x: W / 2, y: H / 2, text: `连击 x${combo}!`, life: 60, color: '#e74c3c', big: true });
  }
  words.splice(idx, 1);
  if (activeWordIdx >= words.length) activeWordIdx = -1;
}

function loseLife(w) {
  lives--;
  combo = 0;
  input = '';
  activeWordIdx = -1;
  screenFlash = 10;
  dangerPulse = 30;
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: w.x + w.text.length * 7, y: H - 20,
      vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 4,
      life: 25, color: '#e74c3c', radius: 3
    });
  }
  if (lives <= 0) {
    state = 'gameover';
    if (score > bestScore) bestScore = score;
    const wpm = getWPM();
    if (wpm > bestWPM) bestWPM = wpm;
  }
}

function update() {
  frameCount++;
  if (screenFlash > 0) screenFlash--;
  if (dangerPulse > 0) dangerPulse--;

  if (state !== 'playing') return;
  elapsed = (Date.now() - startTime) / 1000;
  difficulty = elapsed / 18;

  const spawnRate = Math.max(35, 95 - difficulty * 12);
  spawnTimer++;
  if (spawnTimer >= spawnRate) { spawnTimer = 0; spawnWord(); }

  for (let i = words.length - 1; i >= 0; i--) {
    const w = words[i];
    w.y += w.speed;
    w.wobble += w.wobbleSpeed;
    if (w.y > H - 35) {
      words.splice(i, 1);
      if (activeWordIdx === i) activeWordIdx = -1;
      else if (activeWordIdx > i) activeWordIdx--;
      loseLife(w);
      if (state !== 'playing') return;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 0.8; ft.life--;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function getWPM() {
  if (elapsed < 2) return 0;
  return Math.round((correctTyped / 5) / (elapsed / 60));
}

function getAccuracy() {
  if (totalTyped === 0) return 100;
  return Math.round((correctTyped / totalTyped) * 100);
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 35) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let x = 0; x < W; x += 35) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  if (dangerPulse > 0) {
    ctx.fillStyle = `rgba(231, 76, 60, ${dangerPulse / 100})`;
    ctx.fillRect(0, H - 40, W, 40);
  }
}

function drawWords() {
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'left';
  for (let wi = 0; wi < words.length; wi++) {
    const w = words[wi];
    const charW = 14;
    const wobbleX = Math.sin(w.wobble) * 2;
    const isActive = wi === activeWordIdx;

    ctx.fillStyle = w.bgColor;
    ctx.beginPath();
    ctx.roundRect(w.x + wobbleX - 6, w.y - 20, w.text.length * charW + 12, 28, 4);
    ctx.fill();

    if (isActive) {
      ctx.strokeStyle = 'rgba(46, 204, 113, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(w.x + wobbleX - 6, w.y - 20, w.text.length * charW + 12, 28, 4);
      ctx.stroke();
    }

    for (let i = 0; i < w.text.length; i++) {
      if (i < w.highlight) {
        ctx.fillStyle = '#2ecc71';
      } else {
        ctx.fillStyle = w.color;
      }
      ctx.fillText(w.text[i], w.x + wobbleX + i * charW, w.y);
    }

    const dangerZone = H - 80;
    if (w.y > dangerZone) {
      const urgency = (w.y - dangerZone) / 80;
      ctx.fillStyle = `rgba(231, 76, 60, ${urgency * 0.3})`;
      ctx.beginPath();
      ctx.roundRect(w.x + wobbleX - 6, w.y - 20, w.text.length * charW + 12, 28, 4);
      ctx.fill();
    }
  }
}

function drawInput() {
  const boxW = 320, boxH = 40;
  const bx = W / 2 - boxW / 2, by = H - 55;
  ctx.fillStyle = 'rgba(46, 204, 113, 0.1)';
  ctx.beginPath(); ctx.roundRect(bx, by, boxW, boxH, 8); ctx.fill();
  ctx.strokeStyle = input ? '#2ecc71' : '#555';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(bx, by, boxW, boxH, 8); ctx.stroke();

  ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
  if (input) {
    ctx.fillStyle = '#2ecc71';
    ctx.fillText(input, W / 2 - 5, by + 28);
    const cursorX = W / 2 + ctx.measureText(input).width / 2 + 2;
    if (frameCount % 40 < 20) {
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(cursorX, by + 10, 2, 22);
    }
  } else {
    ctx.fillStyle = '#666';
    ctx.font = '16px sans-serif';
    ctx.fillText('在此输入...', W / 2, by + 26);
  }
}

function drawHUD() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`分数: ${score}`, 15, 28);
  ctx.font = '15px sans-serif'; ctx.fillStyle = '#aaa';
  ctx.fillText(`WPM: ${getWPM()}`, 15, 50);
  ctx.fillText(`准确率: ${getAccuracy()}%`, 15, 70);

  ctx.textAlign = 'center';
  if (combo >= 3) {
    ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`连击 x${combo}`, W / 2, 28);
    const mult = 1 + Math.floor(combo / 5) * 0.5;
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#e67e22';
    ctx.fillText(`倍率 x${mult.toFixed(1)}`, W / 2, 46);
  }

  ctx.textAlign = 'right';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#e74c3c' : '#444';
    ctx.font = '22px sans-serif';
    ctx.fillText('♥', W - 15 - i * 30, 30);
  }

  ctx.fillStyle = 'rgba(231, 76, 60, 0.15)';
  ctx.fillRect(0, H - 6, W, 6);
  ctx.fillStyle = 'rgba(231, 76, 60, 0.5)';
  ctx.fillRect(0, H - 6, W, 2);

  const elapsed2 = Math.floor(elapsed);
  ctx.fillStyle = '#777'; ctx.font = '13px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(`${Math.floor(elapsed2 / 60)}:${(elapsed2 % 60).toString().padStart(2, '0')}`, W - 15, 55);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life / 50;
    ctx.fillStyle = ft.color;
    ctx.font = ft.big ? 'bold 32px sans-serif' : 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
}

function drawTitle() {
  drawBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3498db'; ctx.font = 'bold 48px sans-serif';
  ctx.fillText('⌨️ 打字速度', W / 2, H / 2 - 90);
  ctx.fillStyle = '#ecf0f1'; ctx.font = '19px sans-serif';
  ctx.fillText('单词从上方落下，快速输入消灭它们！', W / 2, H / 2 - 40);
  ctx.fillText('单词落到底部会失去一条命，共3条命', W / 2, H / 2 - 8);
  ctx.fillText('连续消灭单词获得连击倍率加分', W / 2, H / 2 + 24);
  ctx.fillStyle = '#aaa'; ctx.font = '15px sans-serif';
  ctx.fillText('难度随时间递增：单词更长、下落更快、出现更频繁', W / 2, H / 2 + 60);
  ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 22px sans-serif';
  const blink = Math.sin(frameCount * 0.06) > 0;
  if (blink) ctx.fillText('按空格或回车开始', W / 2, H / 2 + 110);
  if (bestScore > 0) {
    ctx.fillStyle = '#95a5a6'; ctx.font = '17px sans-serif';
    ctx.fillText(`最高分: ${bestScore}  最快WPM: ${bestWPM}`, W / 2, H / 2 + 150);
  }
}

function drawGameOver() {
  drawBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 44px sans-serif';
  ctx.fillText('游戏结束', W / 2, H / 2 - 90);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif';
  ctx.fillText(`最终分数: ${score}`, W / 2, H / 2 - 40);
  ctx.font = '20px sans-serif'; ctx.fillStyle = '#ddd';
  ctx.fillText(`WPM: ${getWPM()}   准确率: ${getAccuracy()}%`, W / 2, H / 2);
  ctx.fillText(`完成单词: ${wordsCompleted}   最高连击: ${maxCombo}`, W / 2, H / 2 + 35);
  ctx.fillText(`存活时间: ${Math.floor(elapsed)}秒`, W / 2, H / 2 + 70);
  ctx.fillStyle = '#f1c40f'; ctx.font = '18px sans-serif';
  ctx.fillText(`最高分: ${bestScore}`, W / 2, H / 2 + 110);
  ctx.fillStyle = '#95a5a6'; ctx.font = '17px sans-serif';
  ctx.fillText('按空格重新开始', W / 2, H / 2 + 150);
}

function render() {
  if (state === 'title') { drawTitle(); return; }
  if (state === 'gameover') { drawGameOver(); return; }
  drawBackground();
  drawWords();
  drawParticles();
  drawInput();
  drawHUD();
  if (screenFlash > 0) {
    ctx.fillStyle = `rgba(231, 76, 60, ${screenFlash / 30})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function loop() { update(); render(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
