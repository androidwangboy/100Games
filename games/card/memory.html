<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>翻牌配对</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let score = 0;
let state = 'title';
let cards = [];
let flipped = [];
let matched = [];
let moves = 0;
let matchCount = 0;
let lockBoard = false;
let hoverIdx = -1;
let startTime = 0;
let elapsed = 0;

const COLS = 4, ROWS = 4;
const CW = 100, CH = 100;
const OX = 200, OY = 40;
const EMOJIS = ['🐶','🐱','🐼','🦊','🐸','🦁','🐙','🦋'];

function initCards() {
  const pairs = [...EMOJIS, ...EMOJIS];
  // Fisher-Yates shuffle
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  cards = pairs;
  flipped = [];
  matched = Array(16).fill(false);
  moves = 0; score = 0; matchCount = 0; lockBoard = false;
  startTime = Date.now(); elapsed = 0;
}

function flipCard(idx) {
  if (lockBoard || matched[idx] || flipped.includes(idx)) return;
  flipped.push(idx);
  if (flipped.length === 2) {
    moves++; score = moves;
    lockBoard = true;
    const [a, b] = flipped;
    if (cards[a] === cards[b]) {
      matched[a] = matched[b] = true;
      matchCount++;
      flipped = [];
      lockBoard = false;
      if (matchCount === 8) { state = 'win'; elapsed = Math.floor((Date.now() - startTime) / 1000); }
    } else {
      setTimeout(() => { flipped = []; lockBoard = false; }, 800);
    }
  }
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (800 / rect.width);
  const my = (e.clientY - rect.top) * (480 / rect.height);
  const col = Math.floor((mx - OX) / CW);
  const row = Math.floor((my - OY) / CH);
  hoverIdx = (col >= 0 && col < COLS && row >= 0 && row < ROWS) ? row * COLS + col : -1;
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (800 / rect.width);
  const my = (e.clientY - rect.top) * (480 / rect.height);

  if (state === 'title') {
    if (mx > 300 && mx < 500 && my > 310 && my < 370) { initCards(); state = 'playing'; }
    return;
  }
  if (state === 'win') {
    if (mx > 300 && mx < 500 && my > 340 && my < 400) state = 'title';
    return;
  }
  const col = Math.floor((mx - OX) / CW);
  const row = Math.floor((my - OY) / CH);
  if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
    flipCard(row * COLS + col);
  }
});

function drawCard(idx) {
  const r = Math.floor(idx / COLS), c = idx % COLS;
  const x = OX + c * CW, y = OY + r * CH;
  const isUp = matched[idx] || flipped.includes(idx);
  const isHover = idx === hoverIdx && !isUp && state === 'playing';

  if (matched[idx]) {
    // Matched - faded green
    ctx.fillStyle = '#1b5e20';
    ctx.fillRect(x + 4, y + 4, CW - 8, CH - 8);
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 4, y + 4, CW - 8, CH - 8);
    ctx.globalAlpha = 0.5;
    ctx.font = '42px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cards[idx], x + CW/2, y + CH/2);
    ctx.globalAlpha = 1;
  } else if (isUp) {
    // Flipped face up
    ctx.fillStyle = '#263238';
    ctx.fillRect(x + 4, y + 4, CW - 8, CH - 8);
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 4, y + 4, CW - 8, CH - 8);
    ctx.font = '42px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(cards[idx], x + CW/2, y + CH/2);
  } else {
    // Face down
    ctx.fillStyle = isHover ? '#283593' : '#1a237e';
    ctx.fillRect(x + 4, y + 4, CW - 8, CH - 8);
    ctx.strokeStyle = isHover ? '#7986cb' : '#3949ab';
    ctx.lineWidth = isHover ? 3 : 2;
    ctx.strokeRect(x + 4, y + 4, CW - 8, CH - 8);
    // Pattern on card back
    ctx.fillStyle = '#5c6bc0';
    ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', x + CW/2, y + CH/2);
  }
}

function drawTitle() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, 800, 480);
  ctx.fillStyle = '#4fc3f7';
  ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('翻牌配对', 400, 110);
  ctx.fillStyle = '#aaa';
  ctx.font = '20px sans-serif';
  ctx.fillText('Memory Match', 400, 155);
  ctx.fillStyle = '#999';
  ctx.font = '18px sans-serif';
  ctx.fillText('翻开卡片，记住位置，找出所有相同的配对', 400, 205);
  ctx.fillText('4x4 网格，8 对动物图案', 400, 235);
  ctx.fillText('步数越少评价越高', 400, 265);
  // Start button
  ctx.fillStyle = '#0277bd';
  ctx.fillRect(300, 310, 200, 55);
  ctx.strokeStyle = '#4fc3f7';
  ctx.lineWidth = 2;
  ctx.strokeRect(300, 310, 200, 55);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText('开始游戏', 400, 338);
}

function drawWin() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, 800, 480);
  ctx.fillStyle = '#ffd54f';
  ctx.font = 'bold 44px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('全部配对成功！', 400, 140);
  ctx.fillStyle = '#fff';
  ctx.font = '24px sans-serif';
  ctx.fillText(`步数: ${moves}   用时: ${elapsed}秒`, 400, 200);
  const stars = moves <= 12 ? '⭐⭐⭐' : moves <= 18 ? '⭐⭐' : '⭐';
  ctx.font = '40px serif';
  ctx.fillText(stars, 400, 255);
  const msg = moves <= 12 ? '记忆力超强！' : moves <= 18 ? '表现不错！' : '继续加油！';
  ctx.fillStyle = '#aaa';
  ctx.font = '20px sans-serif';
  ctx.fillText(msg, 400, 305);
  ctx.fillStyle = '#1565c0';
  ctx.fillRect(300, 340, 200, 55);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('返回菜单', 400, 368);
}

function drawPlaying() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, 800, 480);
  for (let i = 0; i < 16; i++) drawCard(i);
  // HUD
  const time = Math.floor((Date.now() - startTime) / 1000);
  ctx.fillStyle = '#4fc3f7';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`步数: ${moves}`, 20, 30);
  ctx.fillText(`配对: ${matchCount}/8`, 20, 58);
  ctx.fillStyle = '#888';
  ctx.font = '16px sans-serif';
  ctx.fillText(`时间: ${time}s`, 20, 86);
}

function render() {
  if (state === 'title') drawTitle();
  else if (state === 'playing') drawPlaying();
  else { drawPlaying(); drawWin(); }
  requestAnimationFrame(render);
}
render();

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
});
</script>
</body>
</html>
