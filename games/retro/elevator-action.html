<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>电梯行动</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="game" width="800" height="480"></canvas>
<script>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 480;

// Game states
let state = 'title'; // title, playing, gameover, levelclear
let score = 0, lives = 3, level = 1, timer = 120;
let timerAccum = 0;
let keys = {};
let bullets = [], enemyBullets = [];
let player, elevators, enemies, doors, floors;
let scrollY = 0;
let particles = [], screenShake = 0;
const FLOOR_H = 80, NUM_FLOORS = 10;
const BUILDING_H = NUM_FLOORS * FLOOR_H;

document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5 - 2,
      life: 20 + Math.random() * 20,
      maxLife: 40,
      color: color,
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (let p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function initLevel() {
  floors = [];
  for (let i = 0; i < NUM_FLOORS; i++) {
    floors.push({ y: i * FLOOR_H, color: i % 2 === 0 ? '#2a2a3a' : '#252535' });
  }
  player = {
    x: 60, y: (NUM_FLOORS - 1) * FLOOR_H + FLOOR_H - 30,
    w: 20, h: 28, vx: 0, vy: 0, dir: 1,
    onElevator: null, shootCooldown: 0, invincible: 0
  };
  elevators = [];
  let elevPositions = [150, 350, 550, 700];
  for (let i = 0; i < elevPositions.length; i++) {
    elevators.push({
      x: elevPositions[i], y: (NUM_FLOORS - 1) * FLOOR_H,
      w: 40, h: FLOOR_H - 4, speed: 1.2, dir: -1,
      minY: FLOOR_H, maxY: (NUM_FLOORS - 1) * FLOOR_H
    });
  }
  enemies = [];
  let numEnemies = 3 + level * 2;
  for (let i = 0; i < numEnemies; i++) {
    let floor = Math.floor(Math.random() * (NUM_FLOORS - 2)) + 1;
    enemies.push({
      x: 100 + Math.random() * 600, y: floor * FLOOR_H + FLOOR_H - 30,
      w: 20, h: 28, vx: (Math.random() > 0.5 ? 1 : -1) * (1 + level * 0.3),
      floor: floor, shootTimer: 60 + Math.random() * 120, alive: true
    });
  }
  doors = [];
  let doorFloors = [];
  let numDoors = 3 + level;
  for (let i = 0; i < numDoors; i++) {
    let f;
    do { f = Math.floor(Math.random() * (NUM_FLOORS - 2)) + 1; } while (doorFloors.includes(f));
    doorFloors.push(f);
    doors.push({ x: 200 + Math.random() * 400, y: f * FLOOR_H + 10, w: 24, h: 40, collected: false, floor: f });
  }
  bullets = [];
  enemyBullets = [];
  scrollY = Math.max(0, player.y - H + 150);
  timer = 120;
  timerAccum = 0;
}

function update() {
  if (state !== 'playing') return;
  timerAccum += 1/60;
  if (timerAccum >= 1) { timerAccum -= 1; timer--; if (timer <= 0) { loseLife(); } }

  // Player movement
  let speed = 3;
  if (keys['ArrowLeft']) { player.vx = -speed; player.dir = -1; }
  else if (keys['ArrowRight']) { player.vx = speed; player.dir = 1; }
  else { player.vx = 0; }

  if (player.onElevator) {
    let elev = player.onElevator;
    player.x = elev.x + elev.w/2 - player.w/2;
    player.y = elev.y + elev.h - player.h;
    if (keys['ArrowUp'] && elev.y > elev.minY) elev.dir = -1;
    else if (keys['ArrowDown'] && elev.y < elev.maxY) elev.dir = 1;
    if (keys['ArrowLeft'] || keys['ArrowRight']) {
      player.onElevator = null;
      player.x += player.dir * 30;
    }
  } else {
    player.x += player.vx;
    // Gravity and floor collision
    player.vy += 0.5;
    player.y += player.vy;
    let floorY = Math.floor(player.y / FLOOR_H) * FLOOR_H + FLOOR_H - player.h;
    let currentFloor = Math.floor((player.y + player.h) / FLOOR_H);
    if (player.vy > 0 && player.y + player.h >= currentFloor * FLOOR_H + FLOOR_H - 2) {
      player.y = currentFloor * FLOOR_H + FLOOR_H - player.h;
      player.vy = 0;
    }
    // Check elevator boarding
    if (keys['ArrowUp'] || keys['ArrowDown']) {
      for (let elev of elevators) {
        if (Math.abs(player.x + player.w/2 - (elev.x + elev.w/2)) < 35 &&
            Math.abs(player.y + player.h - (elev.y + elev.h)) < 20) {
          player.onElevator = elev;
          player.vy = 0;
          break;
        }
      }
    }
  }

  // Clamp player
  player.x = Math.max(10, Math.min(W - player.w - 10, player.x));
  if (player.invincible > 0) player.invincible--;
  if (player.shootCooldown > 0) player.shootCooldown--;

  // Shooting
  if (keys['Space'] && player.shootCooldown <= 0) {
    bullets.push({ x: player.x + (player.dir > 0 ? player.w : 0), y: player.y + 10, vx: player.dir * 7, life: 60 });
    player.shootCooldown = 15;
  }

  // Update bullets
  bullets = bullets.filter(b => { b.x += b.vx; b.life--; return b.life > 0 && b.x > 0 && b.x < W; });
  enemyBullets = enemyBullets.filter(b => { b.x += b.vx; b.y += b.vy || 0; b.life--; return b.life > 0 && b.x > 0 && b.x < W; });

  // Update elevators
  for (let elev of elevators) {
    elev.y += elev.speed * elev.dir;
    if (elev.y <= elev.minY) { elev.y = elev.minY; elev.dir = 1; }
    if (elev.y >= elev.maxY) { elev.y = elev.maxY; elev.dir = -1; }
  }

  // Update enemies
  for (let e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;
    if (e.x < 20 || e.x > W - 40) e.vx *= -1;
    e.shootTimer--;
    if (e.shootTimer <= 0) {
      let dir = player.x > e.x ? 1 : -1;
      let dy = player.y - e.y;
      if (Math.abs(dy) < FLOOR_H) {
        enemyBullets.push({ x: e.x + e.w/2, y: e.y + 10, vx: dir * 4, vy: 0, life: 90 });
      }
      e.shootTimer = 80 + Math.random() * 100;
    }
    // Bullet hit enemy
    for (let i = bullets.length - 1; i >= 0; i--) {
      if (bullets[i].x > e.x && bullets[i].x < e.x + e.w && bullets[i].y > e.y && bullets[i].y < e.y + e.h) {
        e.alive = false; bullets.splice(i, 1); score += 100; break;
      }
    }
  }

  // Enemy bullets hit player
  if (player.invincible <= 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      let b = enemyBullets[i];
      if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {
        enemyBullets.splice(i, 1); loseLife(); break;
      }
    }
    // Enemy collision
    for (let e of enemies) {
      if (!e.alive) continue;
      if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
        loseLife(); break;
      }
    }
  }

  // Collect doors
  for (let d of doors) {
    if (d.collected) continue;
    if (player.x < d.x + d.w && player.x + player.w > d.x && player.y < d.y + d.h && player.y + player.h > d.y) {
      d.collected = true; score += 500;
    }
  }

  // Check level clear - reach ground floor with all documents
  let allCollected = doors.every(d => d.collected);
  if (allCollected && player.y > (NUM_FLOORS - 1) * FLOOR_H) {
    state = 'levelclear';
  }

  // Camera scroll
  let targetScroll = player.y - H / 2;
  targetScroll = Math.max(0, Math.min(BUILDING_H - H, targetScroll));
  scrollY += (targetScroll - scrollY) * 0.1;
}

function loseLife() {
  lives--;
  if (lives <= 0) { state = 'gameover'; return; }
  player.invincible = 120;
  player.x = 60; player.y = (NUM_FLOORS - 1) * FLOOR_H + FLOOR_H - 30;
  player.onElevator = null; player.vy = 0;
}

function draw() {
  ctx.fillStyle = '#0a0a15';
  ctx.fillRect(0, 0, W, H);

  if (state === 'title') { drawTitle(); return; }
  if (state === 'gameover') { drawGameOver(); return; }
  if (state === 'levelclear') { drawLevelClear(); return; }

  ctx.save();
  ctx.translate(0, -scrollY);

  // Draw floors
  for (let i = 0; i < NUM_FLOORS; i++) {
    let fy = i * FLOOR_H;
    ctx.fillStyle = floors[i].color;
    ctx.fillRect(0, fy, W, FLOOR_H);
    ctx.fillStyle = '#444';
    ctx.fillRect(0, fy + FLOOR_H - 4, W, 4);
    // Floor number
    ctx.fillStyle = '#666';
    ctx.font = '12px monospace';
    ctx.fillText((NUM_FLOORS - i) + 'F', 5, fy + 15);
  }

  // Draw elevators
  for (let elev of elevators) {
    ctx.fillStyle = '#556';
    ctx.fillRect(elev.x - 3, elev.minY, elev.w + 6, elev.maxY - elev.minY + FLOOR_H);
    ctx.fillStyle = '#8af';
    ctx.fillRect(elev.x, elev.y, elev.w, elev.h);
    ctx.fillStyle = '#68c';
    ctx.fillRect(elev.x + 2, elev.y + 2, elev.w - 4, elev.h - 4);
  }

  // Draw doors
  for (let d of doors) {
    if (d.collected) continue;
    ctx.fillStyle = '#e33';
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = '#a11';
    ctx.fillRect(d.x + 3, d.y + 3, d.w - 6, d.h - 6);
    ctx.fillStyle = '#ff0';
    ctx.fillRect(d.x + d.w - 7, d.y + d.h/2 - 2, 4, 4);
  }

  // Draw enemies
  for (let e of enemies) {
    if (!e.alive) continue;
    ctx.fillStyle = '#e55';
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x + 4, e.y + 4, 5, 5);
    ctx.fillRect(e.x + 12, e.y + 4, 5, 5);
    ctx.fillStyle = '#a33';
    ctx.fillRect(e.x + 2, e.y + e.h - 8, e.w - 4, 8);
  }

  // Draw player
  if (player.invincible <= 0 || Math.floor(player.invincible / 4) % 2 === 0) {
    ctx.fillStyle = '#4cf';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 4, player.y + 4, 5, 5);
    ctx.fillRect(player.x + 12, player.y + 4, 5, 5);
    ctx.fillStyle = '#2a8';
    ctx.fillRect(player.x + (player.dir > 0 ? player.w - 4 : 0), player.y + 10, 6, 4);
  }

  // Draw bullets
  ctx.fillStyle = '#ff0';
  for (let b of bullets) ctx.fillRect(b.x - 3, b.y - 1, 6, 3);
  ctx.fillStyle = '#f80';
  for (let b of enemyBullets) ctx.fillRect(b.x - 3, b.y - 1, 6, 3);

  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, 30);
  ctx.fillStyle = '#fff';
  ctx.font = '14px monospace';
  ctx.fillText('分数: ' + score, 10, 20);
  ctx.fillText('生命: ' + '♥'.repeat(lives), 150, 20);
  ctx.fillText('时间: ' + timer + 's', 300, 20);
  ctx.fillText('关卡: ' + level, 430, 20);
  let collected = doors.filter(d => d.collected).length;
  ctx.fillText('文件: ' + collected + '/' + doors.length, 550, 20);
  ctx.fillStyle = '#888';
  ctx.fillText('方向键移动 空格射击 ↑↓乘电梯', 10, H - 10);
}

function drawTitle() {
  ctx.fillStyle = '#0af';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('电梯行动', W/2, 150);
  ctx.fillStyle = '#888';
  ctx.font = '18px monospace';
  ctx.fillText('ELEVATOR ACTION', W/2, 190);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('你是一名间谍，潜入大楼窃取机密文件', W/2, 250);
  ctx.fillText('收集所有红色文件后到达底层即可过关', W/2, 280);
  ctx.fillText('← → 移动 | ↑ ↓ 乘坐电梯 | 空格 射击', W/2, 320);
  ctx.fillStyle = '#ff0';
  ctx.font = '20px monospace';
  ctx.fillText('按 ENTER 开始游戏', W/2, 400);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.fillStyle = '#f33';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('游戏结束', W/2, 180);
  ctx.fillStyle = '#fff';
  ctx.font = '24px monospace';
  ctx.fillText('最终分数: ' + score, W/2, 250);
  ctx.fillText('到达关卡: ' + level, W/2, 290);
  ctx.fillStyle = '#ff0';
  ctx.font = '18px monospace';
  ctx.fillText('按 ENTER 重新开始', W/2, 380);
  ctx.textAlign = 'left';
}

function drawLevelClear() {
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 40px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('关卡 ' + level + ' 完成!', W/2, 180);
  ctx.fillStyle = '#fff';
  ctx.font = '22px monospace';
  ctx.fillText('分数: ' + score, W/2, 240);
  ctx.fillText('奖励: +' + timer * 10, W/2, 280);
  ctx.fillStyle = '#ff0';
  ctx.font = '18px monospace';
  ctx.fillText('按 ENTER 进入下一关', W/2, 370);
  ctx.textAlign = 'left';
}

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); }
  if (e.code === 'Enter') {
    if (state === 'title') { state = 'playing'; score = 0; lives = 3; level = 1; initLevel(); }
    else if (state === 'gameover') { state = 'title'; }
    else if (state === 'levelclear') { score += timer * 10; level++; initLevel(); state = 'playing'; }
  }
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
