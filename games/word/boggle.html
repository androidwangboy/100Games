function generateGrid() {
  grid = [];
  let shuffledDice = [...DICE].sort(() => Math.random() - 0.5);
  for (let i = 0; i < 16; i++) {
    let die = shuffledDice[i];
    let letter = die[Math.floor(Math.random() * 6)].toLowerCase();
    grid.push({ letter: letter, row: Math.floor(i / 4), col: i % 4 });
  }
}

function isAdjacent(a, b) {
  let dr = Math.abs(grid[a].row - grid[b].row);
  let dc = Math.abs(grid[a].col - grid[b].col);
  return dr <= 1 && dc <= 1 && (dr + dc > 0);
}

function getCellAt(x, y) {
  for (let i = 0; i < 16; i++) {
    let cx = GRID_X + grid[i].col * CELL;
    let cy = GRID_Y + grid[i].row * CELL;
    if (x >= cx && x < cx + CELL && y >= cy && y < cy + CELL) return i;
  }
  return -1;
}

function startGame() {
  score = 0; timeLeft = 180; foundWords = []; currentPath = [];
  message = ''; msgTimer = 0;
  generateGrid();
  state = 'playing';
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state === 'playing') {
      timeLeft--;
      if (timeLeft <= 0) { timeLeft = 0; state = 'gameover'; clearInterval(timerInterval); }
    }
  }, 1000);
}

function submitWord() {
  if (currentPath.length < 3) { currentPath = []; return; }
  let word = currentPath.map(i => grid[i].letter).join('');
  if (foundWords.includes(word)) { showMsg('已找到过!'); currentPath = []; return; }
  if (!DICT.has(word)) { showMsg('无效单词: ' + word); currentPath = []; return; }
  foundWords.push(word);
  let len = word.length;
  let pts = len <= 4 ? 1 : len === 5 ? 2 : len === 6 ? 3 : 5;
  score += pts;
  showMsg(word + ' +' + pts);
  currentPath = [];
}

function showMsg(msg) { message = msg; msgTimer = 90; }

canvas.addEventListener('mousedown', e => {
  if (state !== 'playing') return;
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (W / rect.width);
  let y = (e.clientY - rect.top) * (H / rect.height);
  let cell = getCellAt(x, y);
  if (cell >= 0) { selecting = true; currentPath = [cell]; }
});

canvas.addEventListener('mousemove', e => {
  let rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  mouseY = (e.clientY - rect.top) * (H / rect.height);
  if (!selecting || state !== 'playing') return;
  let cell = getCellAt(mouseX, mouseY);
  if (cell >= 0 && !currentPath.includes(cell)) {
    let last = currentPath[currentPath.length - 1];
    if (isAdjacent(last, cell)) currentPath.push(cell);
  }
});

canvas.addEventListener('mouseup', () => {
  if (selecting) { selecting = false; submitWord(); }
});

document.addEventListener('keydown', e => {
  if (state === 'title' || state === 'gameover') {
    if (e.code === 'Enter') startGame();
  }
});

function draw() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  if (state === 'title') { drawTitle(); return; }
  if (state === 'gameover') { drawGameOver(); return; }

  // Header
  ctx.fillStyle = '#58a6ff';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('字母网格', 20, 35);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('分数: ' + score, 180, 35);
  ctx.fillStyle = timeLeft <= 30 ? '#f44' : '#8f8';
  let min = Math.floor(timeLeft / 60), sec = timeLeft % 60;
  ctx.fillText('时间: ' + min + ':' + (sec < 10 ? '0' : '') + sec, 320, 35);
  ctx.fillStyle = '#aaa';
  ctx.fillText('单词: ' + foundWords.length, 480, 35);

  // Current word display
  let curWord = currentPath.map(i => grid[i].letter).join('').toUpperCase();
  ctx.fillStyle = '#ff0';
  ctx.font = 'bold 20px monospace';
  ctx.fillText(curWord, GRID_X, GRID_Y - 15);

  // Draw grid
  for (let i = 0; i < 16; i++) {
    let cx = GRID_X + grid[i].col * CELL;
    let cy = GRID_Y + grid[i].row * CELL;
    let inPath = currentPath.includes(i);
    let pathIdx = currentPath.indexOf(i);

    ctx.fillStyle = inPath ? '#2d5a27' : '#1c2333';
    ctx.fillRect(cx + 2, cy + 2, CELL - 4, CELL - 4);
    ctx.strokeStyle = inPath ? '#4caf50' : '#3a4a5a';
    ctx.lineWidth = inPath ? 3 : 1;
    ctx.strokeRect(cx + 2, cy + 2, CELL - 4, CELL - 4);

    if (inPath) {
      ctx.fillStyle = '#4caf50';
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(pathIdx + 1, cx + CELL/2, cy + 15);
    }

    ctx.fillStyle = inPath ? '#fff' : '#cde';
    ctx.font = 'bold 30px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(grid[i].letter.toUpperCase(), cx + CELL/2, cy + CELL/2 + 10);
  }

  // Draw path lines
  if (currentPath.length > 1) {
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < currentPath.length; i++) {
      let cx = GRID_X + grid[currentPath[i]].col * CELL + CELL/2;
      let cy = GRID_Y + grid[currentPath[i]].row * CELL + CELL/2;
      if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  // Message
  if (msgTimer > 0) {
    msgTimer--;
    ctx.fillStyle = '#ff0';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(message, GRID_X, GRID_Y + GRID_SIZE * CELL + 25);
  }

  // Found words panel
  ctx.textAlign = 'left';
  ctx.fillStyle = '#888';
  ctx.font = '14px monospace';
  let panelX = GRID_X + GRID_SIZE * CELL + 40;
  ctx.fillText('已找到的单词:', panelX, GRID_Y);
  ctx.fillStyle = '#cde';
  let sorted = [...foundWords].sort((a, b) => b.length - a.length || a.localeCompare(b));
  for (let i = 0; i < sorted.length && i < 18; i++) {
    let pts = sorted[i].length <= 4 ? 1 : sorted[i].length === 5 ? 2 : sorted[i].length === 6 ? 3 : 5;
    ctx.fillText(sorted[i] + ' (+' + pts + ')', panelX, GRID_Y + 22 + i * 20);
  }
  if (sorted.length > 18) {
    ctx.fillStyle = '#666';
    ctx.fillText('...+' + (sorted.length - 18) + ' 更多', panelX, GRID_Y + 22 + 18 * 20);
  }

  // Instructions
  ctx.fillStyle = '#555';
  ctx.font = '13px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('点击并拖动相邻字母组成单词 (3+字母)，松开提交', 20, H - 12);
  ctx.textAlign = 'left';
}

function drawTitle() {
  // Decorative grid background
  ctx.globalAlpha = 0.1;
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      ctx.strokeStyle = '#58a6ff';
      ctx.strokeRect(250 + c * 80, 50 + r * 80, 70, 70);
    }
  }
  ctx.globalAlpha = 1;
  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#58a6ff';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('字母网格', W/2, 120);
  ctx.fillStyle = '#888';
  ctx.font = '18px monospace';
  ctx.fillText('BOGGLE', W/2, 155);
  // Rules
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('在4x4字母网格中找出尽可能多的英文单词', W/2, 210);
  ctx.fillText('点击拖动连接相邻字母（横、竖、斜均可）', W/2, 240);
  ctx.fillText('每个字母只能使用一次，单词至少3个字母', W/2, 270);
  // Scoring
  ctx.fillStyle = '#aaa';
  ctx.font = '14px monospace';
  ctx.fillText('计分规则:', W/2, 310);
  ctx.fillStyle = '#cde';
  ctx.fillText('3-4字母 = 1分 | 5字母 = 2分 | 6字母 = 3分 | 7+字母 = 5分', W/2, 335);
  ctx.fillStyle = '#fa0';
  ctx.fillText('限时3分钟，找出越多单词分数越高', W/2, 365);
  ctx.fillStyle = '#888';
  ctx.fillText('提示: 尝试从每个字母开始向各方向延伸', W/2, 395);
  // Start
  ctx.fillStyle = '#ff0';
  ctx.font = '20px monospace';
  ctx.fillText('按 ENTER 开始游戏', W/2, 440);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 44px monospace';
  ctx.fillText('时间到!', W/2, 90);
  ctx.fillStyle = '#fff';
  ctx.font = '26px monospace';
  ctx.fillText('最终分数: ' + score, W/2, 145);
  ctx.font = '20px monospace';
  ctx.fillText('找到单词: ' + foundWords.length + ' 个', W/2, 185);
  // Word length breakdown
  let len3 = foundWords.filter(w => w.length <= 4).length;
  let len5 = foundWords.filter(w => w.length === 5).length;
  let len6 = foundWords.filter(w => w.length === 6).length;
  let len7 = foundWords.filter(w => w.length >= 7).length;
  ctx.fillStyle = '#aaa';
  ctx.font = '14px monospace';
  ctx.fillText('3-4字母: ' + len3 + ' | 5字母: ' + len5 + ' | 6字母: ' + len6 + ' | 7+: ' + len7, W/2, 220);
  // Show words
  ctx.fillStyle = '#8f8';
  ctx.font = '14px monospace';
  let sorted = [...foundWords].sort((a, b) => b.length - a.length);
  let display = sorted.slice(0, 10).join(', ');
  ctx.fillText('最长: ' + (display || '无'), W/2, 255);
  if (sorted.length > 10) {
    ctx.fillStyle = '#6a6';
    ctx.fillText(sorted.slice(10, 20).join(', '), W/2, 280);
  }
  if (sorted.length > 20) {
    ctx.fillStyle = '#486';
    ctx.fillText(sorted.slice(20, 30).join(', '), W/2, 305);
  }
  // Rating
  ctx.fillStyle = '#fa0';
  ctx.font = '18px monospace';
  let rating = score >= 30 ? '词汇大师!' : score >= 20 ? '很厉害!' : score >= 10 ? '不错!' : '继续加油!';
  ctx.fillText('评价: ' + rating, W/2, 350);
  ctx.fillStyle = '#ff0';
  ctx.font = '20px monospace';
  ctx.fillText('按 ENTER 重新开始', W/2, 420);
  ctx.textAlign = 'left';
}

function gameLoop() {
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>

</html>
