const KEYBOARD = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','DEL']
];

let keyColors = {};
let flipAnims = [];
let titleAnim = 0;

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); return; }
  if (state === 'title') { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  if (state === 'gameover') { if (e.code === 'Space' || e.code === 'Enter') startGame(); return; }
  if (state !== 'playing') return;

  if (e.code === 'Enter') { submitGuess(); return; }
  if (e.code === 'Backspace') { currentGuess = currentGuess.slice(0, -1); return; }
  if (/^[a-zA-Z]$/.test(e.key)) {
    if (currentGuess.length < 5) currentGuess += e.key.toUpperCase();
  }
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  if (state === 'title') { startGame(); return; }
  if (state === 'gameover') { startGame(); return; }
  if (state !== 'playing') return;

  const kbY = 340, kbH = 38, kbGap = 6;
  for (let row = 0; row < KEYBOARD.length; row++) {
    const keys = KEYBOARD[row];
    const totalW = keys.reduce((s, k) => s + (k.length > 1 ? 58 : 38) + kbGap, 0);
    let kx = (W - totalW) / 2;
    const ky = kbY + row * (kbH + kbGap);
    for (const key of keys) {
      const kw = key.length > 1 ? 58 : 38;
      if (mx >= kx && mx <= kx + kw && my >= ky && my <= ky + kbH) {
        if (key === 'ENTER') submitGuess();
        else if (key === 'DEL') currentGuess = currentGuess.slice(0, -1);
        else if (currentGuess.length < 5) currentGuess += key;
        return;
      }
      kx += kw + kbGap;
    }
  }
});

function startGame() {
  state = 'playing';
  answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)].toUpperCase();
  guesses = []; currentGuess = ''; currentRow = 0;
  gameOver = false; won = false;
  keyColors = {}; flipAnims = []; message = ''; messageTimer = 0;
  shakeTimer = 0;
}

function submitGuess() {
  if (currentGuess.length !== 5) { shakeTimer = 15; message = '需要5个字母'; messageTimer = 60; return; }
  if (!VALID.has(currentGuess.toLowerCase())) { shakeTimer = 15; message = '不在词库中'; messageTimer = 60; return; }

  const result = evaluateGuess(currentGuess, answer);
  guesses.push({ word: currentGuess, result });

  for (let i = 0; i < 5; i++) {
    const ch = currentGuess[i];
    if (result[i] === 'correct') keyColors[ch] = 'correct';
    else if (result[i] === 'present' && keyColors[ch] !== 'correct') keyColors[ch] = 'present';
    else if (!keyColors[ch]) keyColors[ch] = 'absent';
    flipAnims.push({ row: currentRow, col: i, timer: i * 12, done: false });
  }

  if (currentGuess === answer) {
    won = true; gameOver = true;
    wins++; streak++;
    if (streak > bestStreak) bestStreak = streak;
    score += (6 - currentRow) * 100 + streak * 50;
    message = ['天才!','太棒了!','厉害!','不错!','勉强!', '惊险!'][currentRow];
    messageTimer = 120;
    setTimeout(() => { state = 'gameover'; }, 2000);
  } else if (currentRow >= 5) {
    gameOver = true; won = false; losses++; streak = 0;
    message = `答案: ${answer}`;
    messageTimer = 180;
    setTimeout(() => { state = 'gameover'; }, 2500);
  }

  currentGuess = '';
  currentRow++;
}

function evaluateGuess(guess, ans) {
  const result = Array(5).fill('absent');
  const ansArr = ans.split('');
  const used = Array(5).fill(false);

  for (let i = 0; i < 5; i++) {
    if (guess[i] === ansArr[i]) { result[i] = 'correct'; used[i] = true; }
  }
  for (let i = 0; i < 5; i++) {
    if (result[i] === 'correct') continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guess[i] === ansArr[j]) { result[i] = 'present'; used[j] = true; break; }
    }
  }
  return result;
}

function update() {
  titleAnim++;
  if (shakeTimer > 0) shakeTimer--;
  if (messageTimer > 0) messageTimer--;
  for (const fa of flipAnims) { if (fa.timer > 0) fa.timer--; else fa.done = true; }
}

function getColor(type) {
  if (type === 'correct') return '#6aaa64';
  if (type === 'present') return '#c9b458';
  return '#3a3a3c';
}

function drawGrid() {
  const cellSize = 52, gap = 6;
  const gridW = 5 * (cellSize + gap) - gap;
  const startX = (W - gridW) / 2;
  const startY = 25;

  for (let row = 0; row < 6; row++) {
    const shake = (row === currentRow && shakeTimer > 0) ? Math.sin(shakeTimer * 2) * 4 : 0;
    for (let col = 0; col < 5; col++) {
      const x = startX + col * (cellSize + gap) + shake;
      const y = startY + row * (cellSize + gap);

      let bgColor = '#1a1a1b', borderColor = '#3a3a3c';
      let letter = '', textColor = '#fff';

      if (row < guesses.length) {
        const g = guesses[row];
        letter = g.word[col];
        const fa = flipAnims.find(f => f.row === row && f.col === col);
        if (fa && !fa.done) {
          bgColor = '#1a1a1b'; borderColor = '#565758';
        } else {
          bgColor = getColor(g.result[col]);
          borderColor = bgColor;
        }
      } else if (row === currentRow && col < currentGuess.length) {
        letter = currentGuess[col];
        borderColor = '#565758';
      }

      ctx.fillStyle = bgColor;
      ctx.fillRect(x, y, cellSize, cellSize);
      ctx.strokeStyle = borderColor; ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cellSize, cellSize);

      if (letter) {
        ctx.fillStyle = textColor; ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(letter, x + cellSize / 2, y + cellSize / 2 + 1);
      }
    }
  }
  ctx.textBaseline = 'alphabetic';
}

function drawKeyboard() {
  const kbY = 340, kbH = 38, kbGap = 6;
  for (let row = 0; row < KEYBOARD.length; row++) {
    const keys = KEYBOARD[row];
    const totalW = keys.reduce((s, k) => s + (k.length > 1 ? 58 : 38) + kbGap, 0);
    let kx = (W - totalW) / 2;
    const ky = kbY + row * (kbH + kbGap);

    for (const key of keys) {
      const kw = key.length > 1 ? 58 : 38;
      let bg = '#818384';
      if (keyColors[key]) bg = getColor(keyColors[key]);
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.roundRect(kx, ky, kw, kbH, 5); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = key.length > 1 ? 'bold 11px sans-serif' : 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(key === 'DEL' ? '⌫' : key, kx + kw / 2, ky + kbH / 2 + 5);
      kx += kw + kbGap;
    }
  }
}

function drawMessage() {
  if (messageTimer > 0 && message) {
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    const tw = ctx.measureText(message).width + 30;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, H / 2 - 60, tw, 36, 6); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.fillText(message, W / 2, H / 2 - 37);
  }
}

function drawTitle() {
  ctx.fillStyle = '#121213'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6aaa64'; ctx.font = 'bold 50px sans-serif';
  ctx.fillText('猜单词 WORDLE', W / 2, H / 2 - 80);
  ctx.fillStyle = '#d3d6da'; ctx.font = '20px sans-serif';
  ctx.fillText('猜出隐藏的5字母英文单词', W / 2, H / 2 - 25);
  ctx.fillText('绿色=位置正确 黄色=字母存在 灰色=不存在', W / 2, H / 2 + 10);
  ctx.fillText('共6次机会', W / 2, H / 2 + 45);
  ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 22px sans-serif';
  ctx.fillText('点击或按空格开始', W / 2, H / 2 + 100);
  if (wins + losses > 0) {
    ctx.fillStyle = '#818384'; ctx.font = '16px sans-serif';
    ctx.fillText(`胜: ${wins} 负: ${losses} 连胜: ${streak} 最佳连胜: ${bestStreak}`, W / 2, H / 2 + 145);
  }
}

function drawGameOverScreen() {
  ctx.fillStyle = '#121213'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (won) {
    ctx.fillStyle = '#6aaa64'; ctx.font = 'bold 44px sans-serif';
    ctx.fillText('🎉 恭喜猜中!', W / 2, H / 2 - 60);
  } else {
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 44px sans-serif';
    ctx.fillText('游戏结束', W / 2, H / 2 - 60);
  }
  ctx.fillStyle = '#d3d6da'; ctx.font = '24px sans-serif';
  ctx.fillText(`答案: ${answer}`, W / 2, H / 2 - 5);
  ctx.fillText(`用了 ${Math.min(currentRow, 6)} 次猜测`, W / 2, H / 2 + 35);
  ctx.fillStyle = '#f1c40f'; ctx.font = '20px sans-serif';
  ctx.fillText(`分数: ${score}`, W / 2, H / 2 + 80);
  ctx.fillStyle = '#818384'; ctx.font = '18px sans-serif';
  ctx.fillText('点击或按空格再来一局', W / 2, H / 2 + 130);
}

function render() {
  if (state === 'title') { drawTitle(); return; }
  if (state === 'gameover') { drawGameOverScreen(); return; }
  ctx.fillStyle = '#121213'; ctx.fillRect(0, 0, W, H);
  drawGrid();
  drawKeyboard();
  drawMessage();
}

function loop() { update(); render(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
