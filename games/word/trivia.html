function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame(category) {
  chosenCategory = category;
  let pool = category === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.cat === category);
  pool = shuffleArray(pool);
  // Sort by difficulty for progression
  pool.sort((a, b) => a.diff - b.diff);
  questions = pool.slice(0, Math.min(totalQ, pool.length));
  // Shuffle options for each question
  questions = questions.map(q => {
    const indices = [0, 1, 2, 3];
    const shuffled = shuffleArray(indices);
    return {
      ...q,
      opts: shuffled.map(i => q.opts[i]),
      ans: shuffled.indexOf(q.ans)
    };
  });
  currentQ = 0; correct = 0; streak = 0; bestStreak = 0; score = 0;
  answered = false; selectedAnswer = -1; showCorrect = false;
  state = 'playing';
  startTimer();
}

function startTimer() {
  timeLeft = 15;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeUp();
    }
  }, 1000);
}

function timeUp() {
  answered = true;
  showCorrect = true;
  streak = 0;
  message = '时间到!';
  state = 'answer';
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  selectedAnswer = idx;
  showCorrect = true;
  clearInterval(timerInterval);
  const q = questions[currentQ];
  if (idx === q.ans) {
    correct++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    const bonus = Math.min(streak - 1, 5) * 5;
    const timeBonus = timeLeft * 2;
    const diffBonus = q.diff * 10;
    score += 10 + bonus + timeBonus + diffBonus;
    message = '正确! +' + (10 + bonus + timeBonus + diffBonus) + '分' + (streak > 1 ? ' (连击x' + streak + ')' : '');
  } else {
    streak = 0;
    message = '错误! 正确答案: ' + q.opts[q.ans];
  }
  state = 'answer';
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    if (score > highScore) { highScore = score; localStorage.setItem('trivia_high', '' + highScore); }
    state = 'result';
    return;
  }
  answered = false;
  selectedAnswer = -1;
  showCorrect = false;
  message = '';
  state = 'playing';
  startTimer();
}

function drawBtn(x, y, w, h, text, id, color) {
  const hover = btnHover === id;
  ctx.fillStyle = hover ? (color || '#4a9') : '#2a2a3e';
  ctx.strokeStyle = color || '#4a9';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 6);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = hover ? '#111' : '#eee';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w/2, y + h/2);
  ctx.textBaseline = 'alphabetic';
}

function drawTitle() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 48px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('知识问答', W/2, 120);
  ctx.fillStyle = '#aaa';
  ctx.font = '20px sans-serif';
  ctx.fillText('Trivia Quiz', W/2, 160);
  // Decorative question marks
  ctx.fillStyle = '#333';
  ctx.font = 'bold 80px sans-serif';
  ctx.fillText('?', 150, 300);
  ctx.fillText('?', 650, 250);
  ctx.fillText('!', 100, 180);
  ctx.fillStyle = '#888';
  ctx.font = '14px sans-serif';
  ctx.fillText('50+题目 | 科学·历史·地理·文化 | 15秒限时', W/2, 280);
  ctx.fillText('连续答对获得连击奖励，难度递增', W/2, 310);
  ctx.fillStyle = '#c9a227';
  ctx.font = '16px sans-serif';
  ctx.fillText('最高分: ' + highScore, W/2, 350);
  drawBtn(W/2 - 80, 390, 160, 45, '开始游戏', 'start', '#e94560');
}

function drawCategory() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('选择题目类别', W/2, 80);
  CATEGORIES.forEach((cat, i) => {
    const x = W/2 - 120, y = 120 + i * 65;
    const hover = btnHover === 'cat_' + cat.id;
    ctx.fillStyle = hover ? cat.color : '#2a2a3e';
    ctx.strokeStyle = cat.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, 240, 50, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = hover ? '#111' : '#eee';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(cat.name, x + 120, y + 30);
    const count = cat.id === 'all' ? ALL_QUESTIONS.length : ALL_QUESTIONS.filter(q => q.cat === cat.id).length;
    ctx.font = '12px sans-serif';
    ctx.fillStyle = hover ? '#333' : '#888';
    ctx.fillText(count + '题', x + 120, y + 45);
  });
}

function drawPlaying() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, W, H);
  const q = questions[currentQ];
  // Header
  ctx.fillStyle = '#fff';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('第 ' + (currentQ + 1) + '/' + questions.length + ' 题', 30, 30);
  ctx.textAlign = 'right';
  ctx.fillText('得分: ' + score, W - 30, 30);
  if (streak > 1) {
    ctx.fillStyle = '#f39c12';
    ctx.fillText('连击 x' + streak, W - 30, 52);
  }
  // Timer bar
  const tw = (W - 60) * (timeLeft / 15);
  ctx.fillStyle = '#333';
  ctx.fillRect(30, 45, W - 60, 8);
  ctx.fillStyle = timeLeft > 5 ? '#2ecc71' : '#e74c3c';
  ctx.fillRect(30, 45, tw, 8);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(timeLeft + 's', W/2, 72);
  // Category badge
  const catInfo = CATEGORIES.find(c => c.id === q.cat);
  ctx.fillStyle = catInfo ? catInfo.color : '#888';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('[' + (catInfo ? catInfo.name : '') + '] 难度' + '★'.repeat(q.diff), 30, 95);
  // Question
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  const words = q.q;
  ctx.fillText(words, W/2, 140);
  // Options
  const optW = 340, optH = 50;
  q.opts.forEach((opt, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const x = 60 + col * (optW + 40), y = 180 + row * 70;
    let bg = '#2a2a3e', border = '#555';
    if (showCorrect) {
      if (i === q.ans) { bg = '#1a5c2a'; border = '#2ecc71'; }
      else if (i === selectedAnswer) { bg = '#5c1a1a'; border = '#e74c3c'; }
    } else if (btnHover === 'opt_' + i) { bg = '#3a3a5e'; border = '#4a9'; }
    ctx.fillStyle = bg;
    ctx.strokeStyle = border;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, optW, optH, 6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(String.fromCharCode(65 + i) + '. ' + opt, x + 15, y + optH/2 + 5);
  });
  // Message
  if (message) {
    ctx.fillStyle = message.includes('正确') ? '#2ecc71' : '#e74c3c';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(message, W/2, 370);
  }
  if (state === 'answer') {
    drawBtn(W/2 - 70, 400, 140, 40, currentQ < questions.length - 1 ? '下一题' : '查看结果', 'next', '#4a9');
  }
}

function drawResult() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  const pct = Math.round(correct / questions.length * 100);
  let rating = pct >= 90 ? '天才!' : pct >= 70 ? '博学!' : pct >= 50 ? '不错!' : pct >= 30 ? '继续学习!' : '再接再厉!';
  ctx.fillStyle = pct >= 70 ? '#4f4' : pct >= 50 ? '#ff0' : '#f66';
  ctx.font = 'bold 38px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(rating, W/2, 100);
  ctx.fillStyle = '#fff';
  ctx.font = '22px sans-serif';
  ctx.fillText('最终得分: ' + score, W/2, 170);
  ctx.font = '18px sans-serif';
  ctx.fillStyle = '#ccc';
  ctx.fillText('正确: ' + correct + '/' + questions.length + ' (' + pct + '%)', W/2, 220);
  ctx.fillText('最高连击: ' + bestStreak, W/2, 255);
  ctx.fillStyle = '#c9a227';
  ctx.fillText('历史最高: ' + highScore, W/2, 300);
  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#f39c12';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('新纪录!', W/2, 330);
  }
  // Stats bar
  ctx.fillStyle = '#333';
  ctx.fillRect(200, 350, 400, 20);
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(200, 350, 400 * pct / 100, 20);
  ctx.strokeStyle = '#555';
  ctx.strokeRect(200, 350, 400, 20);
  drawBtn(W/2 - 170, 400, 150, 40, '再来一局', 'restart', '#4a9');
  drawBtn(W/2 + 20, 400, 150, 40, '返回标题', 'title', '#666');
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (state === 'title') {
    if (mx > W/2-80 && mx < W/2+80 && my > 390 && my < 435) state = 'category';
    return;
  }
  if (state === 'category') {
    CATEGORIES.forEach((cat, i) => {
      const x = W/2 - 120, y = 120 + i * 65;
      if (mx > x && mx < x + 240 && my > y && my < y + 50) startGame(cat.id);
    });
    return;
  }
  if (state === 'playing') {
    const optW = 340, optH = 50;
    for (let i = 0; i < 4; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const x = 60 + col * (optW + 40), y = 180 + row * 70;
      if (mx > x && mx < x + optW && my > y && my < y + optH) { selectAnswer(i); return; }
    }
    return;
  }
  if (state === 'answer') {
    if (mx > W/2-70 && mx < W/2+70 && my > 400 && my < 440) nextQuestion();
    return;
  }
  if (state === 'result') {
    if (mx > W/2-170 && mx < W/2-20 && my > 400 && my < 440) state = 'category';
    if (mx > W/2+20 && mx < W/2+170 && my > 400 && my < 440) state = 'title';
    return;
  }
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  btnHover = '';
  if (state === 'title' && mx > W/2-80 && mx < W/2+80 && my > 390 && my < 435) btnHover = 'start';
  if (state === 'category') {
    CATEGORIES.forEach((cat, i) => {
      const x = W/2 - 120, y = 120 + i * 65;
      if (mx > x && mx < x + 240 && my > y && my < y + 50) btnHover = 'cat_' + cat.id;
    });
  }
  if (state === 'playing') {
    const optW = 340, optH = 50;
    for (let i = 0; i < 4; i++) {
      const col = i % 2, row = Math.floor(i / 2);
      const x = 60 + col * (optW + 40), y = 180 + row * 70;
      if (mx > x && mx < x + optW && my > y && my < y + optH) btnHover = 'opt_' + i;
    }
  }
  if (state === 'answer' && mx > W/2-70 && mx < W/2+70 && my > 400 && my < 440) btnHover = 'next';
  if (state === 'result') {
    if (mx > W/2-170 && mx < W/2-20 && my > 400 && my < 440) btnHover = 'restart';
    if (mx > W/2+20 && mx < W/2+170 && my > 400 && my < 440) btnHover = 'title';
  }
});

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { parent.postMessage({type:'EXIT_GAME', score: score}, '*'); return; }
  if (state === 'playing' && !answered) {
    if (e.key === '1' || e.key === 'a' || e.key === 'A') selectAnswer(0);
    if (e.key === '2' || e.key === 'b' || e.key === 'B') selectAnswer(1);
    if (e.key === '3' || e.key === 'c' || e.key === 'C') selectAnswer(2);
    if (e.key === '4' || e.key === 'd' || e.key === 'D') selectAnswer(3);
  }
  if (state === 'answer' && (e.code === 'Space' || e.code === 'Enter')) nextQuestion();
});

function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') drawTitle();
  else if (state === 'category') drawCategory();
  else if (state === 'playing' || state === 'answer') drawPlaying();
  else if (state === 'result') drawResult();
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
