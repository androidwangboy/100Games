const LETTER_FREQ = 'eeeeeeeeeettttttttaaaaaaaaooooooooiiiiiiiinnnnnnnnssssssssrrrrrrrrllllllllccccccdddddduuuuuummmmmmpppppfffgggghhhhbbkkvvwwyyxjzq';

function generateLetters() {
  letters = [];
  // Ensure at least 2 vowels
  const vowels = 'aeiou';
  for (let i = 0; i < 2; i++) letters.push(vowels[Math.floor(Math.random() * 5)]);
  for (let i = 2; i < 6; i++) letters.push(LETTER_FREQ[Math.floor(Math.random() * LETTER_FREQ.length)]);
  // Shuffle
  for (let i = letters.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
}

function canForm(word, avail) {
  let pool = [...avail];
  for (let ch of word) {
    let idx = pool.indexOf(ch);
    if (idx === -1) return false;
    pool.splice(idx, 1);
  }
  return true;
}

function startGame() {
  score = 0; timeLeft = 90; streak = 0; bestStreak = 0;
  foundWords = []; input = ''; message = ''; msgTimer = 0;
  shuffleCount = 0; totalAttempts = 0;
  generateLetters();
  state = 'playing';
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state === 'playing') {
      timeLeft--;
      if (timeLeft <= 0) { timeLeft = 0; state = 'gameover'; clearInterval(timerInterval); }
    }
  }, 1000);
}

function submitWord() {
  let word = input.toLowerCase().trim();
  totalAttempts++;
  if (word.length < 3) { showMsg('单词至少3个字母!'); streak = 0; input = ''; return; }
  if (foundWords.includes(word)) { showMsg('已经找过了!'); streak = 0; input = ''; return; }
  if (!canForm(word, letters)) { showMsg('无法用这些字母拼出!'); streak = 0; input = ''; return; }
  if (!DICT.has(word)) { showMsg('不在词典中!'); streak = 0; input = ''; return; }
  // Valid word
  foundWords.push(word);
  let pts = word.length <= 3 ? 10 : word.length === 4 ? 20 : word.length === 5 ? 40 : 70;
  streak++;
  if (streak > bestStreak) bestStreak = streak;
  let bonus = streak >= 3 ? streak * 5 : 0;
  score += pts + bonus;
  if (word.length === 6) { score += 50; showMsg('六字母奖励 +50!  +' + (pts + bonus + 50)); }
  else showMsg('+' + (pts + bonus) + (bonus > 0 ? ' (连击x' + streak + ')' : ''));
  input = '';
}

function showMsg(msg) { message = msg; msgTimer = 90; }

document.addEventListener('keydown', e => {
  if (state === 'title' || state === 'gameover') {
    if (e.code === 'Enter') startGame();
    return;
  }
  if (state !== 'playing') return;
  if (e.code === 'Enter') { submitWord(); }
  else if (e.code === 'Backspace') { input = input.slice(0, -1); }
  else if (e.code === 'Space') { e.preventDefault(); }
  else if (e.code === 'KeyR') {
    // Shuffle letters for a small penalty
    if (score >= 10) {
      score -= 10;
      shuffleCount++;
      generateLetters();
      input = '';
      showMsg('字母已更换 (-10分)');
    } else {
      showMsg('分数不足，无法更换!');
    }
  }
  else if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) { input += e.key.toLowerCase(); }
});

function draw() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  if (state === 'title') { drawTitle(); return; }
  if (state === 'gameover') { drawGameOver(); return; }

  // Header
  ctx.fillStyle = '#58a6ff';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('拼字竞速', 20, 35);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('分数: ' + score, 200, 35);
  ctx.fillStyle = timeLeft <= 15 ? '#f44' : '#8f8';
  ctx.fillText('时间: ' + timeLeft + 's', 350, 35);
  ctx.fillStyle = '#fa0';
  ctx.fillText('连击: ' + streak, 500, 35);
  ctx.fillStyle = '#aaa';
  ctx.fillText('最佳连击: ' + bestStreak, 630, 35);

  // Timer progress bar
  let barW = 760, barH = 6;
  let barX = 20, barY = 48;
  ctx.fillStyle = '#222';
  ctx.fillRect(barX, barY, barW, barH);
  let ratio = timeLeft / 90;
  ctx.fillStyle = ratio > 0.3 ? '#4caf50' : ratio > 0.15 ? '#ff9800' : '#f44336';
  ctx.fillRect(barX, barY, barW * ratio, barH);

  // Letters display - highlight letters used in current input
  ctx.textAlign = 'center';
  let usedIndices = [];
  let tempInput = input.split('');
  for (let ch of tempInput) {
    for (let i = 0; i < 6; i++) {
      if (letters[i] === ch && !usedIndices.includes(i)) {
        usedIndices.push(i);
        break;
      }
    }
  }
  for (let i = 0; i < 6; i++) {
    let x = 250 + i * 55, y = 70;
    let isUsed = usedIndices.includes(i);
    ctx.fillStyle = isUsed ? '#2d5a27' : '#1f3a5f';
    ctx.fillRect(x, y, 45, 45);
    ctx.strokeStyle = isUsed ? '#4caf50' : '#58a6ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, 45, 45);
    ctx.fillStyle = isUsed ? '#8f8' : '#fff';
    ctx.font = 'bold 28px monospace';
    ctx.fillText(letters[i].toUpperCase(), x + 22, y + 33);
  }

  // Input area
  ctx.fillStyle = '#161b22';
  ctx.fillRect(200, 135, 400, 40);
  ctx.strokeStyle = input.length >= 3 ? '#4caf50' : '#444';
  ctx.lineWidth = input.length >= 3 ? 2 : 1;
  ctx.strokeRect(200, 135, 400, 40);
  ctx.fillStyle = '#fff';
  ctx.font = '22px monospace';
  ctx.fillText(input + (Math.floor(Date.now()/500) % 2 === 0 ? '|' : ''), 400, 162);
  // Word length indicator
  if (input.length > 0) {
    ctx.fillStyle = input.length >= 6 ? '#f0f' : input.length >= 5 ? '#fa0' : '#888';
    ctx.font = '12px monospace';
    ctx.fillText(input.length + ' 字母', 400, 190);
  }

  // Message
  if (msgTimer > 0) {
    msgTimer--;
    ctx.fillStyle = msgTimer > 60 ? '#4f4' : '#ff0';
    ctx.font = '16px monospace';
    ctx.fillText(message, 400, 212);
  }

  // Found words list
  ctx.textAlign = 'left';
  ctx.fillStyle = '#888';
  ctx.font = '14px monospace';
  ctx.fillText('已找到的单词 (' + foundWords.length + '):', 20, 240);
  ctx.fillStyle = '#cde';
  let cols = 4, colW = 190;
  for (let i = 0; i < foundWords.length && i < 40; i++) {
    let col = Math.floor(i / 10), row = i % 10;
    let word = foundWords[i];
    // Color code by length
    ctx.fillStyle = word.length >= 6 ? '#f0f' : word.length >= 5 ? '#fa0' : '#cde';
    ctx.fillText(word, 20 + col * colW, 262 + row * 20);
  }
  if (foundWords.length > 40) {
    ctx.fillStyle = '#666';
    ctx.fillText('...还有 ' + (foundWords.length - 40) + ' 个', 20, 262 + 10 * 20);
  }

  // Instructions
  ctx.textAlign = 'center';
  ctx.fillStyle = '#555';
  ctx.font = '13px monospace';
  ctx.fillText('输入英文单词后按 Enter 提交 | 用上方6个字母拼出尽可能多的单词', 400, H - 30);
  ctx.fillText('按 R 更换字母 (扣10分) | 连续答对获得连击加分', 400, H - 12);
  ctx.textAlign = 'left';
}

function drawTitle() {
  // Decorative background letters
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#58a6ff';
  ctx.font = 'bold 60px monospace';
  for (let i = 0; i < 8; i++) {
    let lx = 50 + (i % 4) * 200;
    let ly = 80 + Math.floor(i / 4) * 250;
    ctx.fillText(String.fromCharCode(65 + Math.floor(Math.random() * 26)), lx, ly);
  }
  ctx.globalAlpha = 1;
  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#58a6ff';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('拼字竞速', W/2, 120);
  ctx.fillStyle = '#888';
  ctx.font = '18px monospace';
  ctx.fillText('SPEED WORDS', W/2, 155);
  // Rules
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('在90秒内用6个随机字母拼出尽可能多的英文单词', W/2, 210);
  ctx.fillText('单词越长分数越高，连续答对有连击奖励', W/2, 240);
  ctx.fillText('使用全部6个字母有额外50分奖励', W/2, 270);
  // Scoring table
  ctx.fillStyle = '#aaa';
  ctx.font = '14px monospace';
  ctx.fillText('计分规则:', W/2, 310);
  ctx.fillStyle = '#cde';
  ctx.fillText('3字母 = 10分 | 4字母 = 20分 | 5字母 = 40分 | 6字母 = 70+50分', W/2, 335);
  ctx.fillStyle = '#fa0';
  ctx.fillText('连击奖励: 连续3次以上每次额外 +连击数x5 分', W/2, 360);
  ctx.fillStyle = '#888';
  ctx.fillText('按 R 可更换字母 (扣10分)', W/2, 385);
  // Start prompt
  ctx.fillStyle = '#ff0';
  ctx.font = '20px monospace';
  ctx.fillText('按 ENTER 开始游戏', W/2, 435);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f44';
  ctx.font = 'bold 44px monospace';
  ctx.fillText('时间到!', W/2, 100);
  ctx.fillStyle = '#fff';
  ctx.font = '26px monospace';
  ctx.fillText('最终分数: ' + score, W/2, 160);
  ctx.font = '18px monospace';
  ctx.fillText('找到单词: ' + foundWords.length + ' 个', W/2, 200);
  ctx.fillText('最佳连击: ' + bestStreak, W/2, 230);
  ctx.fillText('更换字母: ' + shuffleCount + ' 次', W/2, 260);
  // Word length breakdown
  let len3 = foundWords.filter(w => w.length === 3).length;
  let len4 = foundWords.filter(w => w.length === 4).length;
  let len5 = foundWords.filter(w => w.length === 5).length;
  let len6 = foundWords.filter(w => w.length >= 6).length;
  ctx.fillStyle = '#aaa';
  ctx.font = '15px monospace';
  ctx.fillText('3字母: ' + len3 + ' | 4字母: ' + len4 + ' | 5字母: ' + len5 + ' | 6+字母: ' + len6, W/2, 300);
  // Show best words
  let sorted = [...foundWords].sort((a, b) => b.length - a.length);
  ctx.fillStyle = '#8f8';
  ctx.font = '16px monospace';
  ctx.fillText('最长单词: ' + (sorted.length > 0 ? sorted.slice(0, 5).join(', ') : '无'), W/2, 340);
  if (sorted.length > 5) {
    ctx.fillStyle = '#6a6';
    ctx.font = '14px monospace';
    ctx.fillText(sorted.slice(5, 10).join(', '), W/2, 365);
  }
  // Rating
  ctx.fillStyle = '#fa0';
  ctx.font = '18px monospace';
  let rating = score >= 500 ? '拼字大师!' : score >= 300 ? '词汇达人!' : score >= 150 ? '不错哦!' : '继续加油!';
  ctx.fillText('评价: ' + rating, W/2, 400);
  ctx.fillStyle = '#ff0';
  ctx.font = '20px monospace';
  ctx.fillText('按 ENTER 重新开始', W/2, 445);
  ctx.textAlign = 'left';
}

function gameLoop() {
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
